name: Set up Rust
description: >
  Installs the toolchain `rust-toolchain.toml` pins, an extra target if a job
  builds for one, and a build cache keyed to one job.

inputs:
  cache-key:
    description: >
      Distinguishes this job's cache from the other jobs'. Jobs that compile the
      same way should share a key.
    required: true
  target:
    description: >
      A target triple to install besides the host's, such as
      `x86_64-unknown-linux-musl`. Empty builds for the host only.
    required: false
    default: ''
  cache:
    description: >
      Whether to restore and save the build cache: `false` for a release,
      which is built from its source alone.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # `rust-toolchain.toml` stays the single pin: rustup reads it here the same
    # way it does on a developer machine, components included.
    - name: Install the pinned toolchain
      shell: bash
      run: |
        rustup show active-toolchain || rustup toolchain install
        rustc --version
        cargo --version

    - name: Install the target
      if: inputs.target != ''
      shell: bash
      run: rustup target add '${{ inputs.target }}'

    # C code that crates compile in, such as zstd's, needs a musl C compiler to
    # link into a static musl binary.
    - name: Install the musl C toolchain
      if: contains(inputs.target, 'musl')
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends --yes musl-tools

    - name: Restore the build cache
      if: inputs.cache == 'true'
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: ${{ inputs.cache-key }}

    # A resolution that Cargo.lock cannot satisfy fails here, before a job spends
    # minutes compiling, and it fails loudly instead of quietly updating the lock.
    - name: Check Cargo.lock is current
      shell: bash
      run: cargo fetch --locked
