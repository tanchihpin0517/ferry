name: CI

# A branch push and its pull request would otherwise run the same commits twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request makes the previous run's answer irrelevant. Runs
# on `main` are the record of what landed, so they are left to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# Every job runs a `make` target, so a failure here is reproducible with one
# command locally. `make check` is the same set in sequence.
jobs:
  format:
    name: Format
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: format
      - run: make fmt

  lint:
    name: Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Code behind `cfg(target_os = ...)` is only linted where it compiles.
        os: [ubuntu-26.04, macos-26]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: lint
      # Locally clippy findings stay warnings so a half-finished edit still
      # compiles; here the same findings fail the job.
      - run: make lint LINT_DENY=-Dwarnings

  # The dependencies, against deny.toml: advisories, licenses, sources.
  deny:
    name: Dependencies
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Pinned to a commit, as a tag can be moved.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny
      - run: make deny

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # The runner image ships shellcheck.
      - run: make shellcheck

  # Every platform a release ships for, plus the previous OS release of each.
  # Labels are pinned rather than `-latest`, so a runner image migration shows
  # up as a change to this file instead of as an unexplained failure.
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Ubuntu 26.04 x86_64, os: ubuntu-26.04 }
          - { name: Ubuntu 24.04 x86_64, os: ubuntu-24.04 }
          - { name: Ubuntu 26.04 aarch64, os: ubuntu-26.04-arm }
          - { name: Ubuntu 24.04 aarch64, os: ubuntu-24.04-arm }
          # The static builds Linux releases ship.
          - { name: Ubuntu 26.04 x86_64 musl, os: ubuntu-26.04, target: x86_64-unknown-linux-musl }
          - { name: Ubuntu 26.04 aarch64 musl, os: ubuntu-26.04-arm, target: aarch64-unknown-linux-musl }
          - { name: macOS 26 arm64, os: macos-26 }
          - { name: macOS 15 arm64, os: macos-15 }
          - { name: macOS 26 x86_64, os: macos-26-intel }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: test-${{ matrix.target || 'host' }}
          target: ${{ matrix.target || '' }}
      # Each test with a time limit: see .config/nextest.toml. Pinned to a
      # commit, as a tag can be moved.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest
      # Login shells other than sh, which pass on the commands Ferry runs on
      # a host: see src/remote/shell.rs. macOS has csh and tcsh already. And
      # strace, which sees that what is copied is synced.
      - if: matrix.name == 'Ubuntu 26.04 x86_64'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes csh tcsh fish strace
      - run: make test TARGET=${{ matrix.target || '' }}

  # GitHub's Linux runners are all Ubuntu, so other distributions run in
  # containers. A container shares the runner's kernel, so this tests each
  # distribution's userland, such as its C library, not its kernel or
  # filesystems. Docker is run from a step rather than as the job's container,
  # because JavaScript actions such as checkout may not run inside Alpine.
  test-distro:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # RHEL-compatible, as most HPC clusters run. Rocky 8's glibc 2.28 is
          # the oldest here, and its shell and tools too.
          - { name: Rocky Linux 8, image: 'rockylinux/rockylinux:8' }
          - { name: Debian 13, image: 'debian:13' }
          # The newest glibc and toolchain, to see breakage early.
          - { name: Fedora, image: 'fedora:latest' }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: make container-test IMAGE=${{ matrix.image }}

  # The runner's disk is ext4. Other filesystems differ in what Ferry relies
  # on, such as renames, fsync, and timestamps, so the tests also run on each,
  # made on a loop device.
  test-filesystem:
    name: Test (${{ matrix.fs }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # ext4-casefold: a directory that ignores case, as on a Mac.
        fs: [xfs, btrfs, ext4-casefold]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: test-filesystem
      # Each test with a time limit: see .config/nextest.toml. Pinned to a
      # commit, as a tag can be moved.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes xfsprogs btrfs-progs
      - run: make filesystem-test FS=${{ matrix.fs }}

  # What only root can do, owners mapped or kept, setuid bits, devices and a
  # bind mount, is skipped elsewhere: here the tests run as root, with the
  # runner's sudo, which asks no password.
  test-root:
    name: Test (root)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: test-root
      - run: make root-test

  # The fuzz targets, of what a peer may send, still build: they are run
  # nightly, in fuzz.yml, but use the library as it is here.
  fuzz-build:
    name: Fuzz targets
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: rustup toolchain install nightly --profile minimal
      # Pinned to a commit, as a tag can be moved.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-fuzz
      - run: make fuzz-build

  # One check to require on `main`, so adding a job above does not mean editing
  # branch protection. `always()` makes a skipped or cancelled dependency fail
  # here rather than pass by omission.
  ci:
    name: CI
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    if: always()
    needs: [format, lint, deny, shellcheck, test, test-distro, test-filesystem, test-root, fuzz-build]
    steps:
      - name: Report whether every job succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "job results: $results"
          for result in $results; do
            if [[ "$result" != success ]]; then
              echo "a required job did not succeed" >&2
              exit 1
            fi
          done
