name: Release

# A tag `v<version>` publishes that version: one binary per platform, and a
# SHA256SUMS of them, which is what a release client downloads to install
# itself on a host; and install.sh, which installs the binary on a machine.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        # Each target builds on a runner of its own architecture, so its
        # binary can run there before it is published.
        include:
          - { os: ubuntu-26.04, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-26.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-26, target: aarch64-apple-darwin }
          - { os: macos-26-intel, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v5
      # A client downloads the release named by its own version, so a tag that
      # differs from Cargo.toml's would publish binaries no client asks for.
      - name: Check the tag is the version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "the tag $GITHUB_REF_NAME is not v$version, Cargo.toml's version" >&2
            exit 1
          fi
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release-${{ matrix.target }}
          target: ${{ matrix.target }}
      - run: make test TARGET=${{ matrix.target }}
      - run: make release TARGET=${{ matrix.target }}
      - name: Check the binary is static
        if: contains(matrix.target, 'linux')
        shell: bash
        run: |
          file dist/ferry-*
          file dist/ferry-* | grep -Eq 'statically linked|static-pie linked'
      - name: Run the binary
        shell: bash
        run: dist/ferry-* --version
      - run: make install-test TARGET=${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/ferry-*
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - run: make install-script
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum ferry-* > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "Ferry ${GITHUB_REF_NAME#v}"
          --generate-notes
