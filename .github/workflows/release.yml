name: Release

# A tag `v<version>` publishes that version: one binary per platform, and a
# SHA256SUMS of them, which is what a release client downloads to install
# itself on a host; and install.sh, which installs the binary on a machine.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        # Each target builds on a runner of its own architecture, so its
        # binary can run there before it is published.
        include:
          - { os: ubuntu-26.04, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-26.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-26, target: aarch64-apple-darwin }
          - { os: macos-26-intel, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # A client downloads the release named by its own version, so a tag that
      # differs from Cargo.toml's would publish binaries no client asks for.
      # And a release says what changed, in CHANGELOG.md: checked here, before
      # anything is built.
      - name: Check the tag is the version, and has notes
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "the tag $GITHUB_REF_NAME is not v$version, Cargo.toml's version" >&2
            exit 1
          fi
          scripts/release-notes.sh "$version" > /dev/null
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release-${{ matrix.target }}
          target: ${{ matrix.target }}
          # A release is built from its source alone, not from what an
          # earlier build left.
          cache: 'false'
      - run: make test TARGET=${{ matrix.target }}
      - run: make release TARGET=${{ matrix.target }}
      - name: Check the binary is static
        if: contains(matrix.target, 'linux')
        shell: bash
        run: |
          file dist/ferry-*
          file dist/ferry-* | grep -Eq 'statically linked|static-pie linked'
      - name: Run the binary
        shell: bash
        run: dist/ferry-* --version
      - run: make install-test TARGET=${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/ferry-*
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: make install-script
      # The licenses of what the release is built from, published with it.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-about
      - run: make licenses
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum ferry-* THIRD-PARTY-LICENSES.txt > SHA256SUMS
          cat SHA256SUMS
      # Its notes are its section of CHANGELOG.md.
      - run: scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "Ferry ${GITHUB_REF_NAME#v}"
          --notes-file notes.md
