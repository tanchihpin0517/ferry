[package]
name = "ferry"
version = "0.14.4"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/tanchihpin0517/ferry"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.190"
mimalloc = { version = "0.1.52", default-features = false }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
rustix = { version = "1.1.5", features = ["fs", "net", "process", "termios", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = { version = "0.11.1", default-features = false }
tar = { version = "0.4.46", default-features = false }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
zstd = { version = "0.14.2", default-features = false }

[build-dependencies]
blake3 = "1.8.7"

[dev-dependencies]
tempfile = "3.27.0"

# The dependencies that do the heavy lifting are optimised even in dev builds,
# so that a dev build's speed says something about a release's.
[profile.dev.package.zstd-sys]
opt-level = 3

[profile.dev.package.blake3]
opt-level = 3

[profile.dev.package.libmimalloc-sys]
opt-level = 3
