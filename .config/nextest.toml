# How `make test` runs the tests: each in a process of its own, with a time
# limit, so that one that hangs is ended and named, rather than holding the run
# until a CI job's timeout says nothing of which test it was.

[profile.default]
slow-timeout = { period = "60s", terminate-after = 3 }

# `ferry test --scale` makes and copies trees of its own, and takes longer.
[[profile.default.overrides]]
filter = "test(/^at_scale/)"
slow-timeout = { period = "120s", terminate-after = 5 }

# CI, which sets `CI`: every test runs, whatever fails, and what failed is
# shown as it fails and again at the end.
[profile.ci]
slow-timeout = { period = "60s", terminate-after = 3 }
fail-fast = false
failure-output = "immediate-final"

[[profile.ci.overrides]]
filter = "test(/^at_scale/)"
slow-timeout = { period = "120s", terminate-after = 5 }
