<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1160" viewBox="0 0 1100 1160" role="img" aria-labelledby="title description">
  <title id="title">三種連線的準備</title>
  <desc id="description">三種連線的準備，原樣的 bytes，箭頭的終點是讀走那一段的程式。a，link：client 的 monitor 寫 01，或 port 的 secret，monitor 裡的 listener 讀到就回 start mark；client 再寫 Follow，帶 link 的壓縮設定；之後 ready，link 的 control pipe。b，主機上的 control connection：client 寫 01 或 secret，listener 回 start mark；client 寫 Launch，monitor 讀，把連線交給經 sudo 新起的 server；要密碼時 client 寫密碼行，sudo 讀；client 寫 Hello，帶 build、角色、根目錄與這條連線的壓縮設定，server 讀；server 回 start mark、Welcome 與 end mark；之後 ready，reports 與 control。client 依序寫出，不必等。本機沒有 listener、monitor 與 sudo，只有 Hello 與答案。c，stream：client 做 socket pair，先寫進兩端 01 或 secret，以及編號與壓縮等級的 header；再把兩端交出，本機經 server 的 socket 給 fd，主機接上 ssh -W；兩頭各寫一個 start mark 給對面，主機上由 server 的 listener 寫，本機那頭由 client 代寫；server 讀完 header、跳到對面來的 start mark，就 ready：manifest、data、answers 與 control。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <marker id="arrow-path" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-path"/>
    </marker>
    <marker id="arrow-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-client"/>
    </marker>
    <marker id="arrow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-hot"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-fail"/>
    </marker>
    <marker id="arrow-peer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-peer"/>
    </marker>
    <style>
      :root {
        --text: #172033;
        --muted: #526078;
        --surface: #f7f9fc;
        --surface-strong: #e9eef8;
        --border: #8491a8;
        --group: #b4bdcc;
        --peer: #e5efff;
        --peer-border: #3478c8;
        --client: #f1ecfb;
        --client-border: #7b56c4;
        --path: #27875b;
        --path-surface: #e3f3ea;
        --hot: #b7791f;
        --hot-surface: #fdf2dc;
        --fail: #c2412d;
        --fail-surface: #fdecea;
        --badge: #172033;
        --badge-text: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #eef3fb;
          --muted: #b5c0d3;
          --surface: #202938;
          --surface-strong: #2b3850;
          --border: #8390a6;
          --group: #5a667a;
          --peer: #193a62;
          --peer-border: #6aa8f0;
          --client: #2e2547;
          --client-border: #b39af0;
          --path: #5bc792;
          --path-surface: #16382a;
          --hot: #f0b44c;
          --hot-surface: #41321a;
          --fail: #ff8a70;
          --fail-surface: #4a2420;
          --badge: #eef3fb;
          --badge-text: #172033;
        }
      }
      text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans CJK TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; font-size: 15px; text-anchor: middle; }
      .title { font-weight: 700; }
      .h { font-weight: 700; font-size: 17px; }
      .small { fill: var(--muted); font-size: 13px; }
      .label { fill: var(--muted); font-size: 12.5px; }
      .group-label { fill: var(--muted); font-size: 13.5px; font-weight: 700; letter-spacing: .05em; }
      .start { text-anchor: start; }
      .end { text-anchor: end; }
      .group { fill: none; stroke: var(--group); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .panel { fill: none; stroke: var(--group); stroke-width: 1.5; }
      .node { fill: var(--surface); stroke: var(--border); stroke-width: 1.8; }
      .strong { fill: var(--surface-strong); stroke: var(--border); stroke-width: 1.8; }
      .peer { fill: var(--peer); stroke: var(--peer-border); stroke-width: 2; }
      .client { fill: var(--client); stroke: var(--client-border); stroke-width: 2; }
      .hot { fill: var(--hot-surface); stroke: var(--hot); stroke-width: 2.2; }
      .failbox { fill: var(--fail-surface); stroke: var(--fail); stroke-width: 2.2; }
      .pathbox { fill: var(--path-surface); stroke: var(--path); stroke-width: 2; }
      .ghost { fill: none; stroke: var(--border); stroke-width: 1.5; stroke-dasharray: 4 4; }
      .bar { fill: var(--surface-strong); stroke: var(--border); stroke-width: 1.2; }
      .bar-peer { fill: var(--peer); stroke: var(--peer-border); stroke-width: 1.2; }
      .bar-hot { fill: var(--hot-surface); stroke: var(--hot); stroke-width: 1.5; }
      .bar-fail { fill: var(--fail-surface); stroke: var(--fail); stroke-width: 1.5; }
      .bar-path { fill: var(--path-surface); stroke: var(--path); stroke-width: 1.5; }
      .bar-idle { fill: none; stroke: var(--group); stroke-width: 1.2; stroke-dasharray: 3 3; }
      .edge { fill: none; stroke: var(--border); stroke-width: 2.2; marker-end: url(#arrow); }
      .edge-plain { fill: none; stroke: var(--border); stroke-width: 2; }
      .edge-dash { fill: none; stroke: var(--border); stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .path-edge { fill: none; stroke: var(--path); stroke-width: 2.6; marker-end: url(#arrow-path); }
      .path-line { fill: none; stroke: var(--path); stroke-width: 2.6; }
      .path-dash { fill: none; stroke: var(--path); stroke-width: 2.2; stroke-dasharray: 7 5; marker-end: url(#arrow-path); }
      .client-edge { fill: none; stroke: var(--client-border); stroke-width: 2.2; marker-end: url(#arrow-client); }
      .client-dash { fill: none; stroke: var(--client-border); stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow-client); }
      .hot-edge { fill: none; stroke: var(--hot); stroke-width: 2.4; marker-end: url(#arrow-hot); }
      .hot-dash { fill: none; stroke: var(--hot); stroke-width: 2.2; stroke-dasharray: 6 5; marker-end: url(#arrow-hot); }
      .fail-edge { fill: none; stroke: var(--fail); stroke-width: 2.4; marker-end: url(#arrow-fail); }
      .fail-line { fill: none; stroke: var(--fail); stroke-width: 3; }
      .peer-edge { fill: none; stroke: var(--peer-border); stroke-width: 2.4; marker-end: url(#arrow-peer); }
      .arrow-head { fill: var(--border); }
      .arrow-path { fill: var(--path); }
      .arrow-client { fill: var(--client-border); }
      .arrow-hot { fill: var(--hot); }
      .arrow-fail { fill: var(--fail); }
      .arrow-peer { fill: var(--peer-border); }
      .path-text { fill: var(--path); font-weight: 700; }
      .client-text { fill: var(--client-border); font-weight: 700; }
      .hot-text { fill: var(--hot); font-weight: 700; }
      .fail-text { fill: var(--fail); font-weight: 700; }
      .peer-text { fill: var(--peer-border); font-weight: 700; }
      .badge { fill: var(--badge); }
      .badge-text { fill: var(--badge-text); font-size: 12px; font-weight: 700; }
      .hot-badge { fill: var(--hot); }
      .dot { fill: var(--border); }
    </style>
  </defs>
  <defs>
    <marker id="arrow-left" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="0">
      <path d="M 10 0 L 0 5 L 10 10 z" class="arrow-head"/>
    </marker>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="90">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <marker id="arrow-up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="270">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <marker id="path-left" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="0">
      <path d="M 10 0 L 0 5 L 10 10 z" class="arrow-path"/>
    </marker>
    <marker id="path-right" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="0">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-path"/>
    </marker>
    <marker id="fail-down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="90">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-fail"/>
    </marker>
    <marker id="fail-right" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="0">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-fail"/>
    </marker>
  </defs>
  <text class="group-label start" x="20" y="28">a. link：client 的 monitor 與主機的 monitor</text>
  <rect class="client" x="95" y="42" width="170" height="46" rx="6"/>
  <text class="title" x="180" y="62">client 的 monitor</text>
  <text class="label" x="180" y="80">這台機器</text>
  <rect class="node" x="465" y="42" width="170" height="46" rx="6"/>
  <text class="title" x="550" y="62">listener</text>
  <text class="label" x="550" y="80">在主機的 monitor 裡</text>
  <rect class="peer" x="835" y="42" width="170" height="46" rx="6"/>
  <text class="title" x="920" y="62">主機的 monitor</text>
  <text class="label" x="920" y="80">first session exec 而成</text>
  <path class="bar-idle" d="M 180 88 V 220"/>
  <path class="bar-idle" d="M 550 88 V 220"/>
  <path class="bar-idle" d="M 920 88 V 220"/>
  <path class="edge" d="M 180 122 H 546"/>
  <text class="small" x="365" y="114">01，或 port 的 secret</text>
  <path class="path-line" stroke-width="2.2" marker-end="url(#path-left)" d="M 550 162 H 184"/>
  <text class="small" x="365" y="154">start mark：到了</text>
  <path class="edge" d="M 180 202 H 916"/>
  <text class="small" x="550" y="194">Follow { 壓縮 }：說明用途，帶 link 的設定</text>
  <rect class="pathbox" x="95" y="226" width="910" height="34" rx="6"/>
  <text class="small path-text" x="550" y="248">ready：link 的 control pipe，雙向</text>
  <text class="small start" x="20" y="284">listener 讀到 01 就回 start mark；從 port 來的，要先給對 64 個十六進位字元的 secret。</text>
  <text class="group-label start" x="20" y="332">b. control connection：client 與主機上的 server</text>
  <rect class="client" x="25" y="346" width="170" height="46" rx="6"/>
  <text class="title" x="110" y="375">client</text>
  <rect class="node" x="245" y="346" width="170" height="46" rx="6"/>
  <text class="title" x="330" y="366">listener</text>
  <text class="label" x="330" y="384">在 monitor 裡</text>
  <rect class="peer" x="465" y="346" width="170" height="46" rx="6"/>
  <text class="title" x="550" y="375">主機的 monitor</text>
  <rect class="hot" x="685" y="346" width="170" height="46" rx="6"/>
  <text class="title" x="770" y="366">sudo</text>
  <text class="label" x="770" y="384">只有 --remote-sudo</text>
  <rect class="peer" x="905" y="346" width="170" height="46" rx="6"/>
  <text class="title" x="990" y="366">server</text>
  <text class="label" x="990" y="384">Source 或 Destination</text>
  <path class="bar-idle" d="M 110 392 V 684"/>
  <path class="bar-idle" d="M 330 392 V 684"/>
  <path class="bar-idle" d="M 550 392 V 684"/>
  <path class="bar-idle" d="M 770 392 V 684"/>
  <path class="bar-idle" d="M 990 392 V 684"/>
  <path class="edge" d="M 110 426 H 326"/>
  <text class="small" x="220" y="418">01 或 secret</text>
  <path class="path-line" stroke-width="2.2" marker-end="url(#path-left)" d="M 330 466 H 114"/>
  <text class="small" x="220" y="458">start mark</text>
  <path class="edge" d="M 110 506 H 546"/>
  <text class="small" x="330" y="498">Launch { id, Server }</text>
  <path class="edge-plain" stroke-dasharray="6 5" marker-end="url(#arrow)" d="M 550 546 H 986"/>
  <text class="small" x="770" y="538">交出連線：經 sudo 起 ferry server</text>
  <path class="edge" d="M 110 586 H 766"/>
  <text class="small" x="440" y="578">密碼行（要密碼時）</text>
  <path class="edge" d="M 110 626 H 986"/>
  <text class="small" x="550" y="618">Hello { build、角色、根目錄、壓縮、… }</text>
  <path class="path-line" stroke-width="2.2" marker-end="url(#path-left)" d="M 990 666 H 114"/>
  <text class="small" x="550" y="658">start mark、Welcome { socket、port、根目錄的身分 }、end mark</text>
  <rect class="pathbox" x="25" y="690" width="1050" height="34" rx="6"/>
  <text class="small path-text" x="550" y="712">ready：reports（server → client），control（雙向）</text>
  <text class="small start" x="20" y="748">client 依序寫出，不必等；每一段由箭頭終點的程式讀走，讀完才輪到下一個。</text>
  <text class="small start" x="20" y="770">本機沒有 listener、monitor 與 sudo：client 以 pipe 起 server，只有 Hello 與答案。</text>
  <text class="group-label start" x="20" y="818">c. stream：兩個 server 之間，由 client 做</text>
  <rect class="peer" x="65" y="832" width="170" height="46" rx="6"/>
  <text class="title" x="150" y="861">Source server</text>
  <rect class="client" x="465" y="832" width="170" height="46" rx="6"/>
  <text class="title" x="550" y="852">client</text>
  <text class="label" x="550" y="870">做 socket pair</text>
  <rect class="peer" x="865" y="832" width="170" height="46" rx="6"/>
  <text class="title" x="950" y="861">Destination server</text>
  <path class="bar-idle" d="M 150 878 V 1050"/>
  <path class="bar-idle" d="M 550 878 V 1050"/>
  <path class="bar-idle" d="M 950 878 V 1050"/>
  <path class="edge-plain" marker-end="url(#arrow-left)" d="M 550 912 H 154"/>
  <text class="small" x="350" y="904">先寫進去：01 或 secret（主機）、[編號][壓縮]</text>
  <path class="edge" d="M 550 912 H 946"/>
  <text class="small" x="750" y="904">先寫進去：01 或 secret（主機）、[編號][壓縮]</text>
  <path class="edge-plain" stroke-dasharray="6 5" marker-end="url(#arrow-left)" d="M 550 952 H 154"/>
  <text class="small" x="350" y="944">交出：本機經 socket 給 fd；主機接上 ssh -W</text>
  <path class="edge-plain" stroke-dasharray="6 5" marker-end="url(#arrow)" d="M 550 952 H 946"/>
  <text class="small" x="750" y="944">交出：同左</text>
  <path class="path-line" stroke-width="2.2" marker-end="url(#path-left)" d="M 950 992 H 154"/>
  <text class="small" x="550" y="984">start mark：Destination 那頭寫的</text>
  <path class="path-line" stroke-width="2.2" marker-end="url(#path-right)" d="M 150 1032 H 946"/>
  <text class="small" x="550" y="1024">start mark：Source 那頭寫的</text>
  <rect class="pathbox" x="65" y="1056" width="970" height="34" rx="6"/>
  <text class="small path-text" x="550" y="1078">ready：manifest、data（S → D），answers（D → S），control（雙向）</text>
  <text class="small start" x="20" y="1114">主機上的 server，由 listener 讀 01 並回 start mark；另一頭在本機時，那個 server 不先寫東西，由 client 代它寫。</text>
  <text class="small start" x="20" y="1136">server 讀完 [編號][壓縮]，跳到對面來的 start mark，就 ready。K 條 stream 各做一次，編號 0 到 K−1。</text>
</svg>
