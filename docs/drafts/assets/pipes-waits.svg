<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510" role="img" aria-labelledby="title description">
  <title id="title">等待不成環</title>
  <desc id="description">a，允許的等待：箭頭是寫的一方可能等讀的一方。掃描等 manifest 的窗口，也就是比較；送資料等 data 的窗口，也就是驗證；比較與驗證都交給決策者；決策者等 answers 的窗口，也就是 Source 讀 answers 的 thread，而它從不等：收到的交給 owner，佇列沒有上限。每條等待最後都走到一個從不等的讀者，不成環。b，反例：如果等著讀的檔案太多時，owner 就不讀 answers，那麼決策者寫 answers 卡住，驗證交不出記錄，data pipe 沒人讀，Source 的 data 窗口用完、送不出檔案，等著讀的檔案就減不下來，owner 也就一直不讀：成環，誰都等不到。所以 BACKLOG 照舊由 owner 讓掃描等。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <marker id="arrow-path" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-path"/>
    </marker>
    <marker id="arrow-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-client"/>
    </marker>
    <marker id="arrow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-hot"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-fail"/>
    </marker>
    <marker id="arrow-peer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-peer"/>
    </marker>
    <style>
      :root {
        --text: #172033;
        --muted: #526078;
        --surface: #f7f9fc;
        --surface-strong: #e9eef8;
        --border: #8491a8;
        --group: #b4bdcc;
        --peer: #e5efff;
        --peer-border: #3478c8;
        --client: #f1ecfb;
        --client-border: #7b56c4;
        --path: #27875b;
        --path-surface: #e3f3ea;
        --hot: #b7791f;
        --hot-surface: #fdf2dc;
        --fail: #c2412d;
        --fail-surface: #fdecea;
        --badge: #172033;
        --badge-text: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #eef3fb;
          --muted: #b5c0d3;
          --surface: #202938;
          --surface-strong: #2b3850;
          --border: #8390a6;
          --group: #5a667a;
          --peer: #193a62;
          --peer-border: #6aa8f0;
          --client: #2e2547;
          --client-border: #b39af0;
          --path: #5bc792;
          --path-surface: #16382a;
          --hot: #f0b44c;
          --hot-surface: #41321a;
          --fail: #ff8a70;
          --fail-surface: #4a2420;
          --badge: #eef3fb;
          --badge-text: #172033;
        }
      }
      text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans CJK TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; font-size: 15px; text-anchor: middle; }
      .title { font-weight: 700; }
      .h { font-weight: 700; font-size: 17px; }
      .small { fill: var(--muted); font-size: 13px; }
      .label { fill: var(--muted); font-size: 12.5px; }
      .group-label { fill: var(--muted); font-size: 13.5px; font-weight: 700; letter-spacing: .05em; }
      .start { text-anchor: start; }
      .end { text-anchor: end; }
      .group { fill: none; stroke: var(--group); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .panel { fill: none; stroke: var(--group); stroke-width: 1.5; }
      .node { fill: var(--surface); stroke: var(--border); stroke-width: 1.8; }
      .strong { fill: var(--surface-strong); stroke: var(--border); stroke-width: 1.8; }
      .peer { fill: var(--peer); stroke: var(--peer-border); stroke-width: 2; }
      .client { fill: var(--client); stroke: var(--client-border); stroke-width: 2; }
      .hot { fill: var(--hot-surface); stroke: var(--hot); stroke-width: 2.2; }
      .failbox { fill: var(--fail-surface); stroke: var(--fail); stroke-width: 2.2; }
      .pathbox { fill: var(--path-surface); stroke: var(--path); stroke-width: 2; }
      .ghost { fill: none; stroke: var(--border); stroke-width: 1.5; stroke-dasharray: 4 4; }
      .bar { fill: var(--surface-strong); stroke: var(--border); stroke-width: 1.2; }
      .bar-peer { fill: var(--peer); stroke: var(--peer-border); stroke-width: 1.2; }
      .bar-hot { fill: var(--hot-surface); stroke: var(--hot); stroke-width: 1.5; }
      .bar-fail { fill: var(--fail-surface); stroke: var(--fail); stroke-width: 1.5; }
      .bar-path { fill: var(--path-surface); stroke: var(--path); stroke-width: 1.5; }
      .bar-idle { fill: none; stroke: var(--group); stroke-width: 1.2; stroke-dasharray: 3 3; }
      .edge { fill: none; stroke: var(--border); stroke-width: 2.2; marker-end: url(#arrow); }
      .edge-plain { fill: none; stroke: var(--border); stroke-width: 2; }
      .edge-dash { fill: none; stroke: var(--border); stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .path-edge { fill: none; stroke: var(--path); stroke-width: 2.6; marker-end: url(#arrow-path); }
      .path-line { fill: none; stroke: var(--path); stroke-width: 2.6; }
      .path-dash { fill: none; stroke: var(--path); stroke-width: 2.2; stroke-dasharray: 7 5; marker-end: url(#arrow-path); }
      .client-edge { fill: none; stroke: var(--client-border); stroke-width: 2.2; marker-end: url(#arrow-client); }
      .client-dash { fill: none; stroke: var(--client-border); stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow-client); }
      .hot-edge { fill: none; stroke: var(--hot); stroke-width: 2.4; marker-end: url(#arrow-hot); }
      .hot-dash { fill: none; stroke: var(--hot); stroke-width: 2.2; stroke-dasharray: 6 5; marker-end: url(#arrow-hot); }
      .fail-edge { fill: none; stroke: var(--fail); stroke-width: 2.4; marker-end: url(#arrow-fail); }
      .fail-line { fill: none; stroke: var(--fail); stroke-width: 3; }
      .peer-edge { fill: none; stroke: var(--peer-border); stroke-width: 2.4; marker-end: url(#arrow-peer); }
      .arrow-head { fill: var(--border); }
      .arrow-path { fill: var(--path); }
      .arrow-client { fill: var(--client-border); }
      .arrow-hot { fill: var(--hot); }
      .arrow-fail { fill: var(--fail); }
      .arrow-peer { fill: var(--peer-border); }
      .path-text { fill: var(--path); font-weight: 700; }
      .client-text { fill: var(--client-border); font-weight: 700; }
      .hot-text { fill: var(--hot); font-weight: 700; }
      .fail-text { fill: var(--fail); font-weight: 700; }
      .peer-text { fill: var(--peer-border); font-weight: 700; }
      .badge { fill: var(--badge); }
      .badge-text { fill: var(--badge-text); font-size: 12px; font-weight: 700; }
      .hot-badge { fill: var(--hot); }
      .dot { fill: var(--border); }
    </style>
  </defs>
  <defs>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="90">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <marker id="fail-down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="90">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-fail"/>
    </marker>
    <marker id="fail-up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="270">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-fail"/>
    </marker>
    <marker id="fail-left" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="180">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-fail"/>
    </marker>
  </defs>

  <!-- a. Allowed -->
  <rect class="group" x="20" y="20" width="520" height="470" rx="14"/>
  <text class="group-label start" x="36" y="44">a. 允許的等待：最後都走到一個從不等的讀者</text>
  <text class="small start" x="36" y="66">箭頭：寫的一方可能等讀的一方</text>

  <rect class="peer" x="50" y="90" width="190" height="50" rx="8"/>
  <text class="title" x="145" y="111">掃描</text>
  <text class="small" x="145" y="130">寫 manifest</text>
  <rect class="peer" x="300" y="90" width="190" height="50" rx="8"/>
  <text class="title" x="395" y="111">送資料</text>
  <text class="small" x="395" y="130">寫 data</text>

  <path class="edge-plain" marker-end="url(#arrow-down)" d="M 145 140 V 186"/>
  <text class="label start" x="153" y="168">manifest 的窗口</text>
  <path class="edge-plain" marker-end="url(#arrow-down)" d="M 395 140 V 186"/>
  <text class="label start" x="403" y="168">data 的窗口</text>

  <rect class="peer" x="50" y="190" width="190" height="50" rx="8"/>
  <text class="title" x="145" y="211">比較</text>
  <text class="small" x="145" y="230">讀 manifest</text>
  <rect class="peer" x="300" y="190" width="190" height="50" rx="8"/>
  <text class="title" x="395" y="211">驗證</text>
  <text class="small" x="395" y="230">讀 data</text>

  <path class="edge-plain" marker-end="url(#arrow-down)" d="M 145 240 V 262 H 230 V 286"/>
  <path class="edge-plain" marker-end="url(#arrow-down)" d="M 395 240 V 262 H 310 V 286"/>
  <text class="label" x="270" y="256">交給決策者</text>

  <rect class="peer" x="175" y="290" width="190" height="50" rx="8"/>
  <text class="title" x="270" y="311">決策者</text>
  <text class="small" x="270" y="330">寫 answers</text>

  <path class="edge-plain" marker-end="url(#arrow-down)" d="M 270 340 V 386"/>
  <text class="label start" x="278" y="368">answers 的窗口</text>

  <rect class="pathbox" x="175" y="390" width="190" height="56" rx="8"/>
  <text class="title" x="270" y="412">讀 answers</text>
  <text class="small" x="270" y="432">從不等：交給 owner</text>
  <text class="small path-text" x="280" y="474">不成環：每個被擋的，都一定會被放行</text>

  <!-- b. Counterexample -->
  <rect class="group" x="560" y="20" width="520" height="470" rx="14"/>
  <text class="group-label start" x="576" y="44">b. 反例：owner 不讀 answers，就成環</text>

  <rect class="failbox" x="580" y="100" width="150" height="70" rx="8"/>
  <text class="title" x="655" y="125">owner</text>
  <text class="small" x="655" y="145">等著讀的太多</text>
  <text class="small" x="655" y="162">不讀 answers</text>
  <rect class="hot" x="745" y="100" width="150" height="70" rx="8"/>
  <text class="title" x="820" y="130">決策者</text>
  <text class="small" x="820" y="152">寫 answers 卡住</text>
  <rect class="hot" x="910" y="100" width="150" height="70" rx="8"/>
  <text class="title" x="985" y="130">驗證</text>
  <text class="small" x="985" y="152">交不出記錄</text>

  <rect class="hot" x="910" y="300" width="150" height="70" rx="8"/>
  <text class="title" x="985" y="330">data pipe</text>
  <text class="small" x="985" y="352">沒人讀</text>
  <rect class="hot" x="745" y="300" width="150" height="70" rx="8"/>
  <text class="title" x="820" y="325">Source</text>
  <text class="small" x="820" y="345">data 的窗口用完</text>
  <text class="small" x="820" y="362">送不出檔案</text>
  <rect class="hot" x="580" y="300" width="150" height="70" rx="8"/>
  <text class="title" x="655" y="330">等著讀的檔案</text>
  <text class="small" x="655" y="352">減不下來</text>

  <path class="fail-edge" d="M 730 135 H 743"/>
  <path class="fail-edge" d="M 895 135 H 908"/>
  <path class="fail-line" stroke-width="2.4" marker-end="url(#fail-down)" d="M 985 170 V 296"/>
  <path class="fail-line" stroke-width="2.4" marker-end="url(#fail-left)" d="M 910 335 H 899"/>
  <path class="fail-line" stroke-width="2.4" marker-end="url(#fail-left)" d="M 745 335 H 734"/>
  <path class="fail-line" stroke-width="2.4" marker-end="url(#fail-up)" d="M 655 300 V 174"/>

  <text class="title fail-text" x="820" y="228">成環：誰都等不到</text>
  <text class="small" x="820" y="252">所以 BACKLOG 照舊留在 peer：</text>
  <text class="small" x="820" y="272">owner 讓掃描等，掃描誰都不擋</text>

  <text class="small start" x="580" y="420">掃描是純粹的生產者：讓它等，不會擋住任何人的下游。</text>
  <text class="small start" x="580" y="444">要擋，只擋在沒有人在等它的地方。</text>
</svg>
