<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title description">
  <title id="title">比較變慢時：現在與 pipe</title>
  <desc id="description">a，現在：Destination 的 receive thread 把 manifest 的段交給比較，parts_in 只放得下 4 段；比較變慢，它就卡在 parts_in.send，連資料封包也不讀了，decoder 閒著，stream 塞住，Source 的 manifest 與資料一起停。b，pipe：接收 thread 照常把封包分進各 pipe 的 buffer；manifest 的 buffer 滿了，就是 manifest 的窗口用完，只有掃描在等；資料走自己的窗口，照常送、照常驗證。比較讀走多少，才還多少 manifest 的窗口。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <marker id="arrow-path" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-path"/>
    </marker>
    <marker id="arrow-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-client"/>
    </marker>
    <marker id="arrow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-hot"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-fail"/>
    </marker>
    <marker id="arrow-peer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-peer"/>
    </marker>
    <style>
      :root {
        --text: #172033;
        --muted: #526078;
        --surface: #f7f9fc;
        --surface-strong: #e9eef8;
        --border: #8491a8;
        --group: #b4bdcc;
        --peer: #e5efff;
        --peer-border: #3478c8;
        --client: #f1ecfb;
        --client-border: #7b56c4;
        --path: #27875b;
        --path-surface: #e3f3ea;
        --hot: #b7791f;
        --hot-surface: #fdf2dc;
        --fail: #c2412d;
        --fail-surface: #fdecea;
        --badge: #172033;
        --badge-text: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #eef3fb;
          --muted: #b5c0d3;
          --surface: #202938;
          --surface-strong: #2b3850;
          --border: #8390a6;
          --group: #5a667a;
          --peer: #193a62;
          --peer-border: #6aa8f0;
          --client: #2e2547;
          --client-border: #b39af0;
          --path: #5bc792;
          --path-surface: #16382a;
          --hot: #f0b44c;
          --hot-surface: #41321a;
          --fail: #ff8a70;
          --fail-surface: #4a2420;
          --badge: #eef3fb;
          --badge-text: #172033;
        }
      }
      text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans CJK TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; font-size: 15px; text-anchor: middle; }
      .title { font-weight: 700; }
      .h { font-weight: 700; font-size: 17px; }
      .small { fill: var(--muted); font-size: 13px; }
      .label { fill: var(--muted); font-size: 12.5px; }
      .group-label { fill: var(--muted); font-size: 13.5px; font-weight: 700; letter-spacing: .05em; }
      .start { text-anchor: start; }
      .end { text-anchor: end; }
      .group { fill: none; stroke: var(--group); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .panel { fill: none; stroke: var(--group); stroke-width: 1.5; }
      .node { fill: var(--surface); stroke: var(--border); stroke-width: 1.8; }
      .strong { fill: var(--surface-strong); stroke: var(--border); stroke-width: 1.8; }
      .peer { fill: var(--peer); stroke: var(--peer-border); stroke-width: 2; }
      .client { fill: var(--client); stroke: var(--client-border); stroke-width: 2; }
      .hot { fill: var(--hot-surface); stroke: var(--hot); stroke-width: 2.2; }
      .failbox { fill: var(--fail-surface); stroke: var(--fail); stroke-width: 2.2; }
      .pathbox { fill: var(--path-surface); stroke: var(--path); stroke-width: 2; }
      .ghost { fill: none; stroke: var(--border); stroke-width: 1.5; stroke-dasharray: 4 4; }
      .bar { fill: var(--surface-strong); stroke: var(--border); stroke-width: 1.2; }
      .bar-peer { fill: var(--peer); stroke: var(--peer-border); stroke-width: 1.2; }
      .bar-hot { fill: var(--hot-surface); stroke: var(--hot); stroke-width: 1.5; }
      .bar-fail { fill: var(--fail-surface); stroke: var(--fail); stroke-width: 1.5; }
      .bar-path { fill: var(--path-surface); stroke: var(--path); stroke-width: 1.5; }
      .bar-idle { fill: none; stroke: var(--group); stroke-width: 1.2; stroke-dasharray: 3 3; }
      .edge { fill: none; stroke: var(--border); stroke-width: 2.2; marker-end: url(#arrow); }
      .edge-plain { fill: none; stroke: var(--border); stroke-width: 2; }
      .edge-dash { fill: none; stroke: var(--border); stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .path-edge { fill: none; stroke: var(--path); stroke-width: 2.6; marker-end: url(#arrow-path); }
      .path-line { fill: none; stroke: var(--path); stroke-width: 2.6; }
      .path-dash { fill: none; stroke: var(--path); stroke-width: 2.2; stroke-dasharray: 7 5; marker-end: url(#arrow-path); }
      .client-edge { fill: none; stroke: var(--client-border); stroke-width: 2.2; marker-end: url(#arrow-client); }
      .client-dash { fill: none; stroke: var(--client-border); stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow-client); }
      .hot-edge { fill: none; stroke: var(--hot); stroke-width: 2.4; marker-end: url(#arrow-hot); }
      .hot-dash { fill: none; stroke: var(--hot); stroke-width: 2.2; stroke-dasharray: 6 5; marker-end: url(#arrow-hot); }
      .fail-edge { fill: none; stroke: var(--fail); stroke-width: 2.4; marker-end: url(#arrow-fail); }
      .fail-line { fill: none; stroke: var(--fail); stroke-width: 3; }
      .peer-edge { fill: none; stroke: var(--peer-border); stroke-width: 2.4; marker-end: url(#arrow-peer); }
      .arrow-head { fill: var(--border); }
      .arrow-path { fill: var(--path); }
      .arrow-client { fill: var(--client-border); }
      .arrow-hot { fill: var(--hot); }
      .arrow-fail { fill: var(--fail); }
      .arrow-peer { fill: var(--peer-border); }
      .path-text { fill: var(--path); font-weight: 700; }
      .client-text { fill: var(--client-border); font-weight: 700; }
      .hot-text { fill: var(--hot); font-weight: 700; }
      .fail-text { fill: var(--fail); font-weight: 700; }
      .peer-text { fill: var(--peer-border); font-weight: 700; }
      .badge { fill: var(--badge); }
      .badge-text { fill: var(--badge-text); font-size: 12px; font-weight: 700; }
      .hot-badge { fill: var(--hot); }
      .dot { fill: var(--border); }
    </style>
  </defs>
  <defs>
    <marker id="arrow-path-down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="90">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-path"/>
    </marker>
  </defs>

  <!-- a. Now -->
  <rect class="group" x="20" y="20" width="1060" height="245" rx="14"/>
  <text class="group-label start" x="36" y="44">a. 現在：比較變慢，整條 stream 都停</text>

  <rect class="strong" x="40" y="80" width="150" height="150" rx="8"/>
  <text class="title" x="115" y="140">Source</text>
  <text class="small" x="115" y="162">manifest 與資料</text>
  <text class="small" x="115" y="180">都寫不出去</text>

  <path class="edge-plain" d="M 190 155 H 410"/>
  <rect class="bar-peer" x="210" y="149" width="14" height="12" rx="2"/>
  <rect class="bar-path" x="235" y="149" width="14" height="12" rx="2"/>
  <rect class="bar-path" x="260" y="149" width="14" height="12" rx="2"/>
  <rect class="bar-peer" x="285" y="149" width="14" height="12" rx="2"/>
  <rect class="bar-path" x="310" y="149" width="14" height="12" rx="2"/>
  <rect class="bar-path" x="335" y="149" width="14" height="12" rx="2"/>
  <rect class="bar-peer" x="360" y="149" width="14" height="12" rx="2"/>
  <text class="small fail-text" x="300" y="185">stream 塞住</text>

  <rect class="failbox" x="410" y="100" width="160" height="110" rx="8"/>
  <text class="title" x="490" y="145">receive thread</text>
  <text class="small fail-text" x="490" y="168">卡在 parts_in.send</text>

  <text class="small" x="676" y="100">parts_in：4 段，滿了</text>
  <rect class="bar-hot" x="612" y="110" width="28" height="26" rx="4"/>
  <rect class="bar-hot" x="644" y="110" width="28" height="26" rx="4"/>
  <rect class="bar-hot" x="676" y="110" width="28" height="26" rx="4"/>
  <rect class="bar-hot" x="708" y="110" width="28" height="26" rx="4"/>
  <path class="edge" d="M 570 123 H 608"/>
  <path class="edge" d="M 736 123 H 776"/>
  <rect class="hot" x="780" y="98" width="140" height="50" rx="8"/>
  <text class="title" x="850" y="119">比較</text>
  <text class="small hot-text" x="850" y="138">變慢</text>

  <path class="edge-dash" d="M 570 185 H 776"/>
  <text class="small fail-text" x="673" y="177">資料封包也不讀了</text>
  <rect class="ghost" x="780" y="160" width="140" height="50" rx="8"/>
  <text class="title" x="850" y="181">decoder</text>
  <text class="small" x="850" y="200">沒有資料，閒著</text>

  <text class="small start" x="944" y="112">Destination 不讀，</text>
  <text class="small start" x="944" y="132">stream 就塞住；</text>
  <text class="small start" x="944" y="152">Source 的 pump</text>
  <text class="small start" x="944" y="172">寫不出去，manifest</text>
  <text class="small start" x="944" y="192">和資料一起停。</text>

  <!-- b. Pipes -->
  <rect class="group" x="20" y="285" width="1060" height="255" rx="14"/>
  <text class="group-label start" x="36" y="309">b. pipe：只有 manifest 停，資料照常</text>

  <path class="path-line" stroke-dasharray="7 5" stroke-width="2.2" marker-end="url(#arrow-path-down)" d="M 680 333 V 320 H 115 V 331"/>
  <text class="small path-text" x="430" y="314">比較讀走多少，才還多少窗口</text>

  <rect class="hot" x="40" y="335" width="150" height="50" rx="8"/>
  <text class="title" x="115" y="356">掃描</text>
  <text class="small hot-text" x="115" y="375">窗口用完，等</text>
  <rect class="pathbox" x="40" y="430" width="150" height="50" rx="8"/>
  <text class="title" x="115" y="451">送資料</text>
  <text class="small" x="115" y="470">照送</text>

  <path class="edge-dash" d="M 190 360 H 406"/>
  <text class="small" x="300" y="352">沒有窗口，不送</text>
  <path class="path-edge" d="M 190 455 H 406"/>
  <rect class="bar-path" x="230" y="449" width="14" height="12" rx="2"/>
  <rect class="bar-path" x="270" y="449" width="14" height="12" rx="2"/>
  <rect class="bar-path" x="310" y="449" width="14" height="12" rx="2"/>
  <rect class="bar-path" x="350" y="449" width="14" height="12" rx="2"/>

  <rect class="pathbox" x="410" y="335" width="160" height="145" rx="8"/>
  <text class="title" x="490" y="400">接收 thread</text>
  <text class="small" x="490" y="422">照常分流</text>

  <path class="edge" d="M 570 360 H 606"/>
  <rect class="hot" x="610" y="335" width="140" height="50" rx="8"/>
  <text class="title" x="680" y="356">manifest</text>
  <text class="small hot-text" x="680" y="375">滿了：窗口用完</text>
  <path class="edge" d="M 750 360 H 786"/>
  <rect class="hot" x="790" y="335" width="130" height="50" rx="8"/>
  <text class="title" x="855" y="356">比較</text>
  <text class="small hot-text" x="855" y="375">變慢</text>

  <path class="path-edge" d="M 570 455 H 606"/>
  <rect class="pathbox" x="610" y="430" width="140" height="50" rx="8"/>
  <text class="title" x="680" y="451">data</text>
  <text class="small" x="680" y="470">照常</text>
  <path class="path-edge" d="M 750 455 H 786"/>
  <rect class="pathbox" x="790" y="430" width="130" height="50" rx="8"/>
  <text class="title" x="855" y="451">驗證</text>
  <text class="small" x="855" y="470">照常寫</text>

  <text class="small start" x="944" y="372">manifest 讀得慢，</text>
  <text class="small start" x="944" y="392">只擋住 manifest：</text>
  <text class="small start" x="944" y="412">掃描等。資料走</text>
  <text class="small start" x="944" y="432">自己的窗口，照常</text>
  <text class="small start" x="944" y="452">送、照常寫。</text>
</svg>
