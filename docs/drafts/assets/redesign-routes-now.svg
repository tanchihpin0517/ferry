<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title description">
  <title id="title">現在：三種組合的資料路徑</title>
  <desc id="description">本機到本機：三個 process，Source 的 server、client、Destination 的 server，之間兩段 Unix socket，每個 server 內 peer 與 inward、outward 之間還有兩條 pipe。推送：Source 的 server 在本機，經 Unix socket 到 client，再經 N 條 SSH 連線到 host 上的 Destination server；每個 SSH channel 每個 RTT 最多送一個 window，多一條 TCP 就要多登入一次。host 到 host：資料從 host A 經 SSH 到 client，再經 SSH 到 host B，兩次經過 client 的網路；client 睡著或斷網，傳輸就停，A 與 B 之間更快的網路用不到。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <marker id="arrow-path" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-path"/>
    </marker>
    <marker id="arrow-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-client"/>
    </marker>
    <marker id="arrow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-hot"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-fail"/>
    </marker>
    <marker id="arrow-peer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-peer"/>
    </marker>
    <style>
      :root {
        --text: #172033;
        --muted: #526078;
        --surface: #f7f9fc;
        --surface-strong: #e9eef8;
        --border: #8491a8;
        --group: #b4bdcc;
        --peer: #e5efff;
        --peer-border: #3478c8;
        --client: #f1ecfb;
        --client-border: #7b56c4;
        --path: #27875b;
        --path-surface: #e3f3ea;
        --hot: #b7791f;
        --hot-surface: #fdf2dc;
        --fail: #c2412d;
        --fail-surface: #fdecea;
        --badge: #172033;
        --badge-text: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #eef3fb;
          --muted: #b5c0d3;
          --surface: #202938;
          --surface-strong: #2b3850;
          --border: #8390a6;
          --group: #5a667a;
          --peer: #193a62;
          --peer-border: #6aa8f0;
          --client: #2e2547;
          --client-border: #b39af0;
          --path: #5bc792;
          --path-surface: #16382a;
          --hot: #f0b44c;
          --hot-surface: #41321a;
          --fail: #ff8a70;
          --fail-surface: #4a2420;
          --badge: #eef3fb;
          --badge-text: #172033;
        }
      }
      text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans CJK TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; font-size: 15px; text-anchor: middle; }
      .title { font-weight: 700; }
      .h { font-weight: 700; font-size: 17px; }
      .small { fill: var(--muted); font-size: 13px; }
      .label { fill: var(--muted); font-size: 12.5px; }
      .group-label { fill: var(--muted); font-size: 13.5px; font-weight: 700; letter-spacing: .05em; }
      .start { text-anchor: start; }
      .end { text-anchor: end; }
      .group { fill: none; stroke: var(--group); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .panel { fill: none; stroke: var(--group); stroke-width: 1.5; }
      .node { fill: var(--surface); stroke: var(--border); stroke-width: 1.8; }
      .strong { fill: var(--surface-strong); stroke: var(--border); stroke-width: 1.8; }
      .peer { fill: var(--peer); stroke: var(--peer-border); stroke-width: 2; }
      .client { fill: var(--client); stroke: var(--client-border); stroke-width: 2; }
      .hot { fill: var(--hot-surface); stroke: var(--hot); stroke-width: 2.2; }
      .failbox { fill: var(--fail-surface); stroke: var(--fail); stroke-width: 2.2; }
      .pathbox { fill: var(--path-surface); stroke: var(--path); stroke-width: 2; }
      .ghost { fill: none; stroke: var(--border); stroke-width: 1.5; stroke-dasharray: 4 4; }
      .bar { fill: var(--surface-strong); stroke: var(--border); stroke-width: 1.2; }
      .bar-peer { fill: var(--peer); stroke: var(--peer-border); stroke-width: 1.2; }
      .bar-hot { fill: var(--hot-surface); stroke: var(--hot); stroke-width: 1.5; }
      .bar-fail { fill: var(--fail-surface); stroke: var(--fail); stroke-width: 1.5; }
      .bar-path { fill: var(--path-surface); stroke: var(--path); stroke-width: 1.5; }
      .bar-idle { fill: none; stroke: var(--group); stroke-width: 1.2; stroke-dasharray: 3 3; }
      .edge { fill: none; stroke: var(--border); stroke-width: 2.2; marker-end: url(#arrow); }
      .edge-plain { fill: none; stroke: var(--border); stroke-width: 2; }
      .edge-dash { fill: none; stroke: var(--border); stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .path-edge { fill: none; stroke: var(--path); stroke-width: 2.6; marker-end: url(#arrow-path); }
      .path-line { fill: none; stroke: var(--path); stroke-width: 2.6; }
      .path-dash { fill: none; stroke: var(--path); stroke-width: 2.2; stroke-dasharray: 7 5; marker-end: url(#arrow-path); }
      .client-edge { fill: none; stroke: var(--client-border); stroke-width: 2.2; marker-end: url(#arrow-client); }
      .client-dash { fill: none; stroke: var(--client-border); stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow-client); }
      .hot-edge { fill: none; stroke: var(--hot); stroke-width: 2.4; marker-end: url(#arrow-hot); }
      .hot-dash { fill: none; stroke: var(--hot); stroke-width: 2.2; stroke-dasharray: 6 5; marker-end: url(#arrow-hot); }
      .fail-edge { fill: none; stroke: var(--fail); stroke-width: 2.4; marker-end: url(#arrow-fail); }
      .fail-line { fill: none; stroke: var(--fail); stroke-width: 3; }
      .peer-edge { fill: none; stroke: var(--peer-border); stroke-width: 2.4; marker-end: url(#arrow-peer); }
      .arrow-head { fill: var(--border); }
      .arrow-path { fill: var(--path); }
      .arrow-client { fill: var(--client-border); }
      .arrow-hot { fill: var(--hot); }
      .arrow-fail { fill: var(--fail); }
      .arrow-peer { fill: var(--peer-border); }
      .path-text { fill: var(--path); font-weight: 700; }
      .client-text { fill: var(--client-border); font-weight: 700; }
      .hot-text { fill: var(--hot); font-weight: 700; }
      .fail-text { fill: var(--fail); font-weight: 700; }
      .peer-text { fill: var(--peer-border); font-weight: 700; }
      .badge { fill: var(--badge); }
      .badge-text { fill: var(--badge-text); font-size: 12px; font-weight: 700; }
      .hot-badge { fill: var(--hot); }
      .dot { fill: var(--border); }
    </style>
  </defs>
  <rect class="group" x="20" y="20" width="1060" height="180" rx="14"/>
  <text class="group-label start" x="36" y="44">本機 → 本機</text>
  <text class="small" x="180" y="68">本機</text>
  <rect class="peer" x="60" y="76" width="240" height="64" rx="10"/>
  <text class="title" x="180" y="105">ferry server</text>
  <text class="small" x="180" y="124">Source peer</text>
  <text class="small" x="550" y="68">本機</text>
  <rect class="client" x="420" y="76" width="260" height="64" rx="10"/>
  <text class="title" x="550" y="105">ferry（client）</text>
  <text class="small" x="550" y="124">relay：重排後轉送</text>
  <text class="small" x="920" y="68">本機</text>
  <rect class="peer" x="800" y="76" width="240" height="64" rx="10"/>
  <text class="title" x="920" y="105">ferry server</text>
  <text class="small" x="920" y="124">Destination peer</text>
  <path class="path-edge" d="M 300 108 L 418 108"/>
  <text class="label" x="360" y="94">Unix socket</text>
  <path class="path-edge" d="M 680 108 L 798 108"/>
  <text class="label" x="740" y="94">Unix socket</text>
  <text class="small start" x="40" y="178">3 個 process、2 段 socket；每個 server 內 peer 與 inward、outward 之間還各有 2 條 pipe。</text>
  <rect class="group" x="20" y="212" width="1060" height="180" rx="14"/>
  <text class="group-label start" x="36" y="236">推送：本機 → host</text>
  <text class="small" x="180" y="260">本機</text>
  <rect class="peer" x="60" y="268" width="240" height="64" rx="10"/>
  <text class="title" x="180" y="297">ferry server</text>
  <text class="small" x="180" y="316">Source peer</text>
  <text class="small" x="550" y="260">本機</text>
  <rect class="client" x="420" y="268" width="260" height="64" rx="10"/>
  <text class="title" x="550" y="297">ferry（client）</text>
  <text class="small" x="550" y="316">relay：重排後轉送</text>
  <text class="small" x="920" y="260">host</text>
  <rect class="peer" x="800" y="268" width="240" height="64" rx="10"/>
  <text class="title" x="920" y="297">ferry server</text>
  <text class="small" x="920" y="316">Destination peer</text>
  <path class="path-edge" d="M 300 300 L 418 300"/>
  <text class="label" x="360" y="286">Unix socket</text>
  <path class="path-edge" d="M 680 292 L 798 292"/>
  <path class="path-edge" d="M 680 308 L 798 308"/>
  <text class="label" x="740" y="278">SSH：N 條連線</text>
  <text class="small start" x="40" y="370">SSH 這一段：每個 channel 每個 RTT 最多送一個 window；多一條 TCP 就要多登入一次（OTP 要等下一組碼）。</text>
  <rect class="group" x="20" y="404" width="1060" height="180" rx="14"/>
  <text class="group-label start" x="36" y="428">host A → host B</text>
  <text class="small" x="180" y="452">host A</text>
  <rect class="peer" x="60" y="460" width="240" height="64" rx="10"/>
  <text class="title" x="180" y="489">ferry server</text>
  <text class="small" x="180" y="508">Source peer</text>
  <text class="small" x="550" y="452">筆電或工作站</text>
  <rect class="client" x="420" y="460" width="260" height="64" rx="10"/>
  <text class="title" x="550" y="489">ferry（client）</text>
  <text class="small" x="550" y="508">relay：重排後轉送</text>
  <text class="small" x="920" y="452">host B</text>
  <rect class="peer" x="800" y="460" width="240" height="64" rx="10"/>
  <text class="title" x="920" y="489">ferry server</text>
  <text class="small" x="920" y="508">Destination peer</text>
  <path class="path-edge" d="M 300 484 L 418 484"/>
  <path class="path-edge" d="M 300 500 L 418 500"/>
  <text class="label" x="360" y="470">SSH</text>
  <path class="path-edge" d="M 680 484 L 798 484"/>
  <path class="path-edge" d="M 680 500 L 798 500"/>
  <text class="label" x="740" y="470">SSH</text>
  <path class="ghost" d="M 180 524 L 180 538 L 920 538 L 920 524"/>
  <text class="label" x="550" y="554">A 與 B 之間也許有 10 GbE，用不到</text>
  <text class="small start" x="40" y="574">資料兩次經過 client 的網路；client 睡著或斷網，傳輸就停。</text>
</svg>
