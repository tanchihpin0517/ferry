<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="930" viewBox="0 0 1100 930" role="img" aria-labelledby="title description">
  <title id="title">The supervisor of a server: stages, the stop, and metrics</title>
  <desc id="description">A draft. Inside one server, here the Destination, a supervisor runs the stage graph. It has three parts. Stages spawns one named thread per stage; an error a stage returns, or a panic, goes to the stop, and an error that only says the stage was stopped is never taken for a cause. The stop keeps the first cause, sends Control::Error once and never Done after it, wakes every stage waiting in select! on its work and on the stop's signal, and shuts the sockets down so that reads and writes blocked on them wake too. Metrics records each channel's depth and waits and each stage's time busy and waiting, for the server control stream and the dashboard. The stage graph: receive reads packets from the transport, passes manifest parts to compare, then 8 stat threads, then the applier, which sends needs to the pump; and frames to 8 decompressors, then the parser, then 16 writers, then the finisher; the parser's results also go to the pump, which writes into the transport. Below, what happens when a writer hits EIO: it returns the error, which the stop keeps as the cause; every stage wakes and returns Stopped; the receive thread, blocked on a socket, wakes when the transport shuts it; run returns EIO, the server exits with 1, and Done is never sent.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-fail"/>
    </marker>
    <marker id="arrow-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-stop"/>
    </marker>
    <style>
      :root {
        --text: #172033;
        --muted-text: #526078;
        --surface: #f7f9fc;
        --surface-strong: #e9eef8;
        --border: #8491a8;
        --group: #b4bdcc;
        --server-surface: #e5efff;
        --server-border: #3478c8;
        --transport: #27875b;
        --fail: #c2412d;
        --fail-surface: #fdecea;
        --stop: #b7791f;
        --badge: #172033;
        --badge-text: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #eef3fb;
          --muted-text: #b5c0d3;
          --surface: #202938;
          --surface-strong: #2b3850;
          --border: #8390a6;
          --group: #5a667a;
          --server-surface: #193a62;
          --server-border: #6aa8f0;
          --transport: #5bc792;
          --fail: #ff8a70;
          --fail-surface: #4a2420;
          --stop: #f0b44c;
          --badge: #eef3fb;
          --badge-text: #172033;
        }
      }
      text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; text-anchor: middle; }
      .title { font-weight: 700; }
      .secondary { fill: var(--muted-text); font-size: 13px; }
      .group-label { fill: var(--muted-text); font-size: 13px; font-weight: 600; letter-spacing: .08em; }
      .start { text-anchor: start; }
      .end { text-anchor: end; }
      .edge-label { fill: var(--muted-text); font-size: 12px; }
      .group { fill: none; stroke: var(--group); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .node { fill: var(--surface); stroke: var(--border); stroke-width: 2; }
      .runtime { fill: var(--surface-strong); stroke: var(--server-border); stroke-width: 2.5; }
      .stage { fill: var(--server-surface); stroke: var(--server-border); stroke-width: 2; }
      .failing { fill: var(--fail-surface); stroke: var(--fail); stroke-width: 2.5; }
      .transport { fill: none; stroke: var(--transport); stroke-width: 2; }
      .transport-text { fill: var(--transport); font-size: 12px; font-weight: 700; letter-spacing: .08em; }
      .edge { fill: none; stroke: var(--border); stroke-width: 2.5; marker-end: url(#arrow); }
      .arrow-head { fill: var(--border); }
      .fail-edge { fill: none; stroke: var(--fail); stroke-width: 2.5; marker-end: url(#arrow-fail); }
      .arrow-fail { fill: var(--fail); }
      .fail-label { fill: var(--fail); font-size: 12px; font-weight: 600; }
      .stop-edge { fill: none; stroke: var(--stop); stroke-width: 2.5; stroke-dasharray: 7 5; marker-end: url(#arrow-stop); }
      .arrow-stop { fill: var(--stop); }
      .stop-zone { fill: none; stroke: var(--stop); stroke-width: 2; stroke-dasharray: 8 6; }
      .stop-label { fill: var(--stop); font-size: 12px; font-weight: 600; }
      .metric-edge { fill: none; stroke: var(--border); stroke-width: 2; stroke-dasharray: 2 4; marker-end: url(#arrow); }
      .badge { fill: var(--badge); }
      .badge-text { fill: var(--badge-text); font-size: 12px; font-weight: 700; }
    </style>
  </defs>


  <rect class="group" x="20" y="20" width="1060" height="890" rx="14"/>
  <text class="group-label" x="550" y="48">ONE SERVER: THE DESTINATION, AS AN EXAMPLE (DRAFT)</text>

  <!-- The supervisor -->
  <rect class="runtime" x="50" y="66" width="1000" height="178" rx="12"/>
  <text class="group-label start" x="70" y="92">SUPERVISOR: THE RUNTIME</text>

  <rect class="node" x="70" y="108" width="300" height="122" rx="10"/>
  <text class="title" x="220" y="134">Metrics</text>
  <text class="secondary" x="220" y="160">each channel: depth, waits</text>
  <text class="secondary" x="220" y="180">each stage: busy, waiting</text>
  <text class="secondary" x="220" y="200">to server control, dashboard</text>

  <rect class="node" x="400" y="108" width="300" height="122" rx="10"/>
  <text class="title" x="550" y="134">Stages::spawn(role, work)</text>
  <text class="secondary" x="550" y="160">one named thread per stage</text>
  <text class="secondary" x="550" y="180">Err or panic → stop.fail(…)</text>
  <text class="secondary" x="550" y="200">Err(Stopped) is never a cause</text>

  <rect class="node" x="730" y="108" width="300" height="122" rx="10"/>
  <text class="title" x="880" y="134">Stop</text>
  <text class="secondary" x="880" y="158">keeps the first cause, once</text>
  <text class="secondary" x="880" y="176">Control::Error once; never Done after</text>
  <text class="secondary" x="880" y="194">signal(): wakes every select!</text>
  <text class="secondary" x="880" y="212">shuts sockets: blocked reads wake</text>

  <!-- Transport at each end of the graph -->
  <rect class="transport" x="70" y="288" width="140" height="40" rx="10"/>
  <text class="transport-text" x="140" y="313">TRANSPORT</text>
  <rect class="transport" x="870" y="288" width="140" height="40" rx="10"/>
  <text class="transport-text" x="940" y="313">TRANSPORT</text>

  <!-- Where the stop reaches: every stage -->
  <rect class="stop-zone" x="40" y="352" width="1020" height="296" rx="14"/>
  <text class="stop-label start" x="56" y="638">every wait: select! { recv(work), recv(stop.signal()) }</text>

  <!-- Row 1: the manifest, compared and applied -->
  <rect class="stage" x="70" y="390" width="140" height="60" rx="10"/>
  <text x="140" y="416">receive</text>
  <text class="secondary" x="140" y="436">packets in</text>

  <rect class="stage" x="270" y="390" width="140" height="60" rx="10"/>
  <text x="340" y="416">compare</text>
  <text class="secondary" x="340" y="436">lists, merges</text>

  <rect class="stage" x="480" y="400" width="140" height="60" rx="10"/>
  <rect class="stage" x="475" y="395" width="140" height="60" rx="10"/>
  <rect class="stage" x="470" y="390" width="140" height="60" rx="10"/>
  <text x="540" y="416">stat</text>
  <text class="secondary" x="540" y="436">quick check</text>
  <rect class="badge" x="574" y="380" width="40" height="20" rx="10"/>
  <text class="badge-text" x="594" y="394">×8</text>

  <rect class="stage" x="670" y="390" width="140" height="60" rx="10"/>
  <text x="740" y="416">applier</text>
  <text class="secondary" x="740" y="436">in order; needs</text>

  <rect class="stage" x="870" y="390" width="140" height="60" rx="10"/>
  <text x="940" y="416">pump</text>
  <text class="secondary" x="940" y="436">into the paths</text>

  <path class="edge" d="M 140 328 V 386"/>
  <path class="edge" d="M 210 420 H 266"/>
  <text class="edge-label" x="238" y="412">≤4</text>
  <path class="edge" d="M 410 420 H 466"/>
  <text class="edge-label" x="438" y="412">≤64</text>
  <path class="edge" d="M 620 420 H 666"/>
  <path class="edge" d="M 810 420 H 866"/>
  <text class="edge-label" x="838" y="412">needs</text>
  <path class="edge" d="M 940 390 V 332"/>

  <!-- Row 2: the data, decoded and written -->
  <path class="edge" d="M 140 450 V 526"/>
  <text class="edge-label start" x="148" y="494">≤16 frames</text>

  <rect class="stage" x="80" y="540" width="140" height="60" rx="10"/>
  <rect class="stage" x="75" y="535" width="140" height="60" rx="10"/>
  <rect class="stage" x="70" y="530" width="140" height="60" rx="10"/>
  <text x="140" y="556">decompress</text>
  <text class="secondary" x="140" y="576">frames</text>
  <rect class="badge" x="174" y="520" width="40" height="20" rx="10"/>
  <text class="badge-text" x="194" y="534">×8</text>

  <rect class="stage" x="270" y="530" width="140" height="60" rx="10"/>
  <text x="340" y="556">parser</text>
  <text class="secondary" x="340" y="576">records</text>

  <rect class="failing" x="480" y="540" width="140" height="60" rx="10"/>
  <rect class="failing" x="475" y="535" width="140" height="60" rx="10"/>
  <rect class="failing" x="470" y="530" width="140" height="60" rx="10"/>
  <text x="540" y="556">writers</text>
  <text class="secondary" x="540" y="576">temp, hash, fsync</text>
  <rect class="badge" x="566" y="520" width="48" height="20" rx="10"/>
  <text class="badge-text" x="590" y="534">×16</text>

  <rect class="stage" x="670" y="530" width="140" height="60" rx="10"/>
  <text x="740" y="556">finisher</text>
  <text class="secondary" x="740" y="576">directories</text>

  <path class="edge" d="M 220 560 H 266"/>
  <text class="edge-label" x="243" y="552">≤8</text>
  <path class="edge" d="M 410 560 H 466"/>
  <text class="edge-label" x="438" y="552">≤16</text>
  <path class="edge" d="M 620 560 H 666"/>
  <text class="edge-label" x="643" y="552">dirs</text>
  <path class="edge" d="M 340 590 V 616 H 940 V 454"/>
  <text class="edge-label" x="880" y="608">results</text>

  <!-- A writer fails: the error goes to the stop -->
  <path class="fail-edge" d="M 520 530 V 492 H 645 V 262 H 880 V 234"/>
  <text class="fail-label start" x="655" y="506">Err(EIO) → stop.fail()</text>

  <!-- The stop wakes every stage -->
  <path class="stop-edge" d="M 1020 230 V 348"/>
  <text class="stop-label end" x="1012" y="276">stop: wakes all</text>

  <!-- Every stage and channel reports to metrics -->
  <path class="metric-edge" d="M 240 352 V 234"/>
  <text class="edge-label start" x="248" y="276">depth, busy, waits</text>

  <!-- When a writer hits EIO -->
  <text class="group-label" x="550" y="686">WHEN A WRITER HITS EIO</text>

  <rect class="node" x="40" y="704" width="184" height="128" rx="10"/>
  <circle class="badge" cx="58" cy="704" r="12"/>
  <text class="badge-text" x="58" y="708">1</text>
  <text class="title" x="132" y="732">a writer</text>
  <text class="secondary" x="132" y="756">write() fails: EIO</text>
  <text class="secondary" x="132" y="776">returns Err(EIO)</text>
  <text class="secondary" x="132" y="796">→ stop.fail(EIO)</text>

  <rect class="node" x="246" y="704" width="184" height="128" rx="10"/>
  <circle class="badge" cx="264" cy="704" r="12"/>
  <text class="badge-text" x="264" y="708">2</text>
  <text class="title" x="338" y="732">Stop</text>
  <text class="secondary" x="338" y="756">EIO: the first cause</text>
  <text class="secondary" x="338" y="776">stopped; signal closed</text>
  <text class="secondary" x="338" y="796">Control::Error queued</text>
  <text class="secondary" x="338" y="816">once, on the mux</text>

  <rect class="node" x="452" y="704" width="184" height="128" rx="10"/>
  <circle class="badge" cx="470" cy="704" r="12"/>
  <text class="badge-text" x="470" y="708">3</text>
  <text class="title" x="544" y="732">every stage</text>
  <text class="secondary" x="544" y="756">wakes from select!</text>
  <text class="secondary" x="544" y="776">makes, deletes nothing</text>
  <text class="secondary" x="544" y="796">returns Err(Stopped)</text>
  <text class="secondary" x="544" y="816">never a cause</text>

  <rect class="node" x="658" y="704" width="184" height="128" rx="10"/>
  <circle class="badge" cx="676" cy="704" r="12"/>
  <text class="badge-text" x="676" y="708">4</text>
  <text class="title" x="750" y="732">receive</text>
  <text class="secondary" x="750" y="756">blocked on a socket</text>
  <text class="secondary" x="750" y="776">the transport shuts it</text>
  <text class="secondary" x="750" y="796">wakes: Err(Stopped)</text>

  <rect class="node" x="864" y="704" width="184" height="128" rx="10"/>
  <circle class="badge" cx="882" cy="704" r="12"/>
  <text class="badge-text" x="882" y="708">5</text>
  <text class="title" x="956" y="732">run()</text>
  <text class="secondary" x="956" y="756">returns EIO</text>
  <text class="secondary" x="956" y="776">the server exits 1</text>
  <text class="secondary" x="956" y="796">Done is never sent</text>
  <text class="secondary" x="956" y="816">the client shows EIO</text>

  <path class="edge" d="M 224 768 H 242"/>
  <path class="edge" d="M 430 768 H 448"/>
  <path class="edge" d="M 636 768 H 654"/>
  <path class="edge" d="M 842 768 H 860"/>

  <!-- Legend -->
  <path class="fail-edge" d="M 120 872 H 170"/>
  <text class="edge-label start" x="180" y="876">an error, to the stop</text>
  <path class="stop-edge" d="M 380 872 H 430"/>
  <text class="edge-label start" x="440" y="876">the stop's signal</text>
  <path class="metric-edge" d="M 620 872 H 670"/>
  <text class="edge-label start" x="680" y="876">metrics</text>
  <path class="edge" d="M 820 872 H 870"/>
  <text class="edge-label start" x="880" y="876">a bounded channel</text>
</svg>
