  <text class="small start" x="20" y="580">實線走 pipe，虛線是原樣的 bytes；編號是一次傳輸裡建立的順序。本機的 control connection 不壓縮；lifeline 與交接 fd 不跨網路。</text>
  <text class="small start" x="20" y="604">monitor 起的每個 worker，server、sudo ferry build-id、ferry fixture，stderr 都是接到 monitor 的 lifeline。兩邊都在本機時，沒有 1 到 4。</text>
