<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="title description">
  <title id="title">一次傳輸的全部連線</title>
  <desc id="description">一次傳輸的全部連線，以這台機器上的 client 與 Source server、主機上的 monitor 與 Destination server 為例；實線走 pipe，虛線是原樣的 bytes，編號是建立的順序。1，一條 SSH 連線，TCP，跨機器的都是它的 channel。2，first session，經過 login shell，原樣：探測、安裝，exec 成主機的 monitor；安裝時，client 用 curl 從 GitHub 取 SHA256SUMS 與要上傳的 binary，主機用 curl 或 wget 下載 release。3，link，client 的 monitor 與主機的 monitor 之間，一條 control pipe。4，sudo 檢查，只有 --remote-sudo，原樣。fixture 只有 ferry test，原樣。5，control connection，client 與每個 server 之間，reports 與 control；本機那條不壓縮；server 的 stderr 是 lifeline，接到它的 monitor，原樣，不跨網路。6，stream，兩個 server 之間，manifest、data、answers 與 control；本機那一端由 client 經 server 的 socket 交接 fd。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <marker id="arrow-path" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-path"/>
    </marker>
    <marker id="arrow-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-client"/>
    </marker>
    <marker id="arrow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-hot"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-fail"/>
    </marker>
    <marker id="arrow-peer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-peer"/>
    </marker>
    <style>
