<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title description">
  <title id="title">現在：一次傳輸的三個 process、三個全域順序與單執行緒點</title>
  <desc id="description">client 在中間，兩邊各一個 server。Source 端：readers 讀小檔，sender 一條 thread 寫 record 串流並自己讀大檔，壓縮後由 frame sender 依序交給 pump；lister 一條 thread 深度優先掃描，manifest 依序給 ID，也交給 pump。pump 是唯一的寫入者，片段全域編號後分到 N 條路徑，client 先重排成一條，再由 relay 轉送，Destination 再重排一次。Destination 端：receive 讀所有 packet，manifest 交給 compare 與 applier（刪除、建立、needs）與 finisher，資料交給解壓、parser 依序讀 record，再交給 writers、fsync、renamers。標成琥珀色的是單執行緒點。三個全域順序：manifest 的順序、record 串流的順序、每一段 transport 片段的順序。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <marker id="arrow-path" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-path"/>
    </marker>
    <marker id="arrow-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-client"/>
    </marker>
    <marker id="arrow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-hot"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-fail"/>
    </marker>
    <marker id="arrow-peer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-peer"/>
    </marker>
    <style>
      :root {
        --text: #172033;
        --muted: #526078;
        --surface: #f7f9fc;
        --surface-strong: #e9eef8;
        --border: #8491a8;
        --group: #b4bdcc;
        --peer: #e5efff;
        --peer-border: #3478c8;
        --client: #f1ecfb;
        --client-border: #7b56c4;
        --path: #27875b;
        --path-surface: #e3f3ea;
        --hot: #b7791f;
        --hot-surface: #fdf2dc;
        --fail: #c2412d;
        --fail-surface: #fdecea;
        --badge: #172033;
        --badge-text: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #eef3fb;
          --muted: #b5c0d3;
          --surface: #202938;
          --surface-strong: #2b3850;
          --border: #8390a6;
          --group: #5a667a;
          --peer: #193a62;
          --peer-border: #6aa8f0;
          --client: #2e2547;
          --client-border: #b39af0;
          --path: #5bc792;
          --path-surface: #16382a;
          --hot: #f0b44c;
          --hot-surface: #41321a;
          --fail: #ff8a70;
          --fail-surface: #4a2420;
          --badge: #eef3fb;
          --badge-text: #172033;
        }
      }
      text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans CJK TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; font-size: 15px; text-anchor: middle; }
      .title { font-weight: 700; }
      .h { font-weight: 700; font-size: 17px; }
      .small { fill: var(--muted); font-size: 13px; }
      .label { fill: var(--muted); font-size: 12.5px; }
      .group-label { fill: var(--muted); font-size: 13.5px; font-weight: 700; letter-spacing: .05em; }
      .start { text-anchor: start; }
      .end { text-anchor: end; }
      .group { fill: none; stroke: var(--group); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .panel { fill: none; stroke: var(--group); stroke-width: 1.5; }
      .node { fill: var(--surface); stroke: var(--border); stroke-width: 1.8; }
      .strong { fill: var(--surface-strong); stroke: var(--border); stroke-width: 1.8; }
      .peer { fill: var(--peer); stroke: var(--peer-border); stroke-width: 2; }
      .client { fill: var(--client); stroke: var(--client-border); stroke-width: 2; }
      .hot { fill: var(--hot-surface); stroke: var(--hot); stroke-width: 2.2; }
      .failbox { fill: var(--fail-surface); stroke: var(--fail); stroke-width: 2.2; }
      .pathbox { fill: var(--path-surface); stroke: var(--path); stroke-width: 2; }
      .ghost { fill: none; stroke: var(--border); stroke-width: 1.5; stroke-dasharray: 4 4; }
      .bar { fill: var(--surface-strong); stroke: var(--border); stroke-width: 1.2; }
      .bar-peer { fill: var(--peer); stroke: var(--peer-border); stroke-width: 1.2; }
      .bar-hot { fill: var(--hot-surface); stroke: var(--hot); stroke-width: 1.5; }
      .bar-fail { fill: var(--fail-surface); stroke: var(--fail); stroke-width: 1.5; }
      .bar-path { fill: var(--path-surface); stroke: var(--path); stroke-width: 1.5; }
      .bar-idle { fill: none; stroke: var(--group); stroke-width: 1.2; stroke-dasharray: 3 3; }
      .edge { fill: none; stroke: var(--border); stroke-width: 2.2; marker-end: url(#arrow); }
      .edge-plain { fill: none; stroke: var(--border); stroke-width: 2; }
      .edge-dash { fill: none; stroke: var(--border); stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .path-edge { fill: none; stroke: var(--path); stroke-width: 2.6; marker-end: url(#arrow-path); }
      .path-line { fill: none; stroke: var(--path); stroke-width: 2.6; }
      .path-dash { fill: none; stroke: var(--path); stroke-width: 2.2; stroke-dasharray: 7 5; marker-end: url(#arrow-path); }
      .client-edge { fill: none; stroke: var(--client-border); stroke-width: 2.2; marker-end: url(#arrow-client); }
      .client-dash { fill: none; stroke: var(--client-border); stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow-client); }
      .hot-edge { fill: none; stroke: var(--hot); stroke-width: 2.4; marker-end: url(#arrow-hot); }
      .hot-dash { fill: none; stroke: var(--hot); stroke-width: 2.2; stroke-dasharray: 6 5; marker-end: url(#arrow-hot); }
      .fail-edge { fill: none; stroke: var(--fail); stroke-width: 2.4; marker-end: url(#arrow-fail); }
      .fail-line { fill: none; stroke: var(--fail); stroke-width: 3; }
      .peer-edge { fill: none; stroke: var(--peer-border); stroke-width: 2.4; marker-end: url(#arrow-peer); }
      .arrow-head { fill: var(--border); }
      .arrow-path { fill: var(--path); }
      .arrow-client { fill: var(--client-border); }
      .arrow-hot { fill: var(--hot); }
      .arrow-fail { fill: var(--fail); }
      .arrow-peer { fill: var(--peer-border); }
      .path-text { fill: var(--path); font-weight: 700; }
      .client-text { fill: var(--client-border); font-weight: 700; }
      .hot-text { fill: var(--hot); font-weight: 700; }
      .fail-text { fill: var(--fail); font-weight: 700; }
      .peer-text { fill: var(--peer-border); font-weight: 700; }
      .badge { fill: var(--badge); }
      .badge-text { fill: var(--badge-text); font-size: 12px; font-weight: 700; }
      .hot-badge { fill: var(--hot); }
      .dot { fill: var(--border); }
    </style>
  </defs>
  <rect class="group" x="20" y="20" width="440" height="500" rx="14"/>
  <text class="group-label" x="240" y="44">Source 的 server</text>
  <rect class="group" x="480" y="20" width="200" height="500" rx="14"/>
  <text class="group-label" x="580" y="44">client</text>
  <rect class="group" x="700" y="20" width="480" height="500" rx="14"/>
  <text class="group-label" x="940" y="44">Destination 的 server</text>

  <!-- Source: data lane on top, manifest lane at the bottom, both into the pump -->
  <rect class="node" x="48" y="78" width="120" height="56" rx="10"/>
  <rect class="node" x="44" y="74" width="120" height="56" rx="10"/>
  <rect class="node" x="40" y="70" width="120" height="56" rx="10"/>
  <text class="title" x="100" y="95">readers</text>
  <text class="small" x="100" y="114">讀小檔</text>
  <rect class="badge" x="128.52" y="60" width="37.48" height="20" rx="10"/>
  <text class="badge-text" x="147.26" y="74.5">×16</text>
  <rect class="hot" x="185" y="70" width="120" height="56" rx="10"/>
  <text class="title" x="245" y="95">sender</text>
  <text class="small" x="245" y="114">大檔自己讀</text>
  <rect class="node" x="338" y="78" width="110" height="56" rx="10"/>
  <rect class="node" x="334" y="74" width="110" height="56" rx="10"/>
  <rect class="node" x="330" y="70" width="110" height="56" rx="10"/>
  <text class="title" x="385" y="95">compress</text>
  <text class="small" x="385" y="114">2 MiB frame</text>
  <rect class="badge" x="412" y="60" width="34" height="20" rx="10"/>
  <text class="badge-text" x="429" y="74.5">×8</text>
  <rect class="hot" x="330" y="160" width="110" height="56" rx="10"/>
  <text class="title" x="385" y="185">frame sender</text>
  <text class="small" x="385" y="204">依序</text>
  <rect class="hot" x="330" y="250" width="110" height="56" rx="10"/>
  <text class="title" x="385" y="275">pump</text>
  <text class="small" x="385" y="294">唯一的寫入者</text>
  <rect class="hot" x="40" y="350" width="120" height="56" rx="10"/>
  <text class="title" x="100" y="375">lister</text>
  <text class="small" x="100" y="394">列目錄 (+8 stat)</text>
  <rect class="hot" x="185" y="350" width="120" height="56" rx="10"/>
  <text class="title" x="245" y="375">manifest</text>
  <text class="small" x="245" y="394">深度優先給 ID</text>
  <path class="edge" d="M 160 98 L 183 98"/>
  <path class="edge" d="M 305 98 L 328 98"/>
  <path class="edge" d="M 385 134 L 385 158"/>
  <path class="edge" d="M 385 216 L 385 248"/>
  <path class="edge" d="M 160 378 L 183 378"/>
  <path class="edge" d="M 245 350 L 245 278 L 328 278"/>

  <!-- The paths, striped and put back in order at each receiving end -->
  <path class="path-edge" d="M 440 266 L 493 266"/>
  <path class="path-edge" d="M 670 266 L 718 266"/>
  <path class="path-edge" d="M 440 278 L 493 278"/>
  <path class="path-edge" d="M 670 278 L 718 278"/>
  <path class="path-edge" d="M 440 290 L 493 290"/>
  <path class="path-edge" d="M 670 290 L 718 290"/>
  <text class="label" x="467" y="252">N 條</text>
  <text class="label" x="694" y="252">N 條</text>

  <!-- The client -->
  <rect class="hot" x="495" y="250" width="85" height="56" rx="10"/>
  <text class="title" x="537.5" y="275">重排</text>
  <text class="small" x="537.5" y="294">全域編號</text>
  <rect class="hot" x="590" y="250" width="80" height="56" rx="10"/>
  <text class="title" x="630" y="275">relay</text>
  <text class="small" x="630" y="294">每方向 1 條</text>
  <path class="edge" d="M 580 278 L 588 278"/>
  <text class="label" x="580" y="350">needs、results</text>
  <text class="label" x="580" y="368">反方向走同樣的路，</text>
  <text class="label" x="580" y="386">也重排兩次</text>

  <!-- Destination: manifest lane on top, data lane at the bottom -->
  <rect class="hot" x="720" y="250" width="90" height="56" rx="10"/>
  <text class="title" x="765" y="275">重排</text>
  <text class="small" x="765" y="294">全域編號</text>
  <rect class="hot" x="830" y="250" width="110" height="56" rx="10"/>
  <text class="title" x="885" y="275">receive</text>
  <text class="small" x="885" y="294">讀所有 packet</text>
  <path class="edge" d="M 810 278 L 828 278"/>
  <rect class="hot" x="720" y="70" width="110" height="56" rx="10"/>
  <text class="title" x="775" y="95">compare</text>
  <text class="small" x="775" y="114">列目錄 (+8 stat)</text>
  <rect class="hot" x="850" y="70" width="140" height="56" rx="10"/>
  <text class="title" x="920" y="95">applier</text>
  <text class="small" x="920" y="114">刪除、建立、needs</text>
  <rect class="hot" x="1010" y="70" width="150" height="56" rx="10"/>
  <text class="title" x="1085" y="95">finisher</text>
  <text class="small" x="1085" y="114">目錄收尾</text>
  <path class="edge" d="M 845 250 L 845 160 L 775 160 L 775 128"/>
  <path class="edge" d="M 830 98 L 848 98"/>
  <path class="edge" d="M 990 98 L 1008 98"/>
  <rect class="node" x="838" y="358" width="100" height="56" rx="10"/>
  <rect class="node" x="834" y="354" width="100" height="56" rx="10"/>
  <rect class="node" x="830" y="350" width="100" height="56" rx="10"/>
  <text class="title" x="880" y="383.5">decompress</text>
  <rect class="badge" x="902" y="340" width="34" height="20" rx="10"/>
  <text class="badge-text" x="919" y="354.5">×8</text>
  <rect class="hot" x="960" y="350" width="90" height="56" rx="10"/>
  <text class="title" x="1005" y="375">parser</text>
  <text class="small" x="1005" y="394">依序讀</text>
  <rect class="node" x="1088" y="358" width="85" height="56" rx="10"/>
  <rect class="node" x="1084" y="354" width="85" height="56" rx="10"/>
  <rect class="node" x="1080" y="350" width="85" height="56" rx="10"/>
  <text class="title" x="1122.5" y="383.5">writers</text>
  <rect class="badge" x="1133.52" y="340" width="37.48" height="20" rx="10"/>
  <text class="badge-text" x="1152.26" y="354.5">×16</text>
  <rect class="node" x="968" y="448" width="90" height="56" rx="10"/>
  <rect class="node" x="964" y="444" width="90" height="56" rx="10"/>
  <rect class="node" x="960" y="440" width="90" height="56" rx="10"/>
  <text class="title" x="1005" y="473.5">renamers</text>
  <rect class="badge" x="1022" y="430" width="34" height="20" rx="10"/>
  <text class="badge-text" x="1039" y="444.5">×4</text>
  <rect class="node" x="1088" y="448" width="85" height="56" rx="10"/>
  <rect class="node" x="1084" y="444" width="85" height="56" rx="10"/>
  <rect class="node" x="1080" y="440" width="85" height="56" rx="10"/>
  <text class="title" x="1122.5" y="473.5">fsync</text>
  <rect class="badge" x="1133.52" y="430" width="37.48" height="20" rx="10"/>
  <text class="badge-text" x="1152.26" y="444.5">×64</text>
  <path class="edge" d="M 885 306 L 885 348"/>
  <path class="edge" d="M 938 378 L 958 378"/>
  <path class="edge" d="M 1050 378 L 1078 378"/>
  <path class="edge" d="M 1122 414 L 1122 438"/>
  <path class="edge" d="M 1080 468 L 1060 468"/>
  <path class="edge" d="M 1005 406 L 1005 438"/>

  <!-- The three global orders -->
  <circle class="badge" cx="40" cy="350" r="11"/>
  <text class="badge-text" x="40" y="354.5">1</text>
  <circle class="badge" cx="720" cy="70" r="11"/>
  <text class="badge-text" x="720" y="74.5">1</text>
  <circle class="badge" cx="850" cy="70" r="11"/>
  <text class="badge-text" x="850" y="74.5">1</text>
