  <text class="badge-text" x="185" y="74.5">2</text>
  <circle class="badge" cx="960" cy="350" r="11"/>
  <text class="badge-text" x="960" y="354.5">2</text>
  <circle class="badge" cx="495" cy="250" r="11"/>
  <text class="badge-text" x="495" y="254.5">3</text>
  <circle class="badge" cx="720" cy="250" r="11"/>
  <text class="badge-text" x="720" y="254.5">3</text>

  <!-- Legend and the bounds -->
  <rect class="hot" x="40" y="540" width="26" height="16" rx="4"/>
  <text class="label start" x="74" y="553">單執行緒點</text>
  <path class="path-line" d="M 170 548 L 204 548"/>
  <text class="label start" x="212" y="553">路徑：SSH channel 或 Unix socket</text>
  <circle class="badge" cx="450" cy="548" r="11"/>
  <text class="badge-text" x="450" y="552.5">1</text>
  <text class="label start" x="468" y="553">manifest 的順序</text>
  <circle class="badge" cx="600" cy="548" r="11"/>
  <text class="badge-text" x="600" y="552.5">2</text>
  <text class="label start" x="618" y="553">record 串流的順序</text>
  <circle class="badge" cx="762" cy="548" r="11"/>
  <text class="badge-text" x="762" y="552.5">3</text>
  <text class="label start" x="780" y="553">每一段 transport 片段的順序</text>
  <text class="label start" x="40" y="590">上限：manifest 8 MiB · data 佇列 16 MiB · 重排 256 片或 64 MiB · 解壓後 16 MiB · 待送的檔案 10 萬 · 未比較的 entry 262,144 · 每條路徑 8 片 · 待比較的 part 4 個</text>
  <text class="label start" x="40" y="612">每個上限各自調整；記憶體的峰值是它們交互作用的結果。每條 thread 的細節見 docs/assets/pipeline-workers.svg。</text>
</svg>
