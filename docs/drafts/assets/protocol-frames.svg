  <text class="group-label start" x="20" y="28">a. 封包：ready 之後，連線上只有這一種（草案）</text>
  <rect class="strong" x="40" y="48" width="70" height="40" rx="4"/>
  <text class="title" x="75" y="73">pipe</text>
  <text class="label" x="75" y="106">1 byte</text>
  <rect class="strong" x="114" y="48" width="70" height="40" rx="4"/>
  <text class="title" x="149" y="73">kind</text>
  <text class="label" x="149" y="106">1 byte</text>
  <rect class="strong" x="188" y="48" width="150" height="40" rx="4"/>
  <text class="title" x="263" y="73">長度</text>
  <text class="label" x="263" y="106">4 bytes，little-endian</text>
  <rect class="node" x="342" y="48" width="330" height="40" rx="4"/>
  <text class="title" x="507" y="73">內容</text>
  <text class="label" x="507" y="106">最多 64 KiB</text>
  <text class="small start" x="700" y="60">kind 0　Bytes：這條 pipe 的下一段內容</text>
  <text class="small start" x="700" y="84">kind 1　Window：還這條 pipe 的窗口，內容是 bytes 數</text>
  <text class="small start" x="700" y="108">kind 2　End：這條 pipe 寫完了；data 的帶塊數</text>
  <text class="small start" x="40" y="140">pipe 的編號依連線種類固定：stream 是 0 control、1 manifest、2 data、3 answers；control connection 是 0 control、1 reports；link 是 0 control。</text>
  <text class="group-label start" x="20" y="186">b. 一條串流壓縮的 pipe：以 manifest 為例</text>
  <rect class="bar-peer" x="40" y="206" width="46" height="26" rx="4"/>
  <text class="label" x="63" y="224">In a</text>
  <rect class="bar-peer" x="90" y="206" width="30" height="26" rx="4"/>
  <text class="label" x="105" y="224">x</text>
  <rect class="bar-peer" x="124" y="206" width="30" height="26" rx="4"/>
  <text class="label" x="139" y="224">y</text>
  <rect class="bar-peer" x="158" y="206" width="66" height="26" rx="4"/>
  <text class="label" x="191" y="224">Listed a</text>
  <rect class="bar-peer" x="228" y="206" width="46" height="26" rx="4"/>
  <text class="label" x="251" y="224">In b</text>
  <rect class="bar-peer" x="278" y="206" width="30" height="26" rx="4"/>
  <text class="label" x="293" y="224">z</text>
  <text class="label start" x="318" y="224">…</text>
  <path class="edge" d="M 360 219 H 396"/>
  <rect class="node" x="400" y="200" width="120" height="40" rx="6"/>
  <text class="title" x="460" y="218">zstd</text>
  <text class="label" x="460" y="234">一條串流</text>
  <path class="edge" d="M 520 219 H 556"/>
  <rect class="bar" x="560" y="207" width="220" height="24" rx="4"/>
  <text class="label" x="670" y="224">壓縮過的 bytes</text>
  <path class="edge" d="M 780 219 H 816"/>
  <rect class="strong" x="820" y="207" width="14" height="24" rx="3"/>
  <rect class="bar-peer" x="836" y="207" width="70" height="24" rx="3"/>
  <rect class="strong" x="914" y="207" width="14" height="24" rx="3"/>
  <rect class="bar-peer" x="930" y="207" width="54" height="24" rx="3"/>
  <rect class="strong" x="992" y="207" width="14" height="24" rx="3"/>
  <rect class="bar-peer" x="1008" y="207" width="40" height="24" rx="3"/>
  <text class="label" x="940" y="250">三個 Bytes 封包</text>
  <text class="small start" x="40" y="282">記錄、壓縮的 block、封包的邊界互不相干：讀的一方照順序把各封包的內容餵給這條 pipe 的解壓器，再自己解出記錄。</text>
  <text class="small start" x="40" y="304">每條 pipe 最多每 50 ms flush 一次；安靜了 50 ms 之後的寫入、攢到 64 KiB、或 pipe 關閉，立刻送出。answers、reports、control 也是這樣。</text>
  <text class="group-label start" x="20" y="350">c. data：切塊，平行壓縮，分到各條 stream</text>
  <rect class="strong" x="40" y="370" width="110" height="36" rx="4"/>
  <text class="title" x="95" y="393">序號</text>
  <text class="label" x="95" y="424">8 bytes</text>
  <rect class="strong" x="154" y="370" width="120" height="36" rx="4"/>
  <text class="title" x="214" y="393">原樣或 zstd</text>
  <text class="label" x="214" y="424">1 byte</text>
  <rect class="strong" x="278" y="370" width="100" height="36" rx="4"/>
  <text class="title" x="328" y="393">長度</text>
  <text class="label" x="328" y="424">4 bytes</text>
  <rect class="bar-path" x="382" y="370" width="230" height="36" rx="4"/>
  <text class="small" x="497" y="393">塊的內容</text>
  <text class="label" x="497" y="424">壓縮過的，或原樣</text>
  <path class="edge" d="M 616 388 H 690"/>
  <text class="label end" x="756" y="382">stream 0</text>
  <path class="edge-plain" d="M 766 378 H 1070"/>
  <text class="label end" x="756" y="416">stream 1</text>
  <path class="edge-plain" d="M 766 412 H 1070"/>
  <text class="label end" x="756" y="450">stream 2</text>
  <path class="edge-plain" d="M 766 446 H 1070"/>
  <rect class="strong" x="776" y="366" width="14" height="24" rx="3"/>
  <rect class="bar-path" x="792" y="366" width="60" height="24" rx="3"/>
  <text class="label" x="822" y="382.5">塊 4</text>
  <rect class="strong" x="856" y="366" width="14" height="24" rx="3"/>
  <rect class="bar-peer" x="872" y="366" width="40" height="24" rx="3"/>
  <text class="label" x="892" y="382.5">m</text>
  <rect class="strong" x="916" y="366" width="14" height="24" rx="3"/>
  <rect class="bar-path" x="932" y="366" width="60" height="24" rx="3"/>
  <text class="label" x="962" y="382.5">塊 4</text>
  <rect class="strong" x="776" y="400" width="14" height="24" rx="3"/>
  <rect class="bar-path" x="792" y="400" width="80" height="24" rx="3"/>
  <text class="label" x="832" y="416.5">塊 5</text>
  <rect class="strong" x="876" y="400" width="14" height="24" rx="3"/>
  <rect class="bar-path" x="892" y="400" width="80" height="24" rx="3"/>
  <text class="label" x="932" y="416.5">塊 5</text>
  <rect class="strong" x="976" y="400" width="14" height="24" rx="3"/>
  <rect class="bar-path" x="992" y="400" width="60" height="24" rx="3"/>
  <text class="label" x="1022" y="416.5">塊 7</text>
  <rect class="strong" x="776" y="434" width="14" height="24" rx="3"/>
  <rect class="bar-path" x="792" y="434" width="100" height="24" rx="3"/>
  <text class="label" x="842" y="450.5">塊 6</text>
  <rect class="strong" x="896" y="434" width="14" height="24" rx="3"/>
  <rect class="bar-path" x="912" y="434" width="70" height="24" rx="3"/>
  <text class="label" x="947" y="450.5">塊 6</text>
  <text class="small start" x="40" y="488">一塊可以切成好幾個封包，都在同一條 stream 上，中間可以夾別的 pipe 的封包（m 是 manifest）；一條 stream 一次只送一塊。</text>
  <text class="small start" x="40" y="510">不滿一塊的，照同一條 flush 規則送出。接收端照序號排回；data 的 End 帶塊數，到齊才算完整。壓了不會變小的塊，標「原樣」送出。</text>
  <text class="group-label start" x="20" y="556">d. 第一條 stream 的兩個方向</text>
  <text class="small start" x="40" y="596">S → D</text>
  <text class="small start" x="40" y="636">D → S</text>
  <path class="edge-plain" d="M 100 590 H 1070"/>
  <path class="edge-plain" d="M 100 630 H 1070"/>
  <rect class="strong" x="110" y="578" width="14" height="24" rx="3"/>
  <rect class="bar-peer" x="126" y="578" width="90" height="24" rx="3"/>
  <text class="label" x="171" y="594.5">manifest</text>
  <rect class="strong" x="230" y="578" width="14" height="24" rx="3"/>
  <rect class="bar-path" x="246" y="578" width="70" height="24" rx="3"/>
  <text class="label" x="281" y="594.5">data</text>
  <rect class="strong" x="330" y="578" width="14" height="24" rx="3"/>
  <rect class="bar-path" x="346" y="578" width="70" height="24" rx="3"/>
  <text class="label" x="381" y="594.5">data</text>
  <rect class="strong" x="430" y="578" width="14" height="24" rx="3"/>
  <rect class="bar-peer" x="446" y="578" width="90" height="24" rx="3"/>
  <text class="label" x="491" y="594.5">manifest</text>
  <rect class="strong" x="550" y="578" width="14" height="24" rx="3"/>
  <rect class="node" x="566" y="578" width="80" height="24" rx="3"/>
  <text class="label" x="606" y="594.5">control</text>
  <rect class="strong" x="660" y="578" width="14" height="24" rx="3"/>
  <rect class="bar-path" x="676" y="578" width="70" height="24" rx="3"/>
  <text class="label" x="711" y="594.5">data</text>
  <rect class="strong" x="760" y="578" width="14" height="24" rx="3"/>
  <rect class="bar-peer" x="776" y="578" width="90" height="24" rx="3"/>
  <text class="label" x="821" y="594.5">manifest</text>
  <rect class="strong" x="880" y="578" width="14" height="24" rx="3"/>
  <rect class="bar-peer" x="896" y="578" width="110" height="24" rx="3"/>
  <text class="label" x="951" y="594.5">manifest End</text>
  <rect class="strong" x="110" y="618" width="14" height="24" rx="3"/>
  <rect class="bar-hot" x="126" y="618" width="90" height="24" rx="3"/>
  <text class="label" x="171" y="634.5">answers</text>
  <rect class="strong" x="230" y="618" width="14" height="24" rx="3"/>
  <rect class="node" x="246" y="618" width="120" height="24" rx="3"/>
  <text class="label" x="306" y="634.5">Window：manifest</text>
  <rect class="strong" x="380" y="618" width="14" height="24" rx="3"/>
  <rect class="bar-hot" x="396" y="618" width="90" height="24" rx="3"/>
  <text class="label" x="441" y="634.5">answers</text>
  <rect class="strong" x="500" y="618" width="14" height="24" rx="3"/>
  <rect class="node" x="516" y="618" width="110" height="24" rx="3"/>
  <text class="label" x="571" y="634.5">Window：data</text>
  <rect class="strong" x="640" y="618" width="14" height="24" rx="3"/>
  <rect class="bar-hot" x="656" y="618" width="90" height="24" rx="3"/>
  <text class="label" x="701" y="634.5">answers</text>
  <rect class="strong" x="760" y="618" width="14" height="24" rx="3"/>
  <rect class="node" x="776" y="618" width="80" height="24" rx="3"/>
  <text class="label" x="816" y="634.5">control</text>
  <text class="small start" x="40" y="668">窗口由讀的一方還，走反方向；control 與 Window 最先送。</text>
</svg>
