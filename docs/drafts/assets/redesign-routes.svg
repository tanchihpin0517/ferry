<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title description">
  <title id="title">提案：三種組合，同一個架構</title>
  <desc id="description">三種組合都是 client 加兩個 server。client 建立每條 stream，把兩端交給 server，自己不碰資料；server control 另走 client 與各 server 之間。本機到本機：client 開 N 對 socketpair，兩端各交給一個 server。推送：client 啟動 ssh（N 條連線、每條 K 個 channel），ssh 的 stdin、stdout 接 socketpair 的一端，另一端交給本機的 server。host 到 host：client 在自己這台機器上啟動兩邊的 ssh，用 socketpair 背對背接起來；資料經過這台機器的網路兩次，但不經過 client 的 process。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <marker id="arrow-path" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-path"/>
    </marker>
    <marker id="arrow-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-client"/>
    </marker>
    <marker id="arrow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-hot"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-fail"/>
    </marker>
    <marker id="arrow-peer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-peer"/>
    </marker>
    <style>
      :root {
        --text: #172033;
        --muted: #526078;
        --surface: #f7f9fc;
        --surface-strong: #e9eef8;
        --border: #8491a8;
        --group: #b4bdcc;
        --peer: #e5efff;
        --peer-border: #3478c8;
        --client: #f1ecfb;
        --client-border: #7b56c4;
        --path: #27875b;
        --path-surface: #e3f3ea;
        --hot: #b7791f;
        --hot-surface: #fdf2dc;
        --fail: #c2412d;
        --fail-surface: #fdecea;
        --badge: #172033;
        --badge-text: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #eef3fb;
          --muted: #b5c0d3;
          --surface: #202938;
          --surface-strong: #2b3850;
          --border: #8390a6;
          --group: #5a667a;
          --peer: #193a62;
          --peer-border: #6aa8f0;
          --client: #2e2547;
          --client-border: #b39af0;
          --path: #5bc792;
          --path-surface: #16382a;
          --hot: #f0b44c;
          --hot-surface: #41321a;
          --fail: #ff8a70;
          --fail-surface: #4a2420;
          --badge: #eef3fb;
          --badge-text: #172033;
        }
      }
      text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans CJK TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; font-size: 15px; text-anchor: middle; }
      .title { font-weight: 700; }
      .h { font-weight: 700; font-size: 17px; }
      .small { fill: var(--muted); font-size: 13px; }
      .label { fill: var(--muted); font-size: 12.5px; }
      .group-label { fill: var(--muted); font-size: 13.5px; font-weight: 700; letter-spacing: .05em; }
      .start { text-anchor: start; }
      .end { text-anchor: end; }
      .group { fill: none; stroke: var(--group); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .panel { fill: none; stroke: var(--group); stroke-width: 1.5; }
      .node { fill: var(--surface); stroke: var(--border); stroke-width: 1.8; }
      .strong { fill: var(--surface-strong); stroke: var(--border); stroke-width: 1.8; }
      .peer { fill: var(--peer); stroke: var(--peer-border); stroke-width: 2; }
      .client { fill: var(--client); stroke: var(--client-border); stroke-width: 2; }
      .hot { fill: var(--hot-surface); stroke: var(--hot); stroke-width: 2.2; }
      .failbox { fill: var(--fail-surface); stroke: var(--fail); stroke-width: 2.2; }
      .pathbox { fill: var(--path-surface); stroke: var(--path); stroke-width: 2; }
      .ghost { fill: none; stroke: var(--border); stroke-width: 1.5; stroke-dasharray: 4 4; }
      .bar { fill: var(--surface-strong); stroke: var(--border); stroke-width: 1.2; }
      .bar-peer { fill: var(--peer); stroke: var(--peer-border); stroke-width: 1.2; }
      .bar-hot { fill: var(--hot-surface); stroke: var(--hot); stroke-width: 1.5; }
      .bar-fail { fill: var(--fail-surface); stroke: var(--fail); stroke-width: 1.5; }
      .bar-path { fill: var(--path-surface); stroke: var(--path); stroke-width: 1.5; }
      .bar-idle { fill: none; stroke: var(--group); stroke-width: 1.2; stroke-dasharray: 3 3; }
      .edge { fill: none; stroke: var(--border); stroke-width: 2.2; marker-end: url(#arrow); }
      .edge-plain { fill: none; stroke: var(--border); stroke-width: 2; }
      .edge-dash { fill: none; stroke: var(--border); stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .path-edge { fill: none; stroke: var(--path); stroke-width: 2.6; marker-end: url(#arrow-path); }
      .path-line { fill: none; stroke: var(--path); stroke-width: 2.6; }
      .path-dash { fill: none; stroke: var(--path); stroke-width: 2.2; stroke-dasharray: 7 5; marker-end: url(#arrow-path); }
      .client-edge { fill: none; stroke: var(--client-border); stroke-width: 2.2; marker-end: url(#arrow-client); }
      .client-dash { fill: none; stroke: var(--client-border); stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow-client); }
      .hot-edge { fill: none; stroke: var(--hot); stroke-width: 2.4; marker-end: url(#arrow-hot); }
      .hot-dash { fill: none; stroke: var(--hot); stroke-width: 2.2; stroke-dasharray: 6 5; marker-end: url(#arrow-hot); }
      .fail-edge { fill: none; stroke: var(--fail); stroke-width: 2.4; marker-end: url(#arrow-fail); }
      .fail-line { fill: none; stroke: var(--fail); stroke-width: 3; }
      .peer-edge { fill: none; stroke: var(--peer-border); stroke-width: 2.4; marker-end: url(#arrow-peer); }
      .arrow-head { fill: var(--border); }
      .arrow-path { fill: var(--path); }
      .arrow-client { fill: var(--client-border); }
      .arrow-hot { fill: var(--hot); }
      .arrow-fail { fill: var(--fail); }
      .arrow-peer { fill: var(--peer-border); }
      .path-text { fill: var(--path); font-weight: 700; }
      .client-text { fill: var(--client-border); font-weight: 700; }
      .hot-text { fill: var(--hot); font-weight: 700; }
      .fail-text { fill: var(--fail); font-weight: 700; }
      .peer-text { fill: var(--peer-border); font-weight: 700; }
      .badge { fill: var(--badge); }
      .badge-text { fill: var(--badge-text); font-size: 12px; font-weight: 700; }
      .hot-badge { fill: var(--hot); }
      .dot { fill: var(--border); }
    </style>
  </defs>
  <rect class="group" x="20" y="20" width="1060" height="196" rx="14"/>
  <text class="group-label start" x="36" y="44">本機 → 本機</text>
  <rect class="peer" x="50" y="120" width="220" height="60" rx="10"/>
  <text class="title" x="160" y="147">ferry server</text>
  <text class="small" x="160" y="166">本機：Source peer</text>
  <rect class="peer" x="830" y="120" width="220" height="60" rx="10"/>
  <text class="title" x="940" y="147">ferry server</text>
  <text class="small" x="940" y="166">本機：Destination peer</text>
  <rect class="client" x="430" y="50" width="240" height="40" rx="10"/>
  <text class="title" x="550" y="75.5">ferry（client）</text>
  <path class="client-dash" d="M 430 70 L 160 70 L 160 118"/>
  <text class="client-text" x="295" y="63">server control；交出一端</text>
  <path class="client-dash" d="M 670 70 L 940 70 L 940 118"/>
  <text class="client-text" x="805" y="63">server control；交出另一端</text>
  <path class="path-edge" d="M 270 142 L 828 142"/>
  <path class="path-edge" d="M 270 150 L 828 150"/>
  <path class="path-edge" d="M 270 158 L 828 158"/>
  <text class="path-text" x="550" y="176">stream：N 對 socketpair</text>
  <text class="small start" x="40" y="204">client 不碰資料；和另外兩種組合走同一條路，只差選項：不壓縮。</text>
  <rect class="group" x="20" y="232" width="1060" height="196" rx="14"/>
  <text class="group-label start" x="36" y="256">推送：本機 → host</text>
  <rect class="peer" x="50" y="332" width="220" height="60" rx="10"/>
  <text class="title" x="160" y="359">ferry server</text>
  <text class="small" x="160" y="378">本機：Source peer</text>
  <rect class="peer" x="830" y="332" width="220" height="60" rx="10"/>
  <text class="title" x="940" y="359">ferry server</text>
  <text class="small" x="940" y="378">host：Destination peer</text>
  <rect class="client" x="430" y="262" width="240" height="40" rx="10"/>
  <text class="title" x="550" y="287.5">ferry（client）</text>
  <rect class="node" x="430" y="332" width="240" height="60" rx="10"/>
  <text class="title" x="550" y="359">ssh ×N</text>
  <text class="small" x="550" y="378">每條連線 K 個 channel</text>
  <path class="client-dash" d="M 430 282 L 160 282 L 160 330"/>
  <text class="client-text" x="295" y="275">server control；交出一端</text>
  <path class="client-dash" d="M 670 282 L 940 282 L 940 330"/>
  <text class="client-text" x="805" y="275">server control（SSH）</text>
  <path class="client-dash" d="M 550 302 L 550 330"/>
  <text class="label start" x="562" y="322">啟動，接上 socketpair 的另一端</text>
  <path class="path-edge" d="M 270 354 L 428 354"/>
  <path class="path-edge" d="M 270 362 L 428 362"/>
  <path class="path-edge" d="M 270 370 L 428 370"/>
  <path class="path-edge" d="M 670 354 L 828 354"/>
  <path class="path-edge" d="M 670 362 L 828 362"/>
  <path class="path-edge" d="M 670 370 L 828 370"/>
  <text class="label" x="350" y="388">socketpair</text>
  <text class="label" x="750" y="388">SSH</text>
  <text class="small start" x="40" y="416">ssh 的 stdin、stdout 接 socketpair 的一端，另一端交給本機的 server；資料不經過 client 的 process。</text>
  <rect class="group" x="20" y="444" width="1060" height="236" rx="14"/>
  <text class="group-label start" x="36" y="468">host A → host B</text>
  <text class="small" x="550" y="468">client 這台機器</text>
  <rect class="peer" x="50" y="544" width="220" height="60" rx="10"/>
  <text class="title" x="160" y="571">ferry server</text>
  <text class="small" x="160" y="590">host A：Source peer</text>
  <rect class="peer" x="830" y="544" width="220" height="60" rx="10"/>
  <text class="title" x="940" y="571">ferry server</text>
  <text class="small" x="940" y="590">host B：Destination peer</text>
  <rect class="client" x="430" y="474" width="240" height="40" rx="10"/>
  <text class="title" x="550" y="499.5">ferry（client）</text>
  <rect class="node" x="330" y="544" width="140" height="60" rx="10"/>
  <text class="title" x="400" y="571">ssh</text>
  <text class="small" x="400" y="590">連到 host A</text>
  <rect class="node" x="630" y="544" width="140" height="60" rx="10"/>
  <text class="title" x="700" y="571">ssh</text>
  <text class="small" x="700" y="590">連到 host B</text>
  <path class="client-dash" d="M 430 494 L 160 494 L 160 542"/>
  <text class="client-text" x="295" y="487">server control</text>
  <path class="client-dash" d="M 670 494 L 940 494 L 940 542"/>
  <text class="client-text" x="805" y="487">server control</text>
  <path class="client-dash" d="M 490 514 L 402 542"/>
  <path class="client-dash" d="M 610 514 L 698 542"/>
  <text class="label" x="550" y="536">啟動，背對背接起來</text>
  <path class="path-edge" d="M 270 566 L 328 566"/>
  <path class="path-edge" d="M 270 574 L 328 574"/>
  <path class="path-edge" d="M 270 582 L 328 582"/>
  <path class="path-edge" d="M 470 566 L 628 566"/>
  <path class="path-edge" d="M 470 574 L 628 574"/>
  <path class="path-edge" d="M 470 582 L 628 582"/>
  <path class="path-edge" d="M 770 566 L 828 566"/>
  <path class="path-edge" d="M 770 574 L 828 574"/>
  <path class="path-edge" d="M 770 582 L 828 582"/>
  <text class="label" x="300" y="620">SSH</text>
  <text class="label" x="550" y="600">socketpair</text>
  <text class="label" x="800" y="620">SSH</text>
  <text class="small start" x="40" y="646">兩個 ssh 背對背接起來：資料經過 client 這台機器的網路兩次，但不經過 client 的 process。</text>
  <text class="small start" x="40" y="666">一個 ssh 結束，另一個就讀到 EOF、跟著結束，兩邊的 session 都看到「第 i 條斷了」。</text>
</svg>
