<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title description">
  <title id="title">One argument, two kinds of path: sync deletes what a rule keeps</title>
  <desc id="description">How defect 1 happens. Conditions: sync, an anchored rule such as --exclude /data/sub/f/keep, SOURCE given as data rather than data/, and a directory sub/f on DEST that is a file on SOURCE. a, the makers pass the relative path sub/f; Filter::excludes prefixes SOURCE's name and matches data/sub/f/keep against the rule, which matches, so keep is kept. b, the renamers get the shown path data/sub/f from the decider; clear_the_way takes the place to match from it, Filter::excludes prefixes SOURCE's name again, and data/data/sub/f/keep matches no rule, so keep is deleted. c, proposed: three kinds of path as three types. The relative path is the only one filesystem calls and rules take, which stops defect 1; the shown path is made only when reported, and a Report carries bytes; the printable string is made only at the one way out, which escapes control characters and prints non-UTF-8 as \#ooo, stopping defects 3 and 4.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      :root {
        --text: #172033;
        --muted: #526078;
        --surface: #f7f9fc;
        --surface-strong: #e9eef8;
        --border: #8491a8;
        --group: #b4bdcc;
        --peer: #e5efff;
        --peer-border: #3478c8;
        --path: #27875b;
        --path-surface: #e3f3ea;
        --fail: #c2412d;
        --fail-surface: #fdecea;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #eef3fb;
          --muted: #b5c0d3;
          --surface: #202938;
          --surface-strong: #2b3850;
          --border: #8390a6;
          --group: #5a667a;
          --peer: #193a62;
          --peer-border: #6aa8f0;
          --path: #5bc792;
          --path-surface: #16382a;
          --fail: #ff8a70;
          --fail-surface: #4a2420;
        }
      }
      text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; text-anchor: middle; }
      .title { font-weight: 700; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 13.5px; }
      .small { fill: var(--muted); font-size: 13px; }
      .label { fill: var(--muted); font-size: 12.5px; }
      .group-label { fill: var(--muted); font-size: 13.5px; font-weight: 700; letter-spacing: .03em; }
      .start { text-anchor: start; }
      .group { fill: none; stroke: var(--group); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .node { fill: var(--surface-strong); stroke: var(--border); stroke-width: 2; }
      .ok { fill: var(--path-surface); stroke: var(--path); stroke-width: 2.2; }
      .bad { fill: var(--fail-surface); stroke: var(--fail); stroke-width: 2.2; }
      .proposal { fill: var(--peer); stroke: var(--peer-border); stroke-width: 2.2; }
      .cond { fill: var(--surface); stroke: var(--border); stroke-width: 1.5; }
      .edge { fill: none; stroke: var(--border); stroke-width: 2.2; marker-end: url(#arrow); }
      .arrow-head { fill: var(--border); }
      .ok-text { fill: var(--path); font-weight: 700; font-size: 13px; }
      .fail-text { fill: var(--fail); font-weight: 700; font-size: 13px; }
      .peer-text { fill: var(--peer-border); font-weight: 700; }
    </style>
  </defs>

  <rect class="cond" x="20" y="16" width="1060" height="56" rx="10"/>
  <text class="title start" x="36" y="40">Defect 1 happens when all four hold:</text>
  <text class="small start" x="36" y="62">sync; an anchored rule, such as --exclude /data/sub/f/keep; SOURCE given as data, not data/; a directory sub/f on DEST that is a file on SOURCE.</text>

  <!-- a. makers -->
  <rect class="group" x="20" y="88" width="1060" height="160" rx="14"/>
  <text class="group-label start" x="36" y="112">a. The makers pass a relative path: the rule matches (apply.rs:803, 826)</text>

  <rect class="node" x="40" y="128" width="230" height="64" rx="8"/>
  <text class="title" x="155" y="154">decider</text>
  <text class="code" x="155" y="177">sub/f</text>
  <path class="edge" d="M 270 160 H 298"/>
  <rect class="node" x="300" y="128" width="240" height="64" rx="8"/>
  <text class="title" x="420" y="154">makers</text>
  <text class="code" x="420" y="177">clear_the_way(sub/f)</text>
  <path class="edge" d="M 540 160 H 568"/>
  <rect class="node" x="570" y="128" width="230" height="64" rx="8"/>
  <text class="title" x="685" y="154">Filter::excludes</text>
  <text class="small" x="685" y="177">prefixes SOURCE's name</text>
  <path class="edge" d="M 800 160 H 828"/>
  <rect class="ok" x="830" y="128" width="230" height="64" rx="8"/>
  <text class="code" x="945" y="154">data/sub/f/keep</text>
  <text class="ok-text" x="945" y="177">matches: kept</text>
  <text class="label start" x="40" y="226">Rules match from the transfer's root, so the path starts with SOURCE's name, data, as in rsync.</text>

  <!-- b. renamers -->
  <rect class="group" x="20" y="262" width="1060" height="172" rx="14"/>
  <text class="group-label start" x="36" y="286">b. The renamers get the shown path: SOURCE's name goes in twice</text>

  <rect class="node" x="40" y="302" width="230" height="64" rx="8"/>
  <text class="title" x="155" y="328">decider's Shown::path</text>
  <text class="code" x="155" y="351">data/sub/f</text>
  <path class="edge" d="M 270 334 H 298"/>
  <rect class="node" x="300" y="302" width="240" height="64" rx="8"/>
  <text class="title" x="420" y="328">renamers</text>
  <text class="code" x="420" y="351">clear_the_way(data/sub/f)</text>
  <path class="edge" d="M 540 334 H 568"/>
  <rect class="node" x="570" y="302" width="230" height="64" rx="8"/>
  <text class="title" x="685" y="328">Filter::excludes</text>
  <text class="small" x="685" y="351">prefixes SOURCE's name again</text>
  <path class="edge" d="M 800 334 H 828"/>
  <rect class="bad" x="830" y="302" width="230" height="64" rx="8"/>
  <text class="code" x="945" y="328">data/data/sub/f/keep</text>
  <text class="fail-text" x="945" y="351">no rule matches: deleted</text>
  <text class="label start" x="40" y="398">decider.rs:1485-1492 → rename.rs:177-183 → apply.rs:1110-1125 → filter/mod.rs:137-148</text>
  <text class="label start" x="40" y="418">cb44d7c took the place to match from this argument, then a relative path; caf6950 made it the shown path, and this stayed as it was.</text>

  <!-- c. proposal -->
  <rect class="group" x="20" y="448" width="1060" height="160" rx="14"/>
  <text class="group-label start" x="36" y="472">c. Proposed: three kinds of path, three types, each made at its own boundary</text>

  <rect class="proposal" x="40" y="488" width="290" height="104" rx="8"/>
  <text class="title peer-text" x="185" y="514">Relative path</text>
  <text class="small" x="185" y="538">all filesystem calls and rules take</text>
  <text class="small" x="185" y="560">the type stops defect 1</text>

  <path class="edge" d="M 330 540 H 398"/>
  <text class="label" x="364" y="530">reported</text>

  <rect class="proposal" x="400" y="488" width="290" height="104" rx="8"/>
  <text class="title peer-text" x="545" y="514">Shown path</text>
  <text class="small" x="545" y="538">SOURCE's name in front</text>
  <text class="small" x="545" y="560">a Report carries bytes, not a string</text>

  <path class="edge" d="M 690 540 H 758"/>
  <text class="label" x="724" y="530">printed</text>

  <rect class="proposal" x="760" y="488" width="300" height="104" rx="8"/>
  <text class="title peer-text" x="910" y="514">Printable string</text>
  <text class="small" x="910" y="538">made at the one way out</text>
  <text class="small" x="910" y="560">control characters escaped (defect 3)</text>
  <text class="small" x="910" y="581">non-UTF-8 as \#ooo (defect 4)</text>
</svg>
