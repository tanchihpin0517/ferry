<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title description">
  <title id="title">peer 寫 pipe，transport 決定怎麼送</title>
  <desc id="description">Source 的掃描與送資料的 thread 各寫一條 pipe：manifest 與 data，寫不下就等。transport 把每條 pipe 的 bytes 放在送出 buffer：manifest 壓成一條 zstd 串流，data 切塊平行壓縮；pump 排程、切成封包，經 1 到 8 條 stream 送出。Destination 的接收 thread 只把封包分進各 pipe 的接收 buffer，從不等 peer；比較讀 manifest，驗證讀 data。讀走多少，就還多少窗口；窗口用完，寫的一方就等。answers 反方向：決策者寫，Source 讀 answers 的 thread 從不阻塞。control 雙向，沒有窗口，最先送。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <marker id="arrow-path" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-path"/>
    </marker>
    <marker id="arrow-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-client"/>
    </marker>
    <marker id="arrow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-hot"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-fail"/>
    </marker>
    <marker id="arrow-peer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-peer"/>
    </marker>
    <style>
      :root {
        --text: #172033;
        --muted: #526078;
        --surface: #f7f9fc;
        --surface-strong: #e9eef8;
        --border: #8491a8;
        --group: #b4bdcc;
        --peer: #e5efff;
        --peer-border: #3478c8;
        --client: #f1ecfb;
        --client-border: #7b56c4;
        --path: #27875b;
        --path-surface: #e3f3ea;
        --hot: #b7791f;
        --hot-surface: #fdf2dc;
        --fail: #c2412d;
        --fail-surface: #fdecea;
        --badge: #172033;
        --badge-text: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #eef3fb;
          --muted: #b5c0d3;
          --surface: #202938;
          --surface-strong: #2b3850;
          --border: #8390a6;
          --group: #5a667a;
          --peer: #193a62;
          --peer-border: #6aa8f0;
          --client: #2e2547;
          --client-border: #b39af0;
          --path: #5bc792;
          --path-surface: #16382a;
          --hot: #f0b44c;
          --hot-surface: #41321a;
          --fail: #ff8a70;
          --fail-surface: #4a2420;
          --badge: #eef3fb;
          --badge-text: #172033;
        }
      }
      text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans CJK TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; font-size: 15px; text-anchor: middle; }
      .title { font-weight: 700; }
      .h { font-weight: 700; font-size: 17px; }
      .small { fill: var(--muted); font-size: 13px; }
      .label { fill: var(--muted); font-size: 12.5px; }
      .group-label { fill: var(--muted); font-size: 13.5px; font-weight: 700; letter-spacing: .05em; }
      .start { text-anchor: start; }
      .end { text-anchor: end; }
      .group { fill: none; stroke: var(--group); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .panel { fill: none; stroke: var(--group); stroke-width: 1.5; }
      .node { fill: var(--surface); stroke: var(--border); stroke-width: 1.8; }
      .strong { fill: var(--surface-strong); stroke: var(--border); stroke-width: 1.8; }
      .peer { fill: var(--peer); stroke: var(--peer-border); stroke-width: 2; }
      .client { fill: var(--client); stroke: var(--client-border); stroke-width: 2; }
      .hot { fill: var(--hot-surface); stroke: var(--hot); stroke-width: 2.2; }
      .failbox { fill: var(--fail-surface); stroke: var(--fail); stroke-width: 2.2; }
      .pathbox { fill: var(--path-surface); stroke: var(--path); stroke-width: 2; }
      .ghost { fill: none; stroke: var(--border); stroke-width: 1.5; stroke-dasharray: 4 4; }
      .bar { fill: var(--surface-strong); stroke: var(--border); stroke-width: 1.2; }
      .bar-peer { fill: var(--peer); stroke: var(--peer-border); stroke-width: 1.2; }
      .bar-hot { fill: var(--hot-surface); stroke: var(--hot); stroke-width: 1.5; }
      .bar-fail { fill: var(--fail-surface); stroke: var(--fail); stroke-width: 1.5; }
      .bar-path { fill: var(--path-surface); stroke: var(--path); stroke-width: 1.5; }
      .bar-idle { fill: none; stroke: var(--group); stroke-width: 1.2; stroke-dasharray: 3 3; }
      .edge { fill: none; stroke: var(--border); stroke-width: 2.2; marker-end: url(#arrow); }
      .edge-plain { fill: none; stroke: var(--border); stroke-width: 2; }
      .edge-dash { fill: none; stroke: var(--border); stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .path-edge { fill: none; stroke: var(--path); stroke-width: 2.6; marker-end: url(#arrow-path); }
      .path-line { fill: none; stroke: var(--path); stroke-width: 2.6; }
      .path-dash { fill: none; stroke: var(--path); stroke-width: 2.2; stroke-dasharray: 7 5; marker-end: url(#arrow-path); }
      .client-edge { fill: none; stroke: var(--client-border); stroke-width: 2.2; marker-end: url(#arrow-client); }
      .client-dash { fill: none; stroke: var(--client-border); stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow-client); }
      .hot-edge { fill: none; stroke: var(--hot); stroke-width: 2.4; marker-end: url(#arrow-hot); }
      .hot-dash { fill: none; stroke: var(--hot); stroke-width: 2.2; stroke-dasharray: 6 5; marker-end: url(#arrow-hot); }
      .fail-edge { fill: none; stroke: var(--fail); stroke-width: 2.4; marker-end: url(#arrow-fail); }
      .fail-line { fill: none; stroke: var(--fail); stroke-width: 3; }
      .peer-edge { fill: none; stroke: var(--peer-border); stroke-width: 2.4; marker-end: url(#arrow-peer); }
      .arrow-head { fill: var(--border); }
      .arrow-path { fill: var(--path); }
      .arrow-client { fill: var(--client-border); }
      .arrow-hot { fill: var(--hot); }
      .arrow-fail { fill: var(--fail); }
      .arrow-peer { fill: var(--peer-border); }
      .path-text { fill: var(--path); font-weight: 700; }
      .client-text { fill: var(--client-border); font-weight: 700; }
      .hot-text { fill: var(--hot); font-weight: 700; }
      .fail-text { fill: var(--fail); font-weight: 700; }
      .peer-text { fill: var(--peer-border); font-weight: 700; }
      .badge { fill: var(--badge); }
      .badge-text { fill: var(--badge-text); font-size: 12px; font-weight: 700; }
      .hot-badge { fill: var(--hot); }
      .dot { fill: var(--border); }
    </style>
  </defs>
  <defs>
    <marker id="arrow-left" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="0">
      <path d="M 10 0 L 0 5 L 10 10 z" class="arrow-head"/>
    </marker>
    <marker id="arrow-path-down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="90">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-path"/>
    </marker>
  </defs>
  <!-- Bands -->
  <rect class="group" x="20" y="50" width="180" height="410" rx="12"/>
  <text class="group-label start" x="32" y="72">Source 的 peer</text>
  <rect class="group" x="210" y="50" width="280" height="410" rx="12"/>
  <text class="group-label start" x="222" y="72">Source 的 transport</text>
  <rect class="group" x="500" y="50" width="100" height="410" rx="12"/>
  <text class="group-label" x="550" y="72">stream</text>
  <rect class="group" x="610" y="50" width="280" height="410" rx="12"/>
  <text class="group-label start" x="622" y="72">Destination 的 transport</text>
  <rect class="group" x="900" y="50" width="180" height="410" rx="12"/>
  <text class="group-label start" x="912" y="72">Destination 的 peer</text>

  <!-- Window, given back as read -->
  <path class="path-line" stroke-dasharray="7 5" stroke-width="2.2" marker-end="url(#arrow-path-down)" d="M 811 108 V 94 H 287 V 106"/>
  <text class="small path-text" x="549" y="88">讀走多少，就還多少窗口；窗口用完，寫的一方就等</text>

  <!-- Source peer -->
  <rect class="peer" x="32" y="110" width="150" height="50" rx="8"/>
  <text class="title" x="107" y="131">掃描</text>
  <text class="small" x="107" y="150">有什麼寫什麼</text>
  <rect class="peer" x="32" y="200" width="150" height="50" rx="8"/>
  <text class="title" x="107" y="221">送資料</text>
  <text class="small" x="107" y="240">檔案、分段、hash</text>
  <rect class="node" x="32" y="300" width="150" height="50" rx="8"/>
  <text class="title" x="107" y="321">讀 answers</text>
  <text class="small" x="107" y="340">從不阻塞</text>
  <rect class="node" x="32" y="390" width="150" height="40" rx="8"/>
  <text class="small" x="107" y="415">錯誤</text>

  <!-- Source transport -->
  <rect class="strong" x="222" y="110" width="130" height="50" rx="8"/>
  <text class="title" x="287" y="131">manifest</text>
  <text class="small" x="287" y="150">送出，串流壓縮</text>
  <rect class="strong" x="222" y="200" width="130" height="50" rx="8"/>
  <text class="title" x="287" y="221">data</text>
  <text class="small" x="287" y="240">送出，切塊平行壓縮</text>
  <rect class="node" x="368" y="110" width="110" height="140" rx="8"/>
  <text class="title" x="423" y="168">pump</text>
  <text class="small" x="423" y="188">排程</text>
  <text class="small" x="423" y="206">切成封包</text>
  <rect class="strong" x="222" y="300" width="130" height="50" rx="8"/>
  <text class="title" x="287" y="321">answers</text>
  <text class="small" x="287" y="340">接收，至多一個窗口</text>
  <rect class="node" x="368" y="300" width="110" height="50" rx="8"/>
  <text class="title" x="423" y="321">接收 thread</text>
  <text class="small" x="423" y="340">只分流</text>
  <rect class="node" x="222" y="390" width="256" height="40" rx="8"/>
  <text class="small" x="350" y="415">control：沒有窗口，最先送</text>

  <path class="edge" d="M 182 135 H 220"/>
  <path class="edge" d="M 182 225 H 220"/>
  <path class="edge" d="M 352 135 H 366"/>
  <path class="edge" d="M 352 225 H 366"/>
  <path class="edge-plain" marker-end="url(#arrow-left)" d="M 222 325 L 184 325"/>
  <path class="edge-plain" marker-end="url(#arrow-left)" d="M 368 325 H 354"/>
  <path class="edge-plain" d="M 182 410 H 222"/>

  <!-- Streams -->
  <path class="edge-plain" d="M 478 160 H 622"/>
  <path class="edge-plain" d="M 478 185 H 622"/>
  <path class="edge-plain" d="M 478 210 H 622"/>
  <rect class="bar-peer" x="510" y="154" width="14" height="12" rx="2"/>
  <rect class="bar-path" x="530" y="154" width="14" height="12" rx="2"/>
  <rect class="bar-peer" x="550" y="154" width="14" height="12" rx="2"/>
  <rect class="bar-path" x="570" y="154" width="14" height="12" rx="2"/>
  <rect class="bar-path" x="520" y="179" width="14" height="12" rx="2"/>
  <rect class="bar-path" x="560" y="179" width="14" height="12" rx="2"/>
  <rect class="bar-path" x="515" y="204" width="14" height="12" rx="2"/>
  <rect class="bar-path" x="545" y="204" width="14" height="12" rx="2"/>
  <rect class="bar-path" x="575" y="204" width="14" height="12" rx="2"/>
  <text class="label" x="550" y="238">1 到 8 條</text>
  <text class="label" x="550" y="256">同一條 SSH 連線</text>
  <path class="edge-plain" marker-end="url(#arrow-left)" d="M 622 325 H 480"/>
  <rect class="bar-hot" x="525" y="319" width="14" height="12" rx="2"/>
  <rect class="bar-hot" x="555" y="319" width="14" height="12" rx="2"/>
  <text class="label" x="550" y="352">第 1 條，反方向</text>
  <path class="edge-plain" d="M 478 410 H 622"/>

  <!-- Destination transport -->
  <rect class="node" x="622" y="110" width="110" height="140" rx="8"/>
  <text class="title" x="677" y="160">接收 thread</text>
  <text class="small" x="677" y="180">只分流</text>
  <text class="small" x="677" y="198">從不等 peer</text>
  <rect class="strong" x="748" y="110" width="130" height="50" rx="8"/>
  <text class="title" x="813" y="131">manifest</text>
  <text class="small" x="813" y="150">接收，讀時解壓</text>
  <rect class="strong" x="748" y="200" width="130" height="50" rx="8"/>
  <text class="title" x="813" y="221">data</text>
  <text class="small" x="813" y="240">平行解壓，排回順序</text>
  <rect class="node" x="622" y="300" width="110" height="50" rx="8"/>
  <text class="title" x="677" y="330">pump</text>
  <rect class="strong" x="748" y="300" width="130" height="50" rx="8"/>
  <text class="title" x="813" y="321">answers</text>
  <text class="small" x="813" y="340">送出</text>
  <rect class="node" x="622" y="390" width="256" height="40" rx="8"/>
  <text class="small" x="750" y="415">control</text>

  <path class="edge" d="M 732 135 H 746"/>
  <path class="edge" d="M 732 225 H 746"/>
  <path class="edge" d="M 878 135 H 916"/>
  <path class="edge" d="M 878 225 H 916"/>
  <path class="edge-plain" marker-end="url(#arrow-left)" d="M 916 325 H 880"/>
  <path class="edge-plain" marker-end="url(#arrow-left)" d="M 748 325 H 734"/>
  <path class="edge-plain" d="M 878 410 H 918"/>

  <!-- Destination peer -->
  <rect class="peer" x="918" y="110" width="150" height="50" rx="8"/>
  <text class="title" x="993" y="131">比較</text>
  <text class="small" x="993" y="150">邊讀邊解記錄</text>
  <rect class="peer" x="918" y="200" width="150" height="50" rx="8"/>
  <text class="title" x="993" y="221">驗證</text>
  <text class="small" x="993" y="240">hash、chaining value</text>
  <rect class="peer" x="918" y="300" width="150" height="50" rx="8"/>
  <text class="title" x="993" y="321">決策者</text>
  <text class="small" x="993" y="340">要的檔案、比較到哪</text>
  <rect class="node" x="918" y="390" width="150" height="40" rx="8"/>
  <text class="small" x="993" y="415">錯誤</text>

  <!-- Notes -->
  <rect class="bar-peer" x="40" y="494" width="14" height="12" rx="2"/>
  <text class="small start" x="60" y="505">manifest</text>
  <rect class="bar-path" x="140" y="494" width="14" height="12" rx="2"/>
  <text class="small start" x="160" y="505">data</text>
  <rect class="bar-hot" x="214" y="494" width="14" height="12" rx="2"/>
  <text class="small start" x="234" y="505">answers</text>
  <text class="small start" x="320" y="505">封包是 [pipe][長度][bytes]：多大、什麼時候送、走哪一條 stream，都由 transport 決定。</text>
  <text class="small start" x="40" y="536">peer 只會寫和讀：寫不下就等，不知道一次寫得下多少；讀的一方有什麼讀什麼，自己解出一筆筆記錄。</text>
  <text class="small start" x="40" y="562">接收 thread 只把 bytes 分進各 pipe 的 buffer；對方不會超過窗口，buffer 不會滿，所以它從不必等任何 peer。</text>
</svg>
