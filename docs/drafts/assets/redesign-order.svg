<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title description">
  <title id="title">現在要求的兩條全序，與真正需要的順序</title>
  <desc id="description">左：現在，目錄依 manifest 的深度優先順序一個接一個，檔案依 record 串流的順序一個接一個，任何一個慢，後面的全部等。右：真正需要的只有同一目錄內的順序（先刪多餘，再建立與 link，最後收尾）、父目錄建好子目錄後子目錄才能開始、子目錄收尾後父目錄才能收尾；a/ 與 b/ 之間沒有任何箭頭，可以同時做。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <marker id="arrow-path" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-path"/>
    </marker>
    <marker id="arrow-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-client"/>
    </marker>
    <marker id="arrow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-hot"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-fail"/>
    </marker>
    <marker id="arrow-peer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-peer"/>
    </marker>
    <style>
      :root {
        --text: #172033;
        --muted: #526078;
        --surface: #f7f9fc;
        --surface-strong: #e9eef8;
        --border: #8491a8;
        --group: #b4bdcc;
        --peer: #e5efff;
        --peer-border: #3478c8;
        --client: #f1ecfb;
        --client-border: #7b56c4;
        --path: #27875b;
        --path-surface: #e3f3ea;
        --hot: #b7791f;
        --hot-surface: #fdf2dc;
        --fail: #c2412d;
        --fail-surface: #fdecea;
        --badge: #172033;
        --badge-text: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #eef3fb;
          --muted: #b5c0d3;
          --surface: #202938;
          --surface-strong: #2b3850;
          --border: #8390a6;
          --group: #5a667a;
          --peer: #193a62;
          --peer-border: #6aa8f0;
          --client: #2e2547;
          --client-border: #b39af0;
          --path: #5bc792;
          --path-surface: #16382a;
          --hot: #f0b44c;
          --hot-surface: #41321a;
          --fail: #ff8a70;
          --fail-surface: #4a2420;
          --badge: #eef3fb;
          --badge-text: #172033;
        }
      }
      text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans CJK TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; font-size: 15px; text-anchor: middle; }
      .title { font-weight: 700; }
      .h { font-weight: 700; font-size: 17px; }
      .small { fill: var(--muted); font-size: 13px; }
      .label { fill: var(--muted); font-size: 12.5px; }
      .group-label { fill: var(--muted); font-size: 13.5px; font-weight: 700; letter-spacing: .05em; }
      .start { text-anchor: start; }
      .end { text-anchor: end; }
      .group { fill: none; stroke: var(--group); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .panel { fill: none; stroke: var(--group); stroke-width: 1.5; }
      .node { fill: var(--surface); stroke: var(--border); stroke-width: 1.8; }
      .strong { fill: var(--surface-strong); stroke: var(--border); stroke-width: 1.8; }
      .peer { fill: var(--peer); stroke: var(--peer-border); stroke-width: 2; }
      .client { fill: var(--client); stroke: var(--client-border); stroke-width: 2; }
      .hot { fill: var(--hot-surface); stroke: var(--hot); stroke-width: 2.2; }
      .failbox { fill: var(--fail-surface); stroke: var(--fail); stroke-width: 2.2; }
      .pathbox { fill: var(--path-surface); stroke: var(--path); stroke-width: 2; }
      .ghost { fill: none; stroke: var(--border); stroke-width: 1.5; stroke-dasharray: 4 4; }
      .bar { fill: var(--surface-strong); stroke: var(--border); stroke-width: 1.2; }
      .bar-peer { fill: var(--peer); stroke: var(--peer-border); stroke-width: 1.2; }
      .bar-hot { fill: var(--hot-surface); stroke: var(--hot); stroke-width: 1.5; }
      .bar-fail { fill: var(--fail-surface); stroke: var(--fail); stroke-width: 1.5; }
      .bar-path { fill: var(--path-surface); stroke: var(--path); stroke-width: 1.5; }
      .bar-idle { fill: none; stroke: var(--group); stroke-width: 1.2; stroke-dasharray: 3 3; }
      .edge { fill: none; stroke: var(--border); stroke-width: 2.2; marker-end: url(#arrow); }
      .edge-plain { fill: none; stroke: var(--border); stroke-width: 2; }
      .edge-dash { fill: none; stroke: var(--border); stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .path-edge { fill: none; stroke: var(--path); stroke-width: 2.6; marker-end: url(#arrow-path); }
      .path-line { fill: none; stroke: var(--path); stroke-width: 2.6; }
      .path-dash { fill: none; stroke: var(--path); stroke-width: 2.2; stroke-dasharray: 7 5; marker-end: url(#arrow-path); }
      .client-edge { fill: none; stroke: var(--client-border); stroke-width: 2.2; marker-end: url(#arrow-client); }
      .client-dash { fill: none; stroke: var(--client-border); stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow-client); }
      .hot-edge { fill: none; stroke: var(--hot); stroke-width: 2.4; marker-end: url(#arrow-hot); }
      .hot-dash { fill: none; stroke: var(--hot); stroke-width: 2.2; stroke-dasharray: 6 5; marker-end: url(#arrow-hot); }
      .fail-edge { fill: none; stroke: var(--fail); stroke-width: 2.4; marker-end: url(#arrow-fail); }
      .fail-line { fill: none; stroke: var(--fail); stroke-width: 3; }
      .peer-edge { fill: none; stroke: var(--peer-border); stroke-width: 2.4; marker-end: url(#arrow-peer); }
      .arrow-head { fill: var(--border); }
      .arrow-path { fill: var(--path); }
      .arrow-client { fill: var(--client-border); }
      .arrow-hot { fill: var(--hot); }
      .arrow-fail { fill: var(--fail); }
      .arrow-peer { fill: var(--peer-border); }
      .path-text { fill: var(--path); font-weight: 700; }
      .client-text { fill: var(--client-border); font-weight: 700; }
      .hot-text { fill: var(--hot); font-weight: 700; }
      .fail-text { fill: var(--fail); font-weight: 700; }
      .peer-text { fill: var(--peer-border); font-weight: 700; }
      .badge { fill: var(--badge); }
      .badge-text { fill: var(--badge-text); font-size: 12px; font-weight: 700; }
      .hot-badge { fill: var(--hot); }
      .dot { fill: var(--border); }
    </style>
  </defs>
  <rect class="group" x="20" y="20" width="420" height="560" rx="14"/>
  <text class="group-label" x="230" y="44">現在：兩條全序</text>
  <text class="title" x="130" y="70">目錄的順序</text>
  <text class="small" x="130" y="90">lister、compare、applier 都照它</text>
  <text class="title" x="330" y="70">檔案的順序</text>
  <text class="small" x="330" y="90">sender、parser 都照它</text>
  <rect class="hot" x="70" y="120" width="120" height="44" rx="10"/>
  <text class="title" x="130" y="147.5">根/</text>
  <rect class="hot" x="270" y="120" width="120" height="44" rx="10"/>
  <text class="title" x="330" y="147.5">a1</text>
  <path class="edge" d="M 130 164 L 130 208"/>
  <path class="edge" d="M 330 164 L 330 208"/>
  <text class="label start" x="140" y="192">等前一個</text>
  <text class="label start" x="340" y="192">等前一個</text>
  <rect class="hot" x="70" y="210" width="120" height="44" rx="10"/>
  <text class="title" x="130" y="237.5">a/</text>
  <rect class="hot" x="270" y="210" width="120" height="44" rx="10"/>
  <text class="title" x="330" y="237.5">a2</text>
  <path class="edge" d="M 130 254 L 130 298"/>
  <path class="edge" d="M 330 254 L 330 298"/>
  <text class="label start" x="140" y="282">等前一個</text>
  <text class="label start" x="340" y="282">等前一個</text>
  <rect class="hot" x="70" y="300" width="120" height="44" rx="10"/>
  <text class="title" x="130" y="327.5">a/c/</text>
  <rect class="hot" x="270" y="300" width="120" height="44" rx="10"/>
  <text class="title" x="330" y="327.5">c1</text>
  <path class="edge" d="M 130 344 L 130 388"/>
  <path class="edge" d="M 330 344 L 330 388"/>
  <text class="label start" x="140" y="372">等前一個</text>
  <text class="label start" x="340" y="372">等前一個</text>
  <rect class="hot" x="70" y="390" width="120" height="44" rx="10"/>
  <text class="title" x="130" y="417.5">b/</text>
  <rect class="hot" x="270" y="390" width="120" height="44" rx="10"/>
  <text class="title" x="330" y="417.5">b1</text>
  <text class="title" x="230" y="520">任何一個慢，後面的全部等。</text>
  <text class="small" x="230" y="545">此外，每一段 transport 的片段也是一條全序。</text>
  <rect class="group" x="460" y="20" width="620" height="560" rx="14"/>
  <text class="group-label" x="770" y="44">需要的：只有同一目錄、同一檔案之內的順序</text>
  <rect class="panel" x="490" y="160" width="136" height="216" rx="12"/>
  <text class="title" x="558" y="182">根/</text>
  <rect class="node" x="502" y="196" width="112" height="44" rx="10"/>
  <text class="title" x="558" y="223.5">刪多餘</text>
  <rect class="peer" x="502" y="260" width="112" height="44" rx="10"/>
  <text class="title" x="558" y="279">建立</text>
  <text class="small" x="558" y="298">a/、b/</text>
  <rect class="node" x="502" y="324" width="112" height="44" rx="10"/>
  <text class="title" x="558" y="351.5">收尾</text>
  <path class="edge" d="M 558 240 L 558 258"/>
  <path class="edge" d="M 558 304 L 558 322"/>
  <rect class="panel" x="700" y="60" width="136" height="216" rx="12"/>
  <text class="title" x="768" y="82">a/</text>
  <rect class="node" x="712" y="96" width="112" height="44" rx="10"/>
  <text class="title" x="768" y="123.5">刪多餘</text>
  <rect class="peer" x="712" y="160" width="112" height="44" rx="10"/>
  <text class="title" x="768" y="179">建立、link</text>
  <text class="small" x="768" y="198">c/、a1、a2</text>
  <rect class="node" x="712" y="224" width="112" height="44" rx="10"/>
  <text class="title" x="768" y="251.5">收尾</text>
  <path class="edge" d="M 768 140 L 768 158"/>
  <path class="edge" d="M 768 204 L 768 222"/>
  <rect class="panel" x="910" y="60" width="136" height="216" rx="12"/>
  <text class="title" x="978" y="82">a/c/</text>
  <rect class="node" x="922" y="96" width="112" height="44" rx="10"/>
  <text class="title" x="978" y="123.5">刪多餘</text>
  <rect class="peer" x="922" y="160" width="112" height="44" rx="10"/>
  <text class="title" x="978" y="179">link</text>
  <text class="small" x="978" y="198">c1</text>
  <rect class="node" x="922" y="224" width="112" height="44" rx="10"/>
  <text class="title" x="978" y="251.5">收尾</text>
  <path class="edge" d="M 978 140 L 978 158"/>
  <path class="edge" d="M 978 204 L 978 222"/>
  <rect class="panel" x="700" y="320" width="136" height="216" rx="12"/>
  <text class="title" x="768" y="342">b/</text>
  <rect class="node" x="712" y="356" width="112" height="44" rx="10"/>
  <text class="title" x="768" y="383.5">刪多餘</text>
  <rect class="peer" x="712" y="420" width="112" height="44" rx="10"/>
  <text class="title" x="768" y="439">link</text>
  <text class="small" x="768" y="458">b1</text>
  <rect class="node" x="712" y="484" width="112" height="44" rx="10"/>
  <text class="title" x="768" y="511.5">收尾</text>
  <path class="edge" d="M 768 400 L 768 418"/>
  <path class="edge" d="M 768 464 L 768 482"/>
  <path class="edge" d="M 614 272 L 710 118"/>
  <text class="label start" x="640" y="172">a/ 建好</text>
  <path class="edge" d="M 614 292 L 710 378"/>
  <text class="label start" x="640" y="362">b/ 建好</text>
  <path class="edge" d="M 824 172 L 920 118"/>
  <text class="label" x="878" y="130">c/ 建好</text>
  <path class="edge" d="M 922 246 L 826 246"/>
  <text class="label" x="874" y="238">子目錄先收尾</text>
  <text class="label" x="558" y="400">a/、b/ 都收尾後，</text>
  <text class="label" x="558" y="418">根/ 才收尾</text>
  <text class="title" x="970" y="400">a/ 與 b/ 之間沒有箭頭：</text>
  <text class="title" x="970" y="424">可以同時做</text>
  <text class="small" x="770" y="552">檔案的寫入、驗證、屬性、fsync 隨時平行做；只有最後的 link 在藍色那一步。</text>
</svg>
