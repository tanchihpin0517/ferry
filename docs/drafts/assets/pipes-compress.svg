<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title description">
  <title id="title">壓縮在 transport 裡</title>
  <desc id="description">a，manifest：掃描寫進來的記錄，In、項目、Listed，由 transport 的一條 thread 壓成一條 zstd 串流；最多每 50 ms flush 一次：密集時攢著，零星時，安靜了 50 ms 之後的寫入立刻送出；攢到 64 KiB、或 pipe 關閉，也立刻送出。b，data：檔案與分段的記錄一筆接一筆，transport 把這些 bytes 切成每塊 2 MiB，切點不管記錄的邊界；每塊各自壓縮，由一組 thread 平行處理，帶序號，分到各條 stream；接收端由一組 thread 平行解壓，照序號排回，驗證讀到的仍是一條有序的 bytes。壓了不會變小的塊原樣送；不滿一塊的，照同一條 flush 規則送出。peer 從不壓縮。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <marker id="arrow-path" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-path"/>
    </marker>
    <marker id="arrow-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-client"/>
    </marker>
    <marker id="arrow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-hot"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-fail"/>
    </marker>
    <marker id="arrow-peer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-peer"/>
    </marker>
    <style>
      :root {
        --text: #172033;
        --muted: #526078;
        --surface: #f7f9fc;
        --surface-strong: #e9eef8;
        --border: #8491a8;
        --group: #b4bdcc;
        --peer: #e5efff;
        --peer-border: #3478c8;
        --client: #f1ecfb;
        --client-border: #7b56c4;
        --path: #27875b;
        --path-surface: #e3f3ea;
        --hot: #b7791f;
        --hot-surface: #fdf2dc;
        --fail: #c2412d;
        --fail-surface: #fdecea;
        --badge: #172033;
        --badge-text: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #eef3fb;
          --muted: #b5c0d3;
          --surface: #202938;
          --surface-strong: #2b3850;
          --border: #8390a6;
          --group: #5a667a;
          --peer: #193a62;
          --peer-border: #6aa8f0;
          --client: #2e2547;
          --client-border: #b39af0;
          --path: #5bc792;
          --path-surface: #16382a;
          --hot: #f0b44c;
          --hot-surface: #41321a;
          --fail: #ff8a70;
          --fail-surface: #4a2420;
          --badge: #eef3fb;
          --badge-text: #172033;
        }
      }
      text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans CJK TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; font-size: 15px; text-anchor: middle; }
      .title { font-weight: 700; }
      .h { font-weight: 700; font-size: 17px; }
      .small { fill: var(--muted); font-size: 13px; }
      .label { fill: var(--muted); font-size: 12.5px; }
      .group-label { fill: var(--muted); font-size: 13.5px; font-weight: 700; letter-spacing: .05em; }
      .start { text-anchor: start; }
      .end { text-anchor: end; }
      .group { fill: none; stroke: var(--group); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .panel { fill: none; stroke: var(--group); stroke-width: 1.5; }
      .node { fill: var(--surface); stroke: var(--border); stroke-width: 1.8; }
      .strong { fill: var(--surface-strong); stroke: var(--border); stroke-width: 1.8; }
      .peer { fill: var(--peer); stroke: var(--peer-border); stroke-width: 2; }
      .client { fill: var(--client); stroke: var(--client-border); stroke-width: 2; }
      .hot { fill: var(--hot-surface); stroke: var(--hot); stroke-width: 2.2; }
      .failbox { fill: var(--fail-surface); stroke: var(--fail); stroke-width: 2.2; }
      .pathbox { fill: var(--path-surface); stroke: var(--path); stroke-width: 2; }
      .ghost { fill: none; stroke: var(--border); stroke-width: 1.5; stroke-dasharray: 4 4; }
      .bar { fill: var(--surface-strong); stroke: var(--border); stroke-width: 1.2; }
      .bar-peer { fill: var(--peer); stroke: var(--peer-border); stroke-width: 1.2; }
      .bar-hot { fill: var(--hot-surface); stroke: var(--hot); stroke-width: 1.5; }
      .bar-fail { fill: var(--fail-surface); stroke: var(--fail); stroke-width: 1.5; }
      .bar-path { fill: var(--path-surface); stroke: var(--path); stroke-width: 1.5; }
      .bar-idle { fill: none; stroke: var(--group); stroke-width: 1.2; stroke-dasharray: 3 3; }
      .edge { fill: none; stroke: var(--border); stroke-width: 2.2; marker-end: url(#arrow); }
      .edge-plain { fill: none; stroke: var(--border); stroke-width: 2; }
      .edge-dash { fill: none; stroke: var(--border); stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .path-edge { fill: none; stroke: var(--path); stroke-width: 2.6; marker-end: url(#arrow-path); }
      .path-line { fill: none; stroke: var(--path); stroke-width: 2.6; }
      .path-dash { fill: none; stroke: var(--path); stroke-width: 2.2; stroke-dasharray: 7 5; marker-end: url(#arrow-path); }
      .client-edge { fill: none; stroke: var(--client-border); stroke-width: 2.2; marker-end: url(#arrow-client); }
      .client-dash { fill: none; stroke: var(--client-border); stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow-client); }
      .hot-edge { fill: none; stroke: var(--hot); stroke-width: 2.4; marker-end: url(#arrow-hot); }
      .hot-dash { fill: none; stroke: var(--hot); stroke-width: 2.2; stroke-dasharray: 6 5; marker-end: url(#arrow-hot); }
      .fail-edge { fill: none; stroke: var(--fail); stroke-width: 2.4; marker-end: url(#arrow-fail); }
      .fail-line { fill: none; stroke: var(--fail); stroke-width: 3; }
      .peer-edge { fill: none; stroke: var(--peer-border); stroke-width: 2.4; marker-end: url(#arrow-peer); }
      .arrow-head { fill: var(--border); }
      .arrow-path { fill: var(--path); }
      .arrow-client { fill: var(--client-border); }
      .arrow-hot { fill: var(--hot); }
      .arrow-fail { fill: var(--fail); }
      .arrow-peer { fill: var(--peer-border); }
      .path-text { fill: var(--path); font-weight: 700; }
      .client-text { fill: var(--client-border); font-weight: 700; }
      .hot-text { fill: var(--hot); font-weight: 700; }
      .fail-text { fill: var(--fail); font-weight: 700; }
      .peer-text { fill: var(--peer-border); font-weight: 700; }
      .badge { fill: var(--badge); }
      .badge-text { fill: var(--badge-text); font-size: 12px; font-weight: 700; }
      .hot-badge { fill: var(--hot); }
      .dot { fill: var(--border); }
    </style>
  </defs>
  <defs>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="90">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
  </defs>

  <!-- a. Manifest -->
  <rect class="group" x="20" y="20" width="1060" height="200" rx="14"/>
  <text class="group-label start" x="36" y="44">a. manifest：一條 zstd 串流，最多每 50 ms flush 一次</text>

  <text class="small start" x="40" y="80">掃描寫進來的記錄</text>
  <rect class="bar-peer" x="40" y="92" width="52" height="28" rx="4"/>
  <text class="label" x="66" y="111">In a</text>
  <rect class="bar-peer" x="96" y="92" width="40" height="28" rx="4"/>
  <text class="label" x="116" y="111">x</text>
  <rect class="bar-peer" x="140" y="92" width="40" height="28" rx="4"/>
  <text class="label" x="160" y="111">y</text>
  <rect class="bar-peer" x="184" y="92" width="70" height="28" rx="4"/>
  <text class="label" x="219" y="111">Listed a</text>
  <rect class="bar-peer" x="258" y="92" width="52" height="28" rx="4"/>
  <text class="label" x="284" y="111">In b</text>
  <rect class="bar-peer" x="314" y="92" width="40" height="28" rx="4"/>
  <text class="label" x="334" y="111">z</text>
  <text class="label start" x="362" y="111">…</text>

  <path class="edge" d="M 390 106 H 446"/>
  <rect class="node" x="450" y="76" width="180" height="60" rx="8"/>
  <text class="title" x="540" y="101">zstd</text>
  <text class="small" x="540" y="121">transport 的一條 thread</text>

  <path class="edge" d="M 630 92 H 686"/>
  <rect class="bar-peer" x="690" y="80" width="150" height="24" rx="4"/>
  <text class="label" x="765" y="97">一大塊</text>
  <text class="small start" x="856" y="97">密集時：攢著，每 50 ms 一次</text>
  <path class="edge" d="M 630 122 H 686"/>
  <rect class="bar-peer" x="690" y="112" width="34" height="24" rx="4"/>
  <text class="small start" x="740" y="129">零星時：安靜了 50 ms 之後的寫入，立刻送出</text>

  <text class="small start" x="40" y="170">記錄很小，前面送過的內容就是後面的字典，所以一條串流壓得比一則一則好。</text>
  <text class="small start" x="40" y="194">什麼時候 flush，是 transport 的事：攢到 64 KiB、或 pipe 關閉，也立刻送出；peer 不知道。</text>

  <!-- b. Data -->
  <rect class="group" x="20" y="240" width="1060" height="300" rx="14"/>
  <text class="group-label start" x="36" y="264">b. data：切塊，平行壓縮，照序號排回</text>

  <text class="small start" x="40" y="298">送資料寫進來的記錄</text>
  <rect class="bar-path" x="40" y="310" width="60" height="28" rx="4"/>
  <text class="label" x="70" y="329">檔案 a</text>
  <rect class="bar-path" x="104" y="310" width="44" height="28" rx="4"/>
  <text class="label" x="126" y="329">b</text>
  <rect class="bar-path" x="152" y="310" width="44" height="28" rx="4"/>
  <text class="label" x="174" y="329">c</text>
  <rect class="bar-path" x="200" y="310" width="96" height="28" rx="4"/>
  <text class="label" x="248" y="329">分段 d#0</text>
  <rect class="bar-path" x="300" y="310" width="96" height="28" rx="4"/>
  <text class="label" x="348" y="329">分段 d#1</text>
  <rect class="bar-path" x="400" y="310" width="40" height="28" rx="4"/>
  <text class="label" x="420" y="329">e</text>

  <path class="edge-plain" d="M 40 352 V 362 M 40 357 H 140 M 140 352 V 362"/>
  <text class="label" x="90" y="378">塊 0</text>
  <path class="edge-plain" d="M 140 357 H 240 M 240 352 V 362"/>
  <text class="label" x="190" y="378">塊 1</text>
  <path class="edge-plain" d="M 240 357 H 340 M 340 352 V 362"/>
  <text class="label" x="290" y="378">塊 2</text>
  <path class="edge-plain" d="M 340 357 H 440 M 440 352 V 362"/>
  <text class="label" x="390" y="378">塊 3</text>
  <text class="small start" x="40" y="404">每塊 2 MiB，切點不管記錄的邊界</text>

  <path class="edge" d="M 456 356 H 486"/>
  <rect class="node" x="490" y="300" width="110" height="34" rx="6"/>
  <text class="small" x="545" y="322">壓縮 0</text>
  <rect class="node" x="490" y="340" width="110" height="34" rx="6"/>
  <text class="small" x="545" y="362">壓縮 1</text>
  <rect class="node" x="490" y="380" width="110" height="34" rx="6"/>
  <text class="small" x="545" y="402">壓縮 2、3</text>
  <text class="label" x="545" y="432">一組 thread，平行</text>

  <path class="edge-plain" d="M 610 320 H 760"/>
  <path class="edge-plain" d="M 610 357 H 760"/>
  <path class="edge-plain" d="M 610 394 H 760"/>
  <circle class="badge" cx="650" cy="320" r="10"/>
  <text class="badge-text" x="650" y="324">2</text>
  <circle class="badge" cx="700" cy="320" r="10"/>
  <text class="badge-text" x="700" y="324">0</text>
  <circle class="badge" cx="680" cy="357" r="10"/>
  <text class="badge-text" x="680" y="361">1</text>
  <circle class="badge" cx="690" cy="394" r="10"/>
  <text class="badge-text" x="690" y="398">3</text>
  <text class="label" x="685" y="432">分到各條 stream，帶序號</text>

  <rect class="node" x="770" y="300" width="110" height="34" rx="6"/>
  <text class="small" x="825" y="322">解壓</text>
  <rect class="node" x="770" y="340" width="110" height="34" rx="6"/>
  <text class="small" x="825" y="362">解壓</text>
  <rect class="node" x="770" y="380" width="110" height="34" rx="6"/>
  <text class="small" x="825" y="402">解壓</text>
  <text class="label" x="825" y="432">一組 thread，平行</text>

  <path class="edge" d="M 880 357 H 906"/>
  <rect class="strong" x="910" y="300" width="150" height="50" rx="8"/>
  <text class="title" x="985" y="321">照序號排回</text>
  <text class="small" x="985" y="340">0、1、2、3</text>
  <rect class="pathbox" x="910" y="370" width="150" height="50" rx="8"/>
  <text class="title" x="985" y="391">驗證（peer）</text>
  <text class="small" x="985" y="410">讀到有序的 bytes</text>
  <path class="edge-plain" marker-end="url(#arrow-down)" d="M 985 350 V 367"/>

  <text class="small start" x="40" y="468">壓了不會變小的塊原樣送；不滿一塊的，照同一條 flush 規則送出：最多每 50 ms 一次。</text>
  <text class="small start" x="40" y="492">peer 從不壓縮：要不要壓、壓縮等級、塊多大、幾條 thread，都是 transport 的設定。</text>
  <text class="small start" x="40" y="516">完整性檢查留在 peer：檔案的 BLAKE3 hash、分段的 chaining value，Source 讀檔時算，Destination 驗證。</text>
</svg>
