<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title description">
  <title id="title">現在的三種 head-of-line blocking</title>
  <desc id="description">a：一個 4 GiB 的大檔由 sender 一條 thread 讀，後面已經讀好的檔案都在排隊，Destination 只有一個 writer 在寫它，其他 15 個閒著。b：applier 一條 thread 刪除 old/ 的 100 萬個檔案，在 WekaFS 上約 11 分鐘（量到每次 0.65 ms），這段時間沒有新的 needs，資料面在送完已經要的檔案後就閒著。c：三條路徑中第 2 條慢，第 5 片還在它上面，接收端的重排緩衝收滿 256 片或 64 MiB 後，第 1、3 條路徑也停。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <marker id="arrow-path" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-path"/>
    </marker>
    <marker id="arrow-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-client"/>
    </marker>
    <marker id="arrow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-hot"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-fail"/>
    </marker>
    <marker id="arrow-peer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-peer"/>
    </marker>
    <style>
      :root {
        --text: #172033;
        --muted: #526078;
        --surface: #f7f9fc;
        --surface-strong: #e9eef8;
        --border: #8491a8;
        --group: #b4bdcc;
        --peer: #e5efff;
        --peer-border: #3478c8;
        --client: #f1ecfb;
        --client-border: #7b56c4;
        --path: #27875b;
        --path-surface: #e3f3ea;
        --hot: #b7791f;
        --hot-surface: #fdf2dc;
        --fail: #c2412d;
        --fail-surface: #fdecea;
        --badge: #172033;
        --badge-text: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #eef3fb;
          --muted: #b5c0d3;
          --surface: #202938;
          --surface-strong: #2b3850;
          --border: #8390a6;
          --group: #5a667a;
          --peer: #193a62;
          --peer-border: #6aa8f0;
          --client: #2e2547;
          --client-border: #b39af0;
          --path: #5bc792;
          --path-surface: #16382a;
          --hot: #f0b44c;
          --hot-surface: #41321a;
          --fail: #ff8a70;
          --fail-surface: #4a2420;
          --badge: #eef3fb;
          --badge-text: #172033;
        }
      }
      text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans CJK TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; font-size: 15px; text-anchor: middle; }
      .title { font-weight: 700; }
      .h { font-weight: 700; font-size: 17px; }
      .small { fill: var(--muted); font-size: 13px; }
      .label { fill: var(--muted); font-size: 12.5px; }
      .group-label { fill: var(--muted); font-size: 13.5px; font-weight: 700; letter-spacing: .05em; }
      .start { text-anchor: start; }
      .end { text-anchor: end; }
      .group { fill: none; stroke: var(--group); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .panel { fill: none; stroke: var(--group); stroke-width: 1.5; }
      .node { fill: var(--surface); stroke: var(--border); stroke-width: 1.8; }
      .strong { fill: var(--surface-strong); stroke: var(--border); stroke-width: 1.8; }
      .peer { fill: var(--peer); stroke: var(--peer-border); stroke-width: 2; }
      .client { fill: var(--client); stroke: var(--client-border); stroke-width: 2; }
      .hot { fill: var(--hot-surface); stroke: var(--hot); stroke-width: 2.2; }
      .failbox { fill: var(--fail-surface); stroke: var(--fail); stroke-width: 2.2; }
      .pathbox { fill: var(--path-surface); stroke: var(--path); stroke-width: 2; }
      .ghost { fill: none; stroke: var(--border); stroke-width: 1.5; stroke-dasharray: 4 4; }
      .bar { fill: var(--surface-strong); stroke: var(--border); stroke-width: 1.2; }
      .bar-peer { fill: var(--peer); stroke: var(--peer-border); stroke-width: 1.2; }
      .bar-hot { fill: var(--hot-surface); stroke: var(--hot); stroke-width: 1.5; }
      .bar-fail { fill: var(--fail-surface); stroke: var(--fail); stroke-width: 1.5; }
      .bar-path { fill: var(--path-surface); stroke: var(--path); stroke-width: 1.5; }
      .bar-idle { fill: none; stroke: var(--group); stroke-width: 1.2; stroke-dasharray: 3 3; }
      .edge { fill: none; stroke: var(--border); stroke-width: 2.2; marker-end: url(#arrow); }
      .edge-plain { fill: none; stroke: var(--border); stroke-width: 2; }
      .edge-dash { fill: none; stroke: var(--border); stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .path-edge { fill: none; stroke: var(--path); stroke-width: 2.6; marker-end: url(#arrow-path); }
      .path-line { fill: none; stroke: var(--path); stroke-width: 2.6; }
      .path-dash { fill: none; stroke: var(--path); stroke-width: 2.2; stroke-dasharray: 7 5; marker-end: url(#arrow-path); }
      .client-edge { fill: none; stroke: var(--client-border); stroke-width: 2.2; marker-end: url(#arrow-client); }
      .client-dash { fill: none; stroke: var(--client-border); stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow-client); }
      .hot-edge { fill: none; stroke: var(--hot); stroke-width: 2.4; marker-end: url(#arrow-hot); }
      .hot-dash { fill: none; stroke: var(--hot); stroke-width: 2.2; stroke-dasharray: 6 5; marker-end: url(#arrow-hot); }
      .fail-edge { fill: none; stroke: var(--fail); stroke-width: 2.4; marker-end: url(#arrow-fail); }
      .fail-line { fill: none; stroke: var(--fail); stroke-width: 3; }
      .peer-edge { fill: none; stroke: var(--peer-border); stroke-width: 2.4; marker-end: url(#arrow-peer); }
      .arrow-head { fill: var(--border); }
      .arrow-path { fill: var(--path); }
      .arrow-client { fill: var(--client-border); }
      .arrow-hot { fill: var(--hot); }
      .arrow-fail { fill: var(--fail); }
      .arrow-peer { fill: var(--peer-border); }
      .path-text { fill: var(--path); font-weight: 700; }
      .client-text { fill: var(--client-border); font-weight: 700; }
      .hot-text { fill: var(--hot); font-weight: 700; }
      .fail-text { fill: var(--fail); font-weight: 700; }
      .peer-text { fill: var(--peer-border); font-weight: 700; }
      .badge { fill: var(--badge); }
      .badge-text { fill: var(--badge-text); font-size: 12px; font-weight: 700; }
      .hot-badge { fill: var(--hot); }
      .dot { fill: var(--border); }
    </style>
  </defs>
  <rect class="group" x="20" y="20" width="1060" height="200" rx="14"/>
  <text class="group-label start" x="36" y="44">a. 一個大檔擋住後面所有檔案</text>
  <text class="title start" x="36" y="68">sender</text>
  <text class="small start" x="36" y="86">Source，1 條</text>
  <rect class="bar-hot" x="230" y="58" width="530" height="24" rx="5"/>
  <text class="small" x="495" y="75">big.iso（4 GiB）：sender 自己讀，邊讀邊送</text>
  <rect class="bar-path" x="766" y="58" width="42" height="24" rx="5"/>
  <text class="label" x="787" y="75">s1</text>
  <rect class="bar-path" x="814" y="58" width="42" height="24" rx="5"/>
  <text class="label" x="835" y="75">s2</text>
  <rect class="bar-path" x="862" y="58" width="42" height="24" rx="5"/>
  <text class="label" x="883" y="75">s3</text>
  <rect class="bar-path" x="910" y="58" width="42" height="24" rx="5"/>
  <text class="label" x="931" y="75">s4</text>
  <rect class="bar-path" x="958" y="58" width="42" height="24" rx="5"/>
  <text class="label" x="979" y="75">s5</text>
  <rect class="bar-path" x="1006" y="58" width="42" height="24" rx="5"/>
  <text class="label" x="1027" y="75">s6</text>
  <text class="title start" x="36" y="110">readers ×16</text>
  <text class="small start" x="36" y="128">Source</text>
  <rect class="bar-peer" x="230" y="100" width="14" height="24" rx="5"/>
  <rect class="bar-peer" x="246" y="100" width="14" height="24" rx="5"/>
  <rect class="bar-peer" x="262" y="100" width="14" height="24" rx="5"/>
  <rect class="bar-peer" x="278" y="100" width="14" height="24" rx="5"/>
  <rect class="bar-peer" x="294" y="100" width="14" height="24" rx="5"/>
  <rect class="bar-peer" x="310" y="100" width="14" height="24" rx="5"/>
  <rect class="bar-idle" x="332" y="100" width="428" height="24" rx="5"/>
  <text class="label" x="546" y="117">s1–s6 早就讀好了，在排隊</text>
  <text class="title start" x="36" y="158">writers ×16</text>
  <text class="small start" x="36" y="176">Destination</text>
  <rect class="bar-hot" x="240" y="145" width="530" height="18" rx="5"/>
  <text class="small" x="505" y="159">1 個 writer 寫 big.iso</text>
  <rect class="bar-idle" x="240" y="171" width="530" height="18" rx="5"/>
  <text class="label" x="505" y="185">其他 15 個閒著</text>
  <rect class="bar-path" x="776" y="158" width="42" height="18" rx="5"/>
  <text class="label" x="797" y="172">s1</text>
  <rect class="bar-path" x="824" y="158" width="42" height="18" rx="5"/>
  <text class="label" x="845" y="172">s2</text>
  <rect class="bar-path" x="872" y="158" width="42" height="18" rx="5"/>
  <text class="label" x="893" y="172">s3</text>
  <rect class="bar-path" x="920" y="158" width="42" height="18" rx="5"/>
  <text class="label" x="941" y="172">s4</text>
  <rect class="bar-path" x="968" y="158" width="42" height="18" rx="5"/>
  <text class="label" x="989" y="172">s5</text>
  <rect class="bar-path" x="1016" y="158" width="42" height="18" rx="5"/>
  <text class="label" x="1037" y="172">s6</text>
  <rect class="group" x="20" y="240" width="1060" height="190" rx="14"/>
  <text class="group-label start" x="36" y="264">b. 一次大的刪除擋住後面所有目錄的 needs</text>
  <text class="title start" x="36" y="290">applier</text>
  <text class="small start" x="36" y="308">Destination，1 條</text>
  <rect class="bar-peer" x="230" y="280" width="40" height="24" rx="5"/>
  <text class="label" x="250" y="297">d1</text>
  <rect class="bar-peer" x="274" y="280" width="40" height="24" rx="5"/>
  <text class="label" x="294" y="297">d2</text>
  <rect class="bar-hot" x="318" y="280" width="582" height="24" rx="5"/>
  <text class="small" x="609" y="297">刪除 old/ 的 100 萬個檔案（WekaFS 上約 11 分鐘）</text>
  <rect class="bar-peer" x="904" y="280" width="40" height="24" rx="5"/>
  <text class="label" x="924" y="297">d3</text>
  <rect class="bar-peer" x="948" y="280" width="40" height="24" rx="5"/>
  <text class="label" x="968" y="297">d4</text>
  <text class="title start" x="36" y="342">送出 needs</text>
  <circle class="dot" cx="270" cy="338" r="6"/>
  <circle class="dot" cx="314" cy="338" r="6"/>
  <circle class="dot" cx="944" cy="338" r="6"/>
  <circle class="dot" cx="988" cy="338" r="6"/>
  <path class="ghost" d="M 330 338 L 890 338"/>
  <text class="label" x="610" y="330">沒有新的 needs</text>
  <text class="title start" x="36" y="388">資料面</text>
  <rect class="bar-path" x="230" y="372" width="210" height="24" rx="5"/>
  <text class="label" x="335" y="389">送完已經要的檔案</text>
  <rect class="bar-idle" x="444" y="372" width="456" height="24" rx="5"/>
  <text class="label" x="672" y="389">閒著</text>
  <rect class="bar-path" x="904" y="372" width="156" height="24" rx="5"/>
  <text class="label" x="982" y="389">d3、d4 的檔案</text>
  <rect class="group" x="20" y="450" width="1060" height="190" rx="14"/>
  <text class="group-label start" x="36" y="474">c. 一條慢路徑擋住其他路徑</text>
  <text class="title start" x="36" y="509">路徑 1</text>
  <path class="path-line" d="M 220 505 L 780 505"/>
  <text class="title start" x="36" y="548">路徑 2</text>
  <text class="small start" x="36" y="566">慢</text>
  <path class="path-line" d="M 220 550 L 780 550"/>
  <text class="title start" x="36" y="599">路徑 3</text>
  <path class="path-line" d="M 220 595 L 780 595"/>
