  <text class="title" x="930" y="508">重排緩衝</text>
  <text class="small" x="930" y="532">已收 6、7、9、10、…</text>
  <text class="small" x="930" y="552">收滿 256 片或 64 MiB</text>
  <text class="small" x="930" y="572">第 5 片沒到，誰都不能交出去</text>
  <text class="hot-text" x="930" y="600">→ 路徑 1、3 也停</text>
</svg>
