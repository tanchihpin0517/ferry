  <rect class="bar-hot" x="296" y="539" width="404" height="22" rx="5"/>
  <text class="label" x="498" y="555">第 5 片還在慢路徑上</text>
  <rect class="bar-path" x="292" y="584" width="40" height="22" rx="5"/>
  <text class="label" x="312" y="600">6</text>
  <rect class="bar-path" x="344" y="494" width="40" height="22" rx="5"/>
