<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-labelledby="title description">
  <title id="title">The Destination's threads today, and one shared worker loop</title>
  <desc id="description">a, today: each stage on the Destination has its own fixed threads: stat 8, checkers 8, makers 16, deleters 16, finishers 16, writers up to 16, renamers 4, and the transport's decompressing 8, about 90 workers, most of them blocked in filesystem calls; beside them the single threads: the decider, the feeder, compare, compared, the manifest's and the data's readers, the pumps, the stream readers and the lifeline. b, decided: each stage keeps its own threads, as many as now, which were measured, but every worker runs one shared loop: before each piece the stop is checked, the profile and the gauges are marked, and what came of the piece goes back to the decider as an event; a failure stops the peer. The single threads stay as they are. How much CPU Ferry takes is the kernel's to keep: --cpus N, 8 unless told, keeps every thread to N cores by CPU affinity; a thread waiting on I/O takes none, and time spent in system calls counts too, which a pool of Ferry's own could not keep. There is no pool and no total: on NFS, fewer I/Os at once is slower.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      :root {
        --text: #172033;
        --muted: #526078;
        --surface: #f7f9fc;
        --surface-strong: #e9eef8;
        --border: #8491a8;
        --group: #b4bdcc;
        --peer: #e5efff;
        --peer-border: #3478c8;
        --hot: #b7791f;
        --hot-surface: #fdf2dc;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #eef3fb;
          --muted: #b5c0d3;
          --surface: #202938;
          --surface-strong: #2b3850;
          --border: #8390a6;
          --group: #5a667a;
          --peer: #193a62;
          --peer-border: #6aa8f0;
          --hot: #f0b44c;
          --hot-surface: #41321a;
        }
      }
      text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; text-anchor: middle; }
      .title { font-weight: 700; }
      .count { font-weight: 700; font-size: 18px; }
      .small { fill: var(--muted); font-size: 13px; }
      .label { fill: var(--muted); font-size: 12.5px; }
      .group-label { fill: var(--muted); font-size: 13.5px; font-weight: 700; letter-spacing: .03em; }
      .start { text-anchor: start; }
      .group { fill: none; stroke: var(--group); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .node { fill: var(--surface-strong); stroke: var(--border); stroke-width: 2; }
      .fixed { fill: var(--hot-surface); stroke: var(--hot); stroke-width: 2; }
      .single { fill: var(--surface); stroke: var(--border); stroke-width: 1.5; stroke-dasharray: 4 3; }
      .pool { fill: var(--peer); stroke: var(--peer-border); stroke-width: 2.2; }
      .chip { fill: var(--surface); stroke: var(--peer-border); stroke-width: 1.2; }
      .edge { fill: none; stroke: var(--border); stroke-width: 2.2; marker-end: url(#arrow); }
      .arrow-head { fill: var(--border); }
      .peer-text { fill: var(--peer-border); font-weight: 700; }
      .hot-text { fill: var(--hot); font-weight: 700; font-size: 13px; }
    </style>
  </defs>

  <!-- a. Today -->
  <rect class="group" x="20" y="16" width="1060" height="214" rx="14"/>
  <text class="group-label start" x="36" y="40">a. Today, on the Destination: each stage has threads of its own, a fixed number</text>

  <rect class="fixed" x="40" y="56" width="118" height="62" rx="8"/>
  <text class="title" x="99" y="80">stat</text>
  <text class="count" x="99" y="106">8</text>
  <rect class="fixed" x="168" y="56" width="118" height="62" rx="8"/>
  <text class="title" x="227" y="80">checkers</text>
  <text class="count" x="227" y="106">8</text>
  <rect class="fixed" x="296" y="56" width="118" height="62" rx="8"/>
  <text class="title" x="355" y="80">makers</text>
  <text class="count" x="355" y="106">16</text>
  <rect class="fixed" x="424" y="56" width="118" height="62" rx="8"/>
  <text class="title" x="483" y="80">deleters</text>
  <text class="count" x="483" y="106">16</text>
  <rect class="fixed" x="552" y="56" width="118" height="62" rx="8"/>
  <text class="title" x="611" y="80">finishers</text>
  <text class="count" x="611" y="106">16</text>
  <rect class="fixed" x="680" y="56" width="118" height="62" rx="8"/>
  <text class="title" x="739" y="80">writers</text>
  <text class="count" x="739" y="106">≤ 16</text>
  <rect class="fixed" x="808" y="56" width="118" height="62" rx="8"/>
  <text class="title" x="867" y="80">renamers</text>
  <text class="count" x="867" y="106">4</text>
  <rect class="fixed" x="936" y="56" width="124" height="62" rx="8"/>
  <text class="title" x="998" y="80">decompress</text>
  <text class="count" x="998" y="106">8</text>
  <text class="hot-text start" x="40" y="142">About 90 workers, most of the time blocked in filesystem calls; each stage's count set apart from the others.</text>

  <rect class="single" x="40" y="158" width="1020" height="56" rx="8"/>
  <text class="title start" x="56" y="181">Single threads beside them:</text>
  <text class="small start" x="56" y="202">the decider, the feeder, compare, compared, the manifest's and the data's readers, the pumps, the stream readers, the lifeline</text>

  <!-- b. Decided -->
  <rect class="group" x="20" y="246" width="1060" height="350" rx="14"/>
  <text class="group-label start" x="36" y="270">b. Decided: each stage keeps its own threads, as now; every worker runs one shared loop</text>

  <rect class="node" x="40" y="330" width="150" height="70" rx="8"/>
  <text class="title" x="115" y="360">decider</text>
  <text class="small" x="115" y="382">no I/O, as now</text>

  <path class="edge" d="M 190 344 H 268"/>
  <text class="label" x="229" y="334">commands</text>
  <path class="edge" d="M 270 388 H 192"/>
  <text class="label" x="231" y="408">events</text>

  <rect class="pool" x="270" y="290" width="560" height="200" rx="10"/>
  <text class="title peer-text" x="550" y="316">One worker loop, shared; each stage's threads as now</text>
  <rect class="chip" x="290" y="330" width="122" height="30" rx="6"/>
  <text class="small" x="351" y="350">stat 8</text>
  <rect class="chip" x="422" y="330" width="122" height="30" rx="6"/>
  <text class="small" x="483" y="350">checkers 8</text>
  <rect class="chip" x="554" y="330" width="122" height="30" rx="6"/>
  <text class="small" x="615" y="350">makers 16</text>
  <rect class="chip" x="686" y="330" width="124" height="30" rx="6"/>
  <text class="small" x="748" y="350">deleters 16</text>
  <rect class="chip" x="290" y="368" width="122" height="30" rx="6"/>
  <text class="small" x="351" y="388">finishers 16</text>
  <rect class="chip" x="422" y="368" width="122" height="30" rx="6"/>
  <text class="small" x="483" y="388">writers ≤ 16</text>
  <rect class="chip" x="554" y="368" width="122" height="30" rx="6"/>
  <text class="small" x="615" y="388">renamers 4</text>
  <text class="small start" x="290" y="424">• before each piece, by the loop: the stop checked</text>
  <text class="small start" x="290" y="446">• the profile and gauges marked; what came of it, an event</text>
  <text class="small start" x="290" y="468">• a failure stops the peer; the counts, measured, stay</text>

  <rect class="single" x="860" y="290" width="200" height="200" rx="8"/>
  <text class="title" x="960" y="318">Their own threads</text>
  <text class="small" x="960" y="344">the decider, the feeder,</text>
  <text class="small" x="960" y="362">compare, compared,</text>
  <text class="small" x="960" y="380">the pipes' readers,</text>
  <text class="small" x="960" y="398">the pumps, the lifeline,</text>
  <text class="small" x="960" y="416">the transport's 8</text>
  <text class="small" x="960" y="434">decompressing threads</text>
  <text class="label" x="960" y="460">each waits on a channel,</text>
  <text class="label" x="960" y="478">a pipe, or the window</text>

  <text class="small start" x="40" y="516">CPU is the kernel's to keep: --cpus N, 8 unless told, keeps every thread to N cores by CPU affinity.</text>
  <text class="small start" x="40" y="540">A thread waiting on I/O takes none of them; time in system calls counts too, which a pool of Ferry's own could not keep.</text>
  <text class="hot-text start" x="40" y="566">No pool, and no total: on NFS, fewer I/Os at once is slower; with 8 workers, a copy took a tenth longer.</text>
</svg>
