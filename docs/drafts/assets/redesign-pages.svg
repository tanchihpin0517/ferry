<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title description">
  <title id="title">以目錄為單位的 page：列目錄可以平行</title>
  <desc id="description">例子：根/ 下有 a/、b/、c/；a/ 下有 a1/、a2/；b/ 下有 b1/；c/ 下有 c1/，共 8 個目錄，每列一個要一趟往返 L。左：現在一個 lister 深度優先，8 個目錄一個接一個，約 8L；Destination 也只有一條 compare 照同樣的順序列自己的目錄。右：K=3 個 lister，根/ 列完就同時列 a/、b/、c/，再同時列 a1/、a2/、b1/，最後 c1/，約 4L；page 可以任意順序到。Destination 由下往上判斷完成：自己的 page 都到、子目錄都完成、檔案都定案；列不出的目錄由 Source 送 Unlistable。K 是對共用檔案系統的禮貌問題，是政策，可以設定，K=1 時順序與現在相同。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <marker id="arrow-path" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-path"/>
    </marker>
    <marker id="arrow-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-client"/>
    </marker>
    <marker id="arrow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-hot"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-fail"/>
    </marker>
    <marker id="arrow-peer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-peer"/>
    </marker>
    <style>
      :root {
        --text: #172033;
        --muted: #526078;
        --surface: #f7f9fc;
        --surface-strong: #e9eef8;
        --border: #8491a8;
        --group: #b4bdcc;
        --peer: #e5efff;
        --peer-border: #3478c8;
        --client: #f1ecfb;
        --client-border: #7b56c4;
        --path: #27875b;
        --path-surface: #e3f3ea;
        --hot: #b7791f;
        --hot-surface: #fdf2dc;
        --fail: #c2412d;
        --fail-surface: #fdecea;
        --badge: #172033;
        --badge-text: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #eef3fb;
          --muted: #b5c0d3;
          --surface: #202938;
          --surface-strong: #2b3850;
          --border: #8390a6;
          --group: #5a667a;
          --peer: #193a62;
          --peer-border: #6aa8f0;
          --client: #2e2547;
          --client-border: #b39af0;
          --path: #5bc792;
          --path-surface: #16382a;
          --hot: #f0b44c;
          --hot-surface: #41321a;
          --fail: #ff8a70;
          --fail-surface: #4a2420;
          --badge: #eef3fb;
          --badge-text: #172033;
        }
      }
      text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans CJK TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; font-size: 15px; text-anchor: middle; }
      .title { font-weight: 700; }
      .h { font-weight: 700; font-size: 17px; }
      .small { fill: var(--muted); font-size: 13px; }
      .label { fill: var(--muted); font-size: 12.5px; }
      .group-label { fill: var(--muted); font-size: 13.5px; font-weight: 700; letter-spacing: .05em; }
      .start { text-anchor: start; }
      .end { text-anchor: end; }
      .group { fill: none; stroke: var(--group); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .panel { fill: none; stroke: var(--group); stroke-width: 1.5; }
      .node { fill: var(--surface); stroke: var(--border); stroke-width: 1.8; }
      .strong { fill: var(--surface-strong); stroke: var(--border); stroke-width: 1.8; }
      .peer { fill: var(--peer); stroke: var(--peer-border); stroke-width: 2; }
      .client { fill: var(--client); stroke: var(--client-border); stroke-width: 2; }
      .hot { fill: var(--hot-surface); stroke: var(--hot); stroke-width: 2.2; }
      .failbox { fill: var(--fail-surface); stroke: var(--fail); stroke-width: 2.2; }
      .pathbox { fill: var(--path-surface); stroke: var(--path); stroke-width: 2; }
      .ghost { fill: none; stroke: var(--border); stroke-width: 1.5; stroke-dasharray: 4 4; }
      .bar { fill: var(--surface-strong); stroke: var(--border); stroke-width: 1.2; }
      .bar-peer { fill: var(--peer); stroke: var(--peer-border); stroke-width: 1.2; }
      .bar-hot { fill: var(--hot-surface); stroke: var(--hot); stroke-width: 1.5; }
      .bar-fail { fill: var(--fail-surface); stroke: var(--fail); stroke-width: 1.5; }
      .bar-path { fill: var(--path-surface); stroke: var(--path); stroke-width: 1.5; }
      .bar-idle { fill: none; stroke: var(--group); stroke-width: 1.2; stroke-dasharray: 3 3; }
      .edge { fill: none; stroke: var(--border); stroke-width: 2.2; marker-end: url(#arrow); }
      .edge-plain { fill: none; stroke: var(--border); stroke-width: 2; }
      .edge-dash { fill: none; stroke: var(--border); stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .path-edge { fill: none; stroke: var(--path); stroke-width: 2.6; marker-end: url(#arrow-path); }
      .path-line { fill: none; stroke: var(--path); stroke-width: 2.6; }
      .path-dash { fill: none; stroke: var(--path); stroke-width: 2.2; stroke-dasharray: 7 5; marker-end: url(#arrow-path); }
      .client-edge { fill: none; stroke: var(--client-border); stroke-width: 2.2; marker-end: url(#arrow-client); }
      .client-dash { fill: none; stroke: var(--client-border); stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow-client); }
      .hot-edge { fill: none; stroke: var(--hot); stroke-width: 2.4; marker-end: url(#arrow-hot); }
      .hot-dash { fill: none; stroke: var(--hot); stroke-width: 2.2; stroke-dasharray: 6 5; marker-end: url(#arrow-hot); }
      .fail-edge { fill: none; stroke: var(--fail); stroke-width: 2.4; marker-end: url(#arrow-fail); }
      .fail-line { fill: none; stroke: var(--fail); stroke-width: 3; }
      .peer-edge { fill: none; stroke: var(--peer-border); stroke-width: 2.4; marker-end: url(#arrow-peer); }
      .arrow-head { fill: var(--border); }
      .arrow-path { fill: var(--path); }
      .arrow-client { fill: var(--client-border); }
      .arrow-hot { fill: var(--hot); }
      .arrow-fail { fill: var(--fail); }
      .arrow-peer { fill: var(--peer-border); }
      .path-text { fill: var(--path); font-weight: 700; }
      .client-text { fill: var(--client-border); font-weight: 700; }
      .hot-text { fill: var(--hot); font-weight: 700; }
      .fail-text { fill: var(--fail); font-weight: 700; }
      .peer-text { fill: var(--peer-border); font-weight: 700; }
      .badge { fill: var(--badge); }
      .badge-text { fill: var(--badge-text); font-size: 12px; font-weight: 700; }
      .hot-badge { fill: var(--hot); }
      .dot { fill: var(--border); }
    </style>
  </defs>
  <rect class="group" x="20" y="20" width="520" height="360" rx="14"/>
  <text class="group-label start" x="36" y="44">現在：1 個 lister，深度優先</text>
  <text class="title end" x="98" y="115">lister</text>
  <rect class="bar-peer" x="110" y="96" width="44" height="28" rx="5"/>
  <text class="label" x="132" y="115">根</text>
  <rect class="bar-peer" x="158" y="96" width="44" height="28" rx="5"/>
  <text class="label" x="180" y="115">a</text>
  <rect class="bar-peer" x="206" y="96" width="44" height="28" rx="5"/>
  <text class="label" x="228" y="115">a1</text>
  <rect class="bar-peer" x="254" y="96" width="44" height="28" rx="5"/>
  <text class="label" x="276" y="115">a2</text>
  <rect class="bar-peer" x="302" y="96" width="44" height="28" rx="5"/>
  <text class="label" x="324" y="115">b</text>
  <rect class="bar-peer" x="350" y="96" width="44" height="28" rx="5"/>
  <text class="label" x="372" y="115">b1</text>
  <rect class="bar-peer" x="398" y="96" width="44" height="28" rx="5"/>
  <text class="label" x="420" y="115">c</text>
  <rect class="bar-peer" x="446" y="96" width="44" height="28" rx="5"/>
  <text class="label" x="468" y="115">c1</text>
  <path class="hot-edge" d="M 110 140 L 490 140"/>
  <text class="hot-text" x="302" y="160">8 × L</text>
  <text class="title end" x="98" y="218">compare</text>
  <text class="small end" x="98" y="235">Destination</text>
  <rect class="bar-peer" x="134" y="206" width="44" height="28" rx="5"/>
  <text class="label" x="156" y="225">根</text>
  <rect class="bar-peer" x="182" y="206" width="44" height="28" rx="5"/>
  <text class="label" x="204" y="225">a</text>
  <rect class="bar-peer" x="230" y="206" width="44" height="28" rx="5"/>
  <text class="label" x="252" y="225">a1</text>
  <rect class="bar-peer" x="278" y="206" width="44" height="28" rx="5"/>
  <text class="label" x="300" y="225">a2</text>
  <rect class="bar-peer" x="326" y="206" width="44" height="28" rx="5"/>
  <text class="label" x="348" y="225">b</text>
  <rect class="bar-peer" x="374" y="206" width="44" height="28" rx="5"/>
  <text class="label" x="396" y="225">b1</text>
  <rect class="bar-peer" x="422" y="206" width="44" height="28" rx="5"/>
  <text class="label" x="444" y="225">c</text>
  <rect class="bar-peer" x="470" y="206" width="44" height="28" rx="5"/>
  <text class="label" x="492" y="225">c1</text>
  <text class="small" x="280" y="290">每列一個目錄要一趟往返 L；</text>
  <text class="small" x="280" y="310">N 個目錄 ≈ N × L，不管 stat 有幾條</text>
  <text class="small" x="280" y="346">Destination 也只有一條 compare 照同樣的順序列</text>
  <rect class="group" x="560" y="20" width="520" height="360" rx="14"/>
  <text class="group-label start" x="576" y="44">提案：K 個 lister，page 任意順序到</text>
  <text class="title end" x="658" y="95">lister 1</text>
  <rect class="bar-peer" x="670" y="76" width="52" height="28" rx="5"/>
  <text class="label" x="696" y="95">根</text>
  <rect class="bar-peer" x="726" y="76" width="52" height="28" rx="5"/>
  <text class="label" x="752" y="95">a</text>
  <rect class="bar-peer" x="782" y="76" width="52" height="28" rx="5"/>
  <text class="label" x="808" y="95">a1</text>
  <rect class="bar-peer" x="838" y="76" width="52" height="28" rx="5"/>
  <text class="label" x="864" y="95">c1</text>
  <text class="title end" x="658" y="141">lister 2</text>
  <rect class="bar-peer" x="726" y="122" width="52" height="28" rx="5"/>
  <text class="label" x="752" y="141">b</text>
  <rect class="bar-peer" x="782" y="122" width="52" height="28" rx="5"/>
  <text class="label" x="808" y="141">a2</text>
  <text class="title end" x="658" y="187">lister 3</text>
  <rect class="bar-peer" x="726" y="168" width="52" height="28" rx="5"/>
  <text class="label" x="752" y="187">c</text>
  <rect class="bar-peer" x="782" y="168" width="52" height="28" rx="5"/>
  <text class="label" x="808" y="187">b1</text>
  <path class="path-edge" d="M 670 222 L 890 222"/>
  <text class="path-text" x="782" y="242">4 × L</text>
  <text class="small" x="820" y="290">根/ 列完，它的子目錄就能同時列</text>
  <text class="small" x="820" y="310">Destination 的比較也可以平行</text>
  <text class="small" x="820" y="346">K=1 時，順序和現在一樣（dry run 可以用它）</text>
  <rect class="group" x="20" y="400" width="1060" height="140" rx="14"/>
  <text class="group-label start" x="36" y="424">Destination 怎麼知道一個目錄完成了：由下往上數</text>
  <rect class="node" x="40" y="440" width="320" height="80" rx="10"/>
  <text class="title" x="200" y="477">自己的 page 都到了</text>
  <text class="small" x="200" y="496">最後一段帶 last</text>
  <rect class="node" x="390" y="440" width="320" height="80" rx="10"/>
  <text class="title" x="550" y="477">子目錄都完成了</text>
  <text class="small" x="550" y="496">每個宣告過的子目錄：完成或 Unlistable</text>
  <rect class="node" x="740" y="440" width="320" height="80" rx="10"/>
  <text class="title" x="900" y="477">檔案都定案了</text>
  <text class="small" x="900" y="496">committed 或 failed</text>
  <text class="h" x="375" y="486">＋</text>
  <text class="h" x="725" y="486">＋</text>
</svg>
