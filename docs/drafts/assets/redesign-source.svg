<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="712" viewBox="0 0 1100 712" role="img" aria-labelledby="title description">
  <title id="title">提案中的 Source：一個擁有者，平行的執行者</title>
  <desc id="description">中間是擁有者，一條 thread，不做 I/O；Known、待讀的檔案、分段的進度、正在裝的 pack、兩種額度都在它手上。執行者回報的事件：目錄列完與 stat 完、讀完一個檔案或一段、block 組好了。session 交來的事件：Destination 的 Want 與 PageCompared、Credit、Done 與 Error，以及寬限後仍接不回來。它發出的命令：交給 lister 與 stat 列目錄，交給 reader 讀小檔或大檔的一段，交給壓縮組成 block，把 control 與 block 交給 session，經 server control 送報告。位元組不經過擁有者，只傳 handle；怎麼送、斷了怎麼重送，是 session 的事。下方：現在的 Source，Known 在 Mutex 裡，由掃描與讀回覆兩條 thread 共用；Backlog 以 Mutex 加 Condvar 由三條 thread 共用；file sender 擁有待讀的佇列，卻也自己串流大檔。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <marker id="arrow-path" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-path"/>
    </marker>
    <marker id="arrow-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-client"/>
    </marker>
    <marker id="arrow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-hot"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-fail"/>
    </marker>
    <marker id="arrow-peer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-peer"/>
    </marker>
    <style>
      :root {
        --text: #172033;
        --muted: #526078;
        --surface: #f7f9fc;
        --surface-strong: #e9eef8;
        --border: #8491a8;
        --group: #b4bdcc;
        --peer: #e5efff;
        --peer-border: #3478c8;
        --client: #f1ecfb;
        --client-border: #7b56c4;
        --path: #27875b;
        --path-surface: #e3f3ea;
        --hot: #b7791f;
        --hot-surface: #fdf2dc;
        --fail: #c2412d;
        --fail-surface: #fdecea;
        --badge: #172033;
        --badge-text: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #eef3fb;
          --muted: #b5c0d3;
          --surface: #202938;
          --surface-strong: #2b3850;
          --border: #8390a6;
          --group: #5a667a;
          --peer: #193a62;
          --peer-border: #6aa8f0;
          --client: #2e2547;
          --client-border: #b39af0;
          --path: #5bc792;
          --path-surface: #16382a;
          --hot: #f0b44c;
          --hot-surface: #41321a;
          --fail: #ff8a70;
          --fail-surface: #4a2420;
          --badge: #eef3fb;
          --badge-text: #172033;
        }
      }
      text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans CJK TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; font-size: 15px; text-anchor: middle; }
      .title { font-weight: 700; }
      .h { font-weight: 700; font-size: 17px; }
      .small { fill: var(--muted); font-size: 13px; }
      .label { fill: var(--muted); font-size: 12.5px; }
      .group-label { fill: var(--muted); font-size: 13.5px; font-weight: 700; letter-spacing: .05em; }
      .start { text-anchor: start; }
      .end { text-anchor: end; }
      .group { fill: none; stroke: var(--group); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .panel { fill: none; stroke: var(--group); stroke-width: 1.5; }
      .node { fill: var(--surface); stroke: var(--border); stroke-width: 1.8; }
      .strong { fill: var(--surface-strong); stroke: var(--border); stroke-width: 1.8; }
      .peer { fill: var(--peer); stroke: var(--peer-border); stroke-width: 2; }
      .client { fill: var(--client); stroke: var(--client-border); stroke-width: 2; }
      .hot { fill: var(--hot-surface); stroke: var(--hot); stroke-width: 2.2; }
      .failbox { fill: var(--fail-surface); stroke: var(--fail); stroke-width: 2.2; }
      .pathbox { fill: var(--path-surface); stroke: var(--path); stroke-width: 2; }
      .ghost { fill: none; stroke: var(--border); stroke-width: 1.5; stroke-dasharray: 4 4; }
      .bar { fill: var(--surface-strong); stroke: var(--border); stroke-width: 1.2; }
      .bar-peer { fill: var(--peer); stroke: var(--peer-border); stroke-width: 1.2; }
      .bar-hot { fill: var(--hot-surface); stroke: var(--hot); stroke-width: 1.5; }
      .bar-fail { fill: var(--fail-surface); stroke: var(--fail); stroke-width: 1.5; }
      .bar-path { fill: var(--path-surface); stroke: var(--path); stroke-width: 1.5; }
      .bar-idle { fill: none; stroke: var(--group); stroke-width: 1.2; stroke-dasharray: 3 3; }
      .edge { fill: none; stroke: var(--border); stroke-width: 2.2; marker-end: url(#arrow); }
      .edge-plain { fill: none; stroke: var(--border); stroke-width: 2; }
      .edge-dash { fill: none; stroke: var(--border); stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .path-edge { fill: none; stroke: var(--path); stroke-width: 2.6; marker-end: url(#arrow-path); }
      .path-line { fill: none; stroke: var(--path); stroke-width: 2.6; }
      .path-dash { fill: none; stroke: var(--path); stroke-width: 2.2; stroke-dasharray: 7 5; marker-end: url(#arrow-path); }
      .client-edge { fill: none; stroke: var(--client-border); stroke-width: 2.2; marker-end: url(#arrow-client); }
      .client-dash { fill: none; stroke: var(--client-border); stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow-client); }
      .hot-edge { fill: none; stroke: var(--hot); stroke-width: 2.4; marker-end: url(#arrow-hot); }
      .hot-dash { fill: none; stroke: var(--hot); stroke-width: 2.2; stroke-dasharray: 6 5; marker-end: url(#arrow-hot); }
      .fail-edge { fill: none; stroke: var(--fail); stroke-width: 2.4; marker-end: url(#arrow-fail); }
      .fail-line { fill: none; stroke: var(--fail); stroke-width: 3; }
      .peer-edge { fill: none; stroke: var(--peer-border); stroke-width: 2.4; marker-end: url(#arrow-peer); }
      .arrow-head { fill: var(--border); }
      .arrow-path { fill: var(--path); }
      .arrow-client { fill: var(--client-border); }
      .arrow-hot { fill: var(--hot); }
      .arrow-fail { fill: var(--fail); }
      .arrow-peer { fill: var(--peer-border); }
      .path-text { fill: var(--path); font-weight: 700; }
      .client-text { fill: var(--client-border); font-weight: 700; }
      .hot-text { fill: var(--hot); font-weight: 700; }
      .fail-text { fill: var(--fail); font-weight: 700; }
      .peer-text { fill: var(--peer-border); font-weight: 700; }
      .badge { fill: var(--badge); }
      .badge-text { fill: var(--badge-text); font-size: 12px; font-weight: 700; }
      .hot-badge { fill: var(--hot); }
      .dot { fill: var(--border); }
    </style>
  </defs>
  <rect class="peer" x="400" y="150" width="300" height="180" rx="10"/>
  <text class="h" x="550" y="186">擁有者</text>
  <text class="small" x="550" y="208">1 條 thread，不做 I/O</text>
  <path class="bar-idle" d="M 424 226 L 676 226"/>
  <text class="small" x="550" y="252">Known · 待讀 · 分段的進度</text>
  <text class="small" x="550" y="274">正在裝的 pack · 兩種額度</text>
  <text class="label" x="550" y="306">狀態都在這裡，只有它能改</text>
  <rect class="node" x="40" y="58" width="230" height="44" rx="10"/>
  <text class="title" x="155" y="85.5">目錄列完、stat 完</text>
  <path class="edge" d="M 270 80 L 398 176"/>
  <rect class="node" x="40" y="110" width="230" height="44" rx="10"/>
  <text class="title" x="155" y="137.5">讀完：一個檔案、一段</text>
  <path class="edge" d="M 270 132 L 398 202"/>
  <rect class="node" x="40" y="162" width="230" height="44" rx="10"/>
  <text class="title" x="155" y="189.5">block 組好了</text>
  <path class="edge" d="M 270 184 L 398 228"/>
  <rect class="node" x="40" y="248" width="230" height="44" rx="10"/>
  <text class="title" x="155" y="275.5">Want、PageCompared</text>
  <path class="edge" d="M 270 270 L 398 254"/>
  <rect class="node" x="40" y="300" width="230" height="44" rx="10"/>
  <text class="title" x="155" y="327.5">Credit、Done、Error</text>
  <path class="edge" d="M 270 322 L 398 280"/>
  <rect class="node" x="40" y="352" width="230" height="44" rx="10"/>
  <text class="title" x="155" y="379.5">寬限後仍接不回來</text>
  <path class="edge" d="M 270 374 L 398 306"/>
  <text class="group-label" x="155" y="44">執行者回報</text>
  <text class="group-label" x="155" y="234">session 交來</text>
  <rect class="node" x="830" y="56" width="240" height="48" rx="10"/>
  <text class="title" x="950" y="77">lister ×K、stat ×8</text>
  <text class="small" x="950" y="96">列目錄、stat</text>
  <path class="edge" d="M 700 178 L 828 80"/>
  <rect class="node" x="830" y="120" width="240" height="48" rx="10"/>
  <text class="title" x="950" y="141">reader ×16</text>
  <text class="small" x="950" y="160">讀小檔；pread 讀大檔的一段</text>
  <path class="edge" d="M 700 208 L 828 144"/>
  <rect class="node" x="830" y="184" width="240" height="48" rx="10"/>
  <text class="title" x="950" y="205">壓縮 ×8</text>
  <text class="small" x="950" y="224">組成 block、壓縮</text>
  <path class="edge" d="M 700 238 L 828 208"/>
  <rect class="pathbox" x="830" y="248" width="240" height="70" rx="10"/>
  <text class="title" x="950" y="271">session</text>
  <text class="small" x="950" y="290">control：Page、FileHash、Problem</text>
  <text class="small" x="950" y="308">block：額度內才交出</text>
  <path class="edge" d="M 700 268 L 828 283"/>
  <rect class="node" x="830" y="334" width="240" height="48" rx="10"/>
  <text class="title" x="950" y="355">server control</text>
  <text class="small" x="950" y="374">報告：進度、讀不到的路徑</text>
  <path class="edge" d="M 700 298 L 828 358"/>
  <text class="group-label" x="950" y="40">命令</text>
  <text class="small" x="550" y="358">位元組不經過擁有者，只傳 handle</text>
  <text class="small" x="550" y="378">怎麼送、斷了怎麼重送，是 session 的事</text>
  <rect class="group" x="20" y="430" width="1060" height="260" rx="14"/>
  <text class="group-label start" x="36" y="454">現在的 Source：狀態分在三條 thread，靠鎖</text>
  <rect class="node" x="50" y="478" width="200" height="56" rx="10"/>
  <text class="title" x="150" y="503">掃描</text>
  <text class="small" x="150" y="522">記 Known；等 Backlog</text>
  <rect class="node" x="300" y="478" width="200" height="56" rx="10"/>
  <text class="title" x="400" y="503">讀回覆</text>
  <text class="small" x="400" y="522">查、丟 Known；加 Backlog</text>
  <rect class="hot" x="550" y="478" width="200" height="56" rx="10"/>
  <text class="title" x="650" y="503">file sender</text>
  <text class="small" x="650" y="522">擁有待讀佇列；自己串流大檔</text>
  <rect class="strong" x="190" y="556" width="170" height="40" rx="10"/>
  <text class="title" x="275" y="581.5">Known（Mutex）</text>
  <rect class="strong" x="60" y="622" width="690" height="40" rx="10"/>
  <text class="title" x="405" y="647.5">Backlog（Mutex＋Condvar）</text>
  <path class="edge-plain" d="M 220 534 L 245 556"/>
  <path class="edge-plain" d="M 330 534 L 305 556"/>
  <path class="edge-plain" d="M 80 534 L 80 622"/>
  <path class="edge-plain" d="M 470 534 L 470 622"/>
  <path class="edge-plain" d="M 650 534 L 650 622"/>
  <rect class="pathbox" x="790" y="478" width="270" height="184" rx="12"/>
  <text class="title" x="925" y="512">提案</text>
  <text class="small" x="925" y="544">三份狀態都收進擁有者，不用鎖</text>
  <text class="small" x="925" y="568">file sender 的分派，成為擁有者的工作</text>
  <text class="small" x="925" y="592">讀檔全交給 reader</text>
  <text class="small" x="925" y="616">大檔的段由 16 個 reader 平行讀</text>
</svg>
