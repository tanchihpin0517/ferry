<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title description">
  <title id="title">Fixes to product code, by period and area</title>
  <desc id="description">Bar chart of the 118 fixes to product code in four periods, each bar in two parts: the transport with sessions and monitors, and every other area. Oct 14 to 17, the first build: 20 fixes, 2 of them in the transport and monitors. Oct 18 to 22, the Oct 17 review's list: 54, 7 of them there. Oct 23 to 27, the rewrites A1, B1, A2, one-session and silent-drops: 32, 24 of them there; 89% of that week's fixes changed code under 7 days old, where about 54% of the code then was. Oct 28 to Nov 13, pipes, large directories, filter and watch: 12, 3 of them there. The 47 fixes to tests alone are left out.</desc>
  <defs>
    <style>
      :root {
        --text: #172033;
        --muted: #526078;
        --grid: #e3e7ee;
        --axis: #8491a8;
        --series-1: #2a78d6;
        --series-2: #eb6834;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #eef3fb;
          --muted: #b5c0d3;
          --grid: #2c3546;
          --axis: #8390a6;
          --series-1: #3987e5;
          --series-2: #d95926;
        }
      }
      text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; text-anchor: middle; }
      .start { text-anchor: start; }
      .end { text-anchor: end; }
      .title { font-weight: 700; font-size: 15px; }
      .value { font-weight: 700; font-size: 15px; }
      .small { fill: var(--muted); font-size: 13px; }
      .tick { fill: var(--muted); font-size: 12.5px; }
      .grid { stroke: var(--grid); stroke-width: 1; }
      .axis { stroke: var(--axis); stroke-width: 1.5; }
      .s1 { fill: var(--series-1); }
      .s2 { fill: var(--series-2); }
    </style>
  </defs>

  <!-- Legend -->
  <text class="title start" x="60" y="36">Fixes to product code (118), by period and area</text>
  <rect class="s1" x="60" y="54" width="14" height="14" rx="3"/>
  <text class="small start" x="82" y="66">transport, sessions and monitors</text>
  <rect class="s2" x="330" y="54" width="14" height="14" rx="3"/>
  <text class="small start" x="352" y="66">every other area</text>

  <!-- Grid: 0, 20, 40, 60 fixes; 5.333 px a fix -->
  <line class="grid" x1="120" y1="100" x2="1040" y2="100"/>
  <line class="grid" x1="120" y1="206.7" x2="1040" y2="206.7"/>
  <line class="grid" x1="120" y1="313.3" x2="1040" y2="313.3"/>
  <line class="axis" x1="120" y1="420" x2="1040" y2="420"/>
  <text class="tick end" x="110" y="104">60</text>
  <text class="tick end" x="110" y="211">40</text>
  <text class="tick end" x="110" y="318">20</text>
  <text class="tick end" x="110" y="424">0</text>

  <!-- Oct 14-17: 2 + 18 -->
  <rect class="s1" x="205" y="409.3" width="110" height="10.7"/>
  <path class="s2" d="M 205 407.3 V 315.3 Q 205 311.3 209 311.3 H 311 Q 315 311.3 315 315.3 V 407.3 Z"/>
  <text class="value" x="260" y="301">20</text>

  <!-- Oct 18-22: 7 + 47 -->
  <rect class="s1" x="425" y="382.7" width="110" height="37.3"/>
  <path class="s2" d="M 425 380.7 V 134 Q 425 130 429 130 H 531 Q 535 130 535 134 V 380.7 Z"/>
  <text class="value" x="480" y="120">54</text>

  <!-- Oct 23-27: 24 + 8 -->
  <rect class="s1" x="645" y="292" width="110" height="128"/>
  <path class="s2" d="M 645 290 V 251.3 Q 645 247.3 649 247.3 H 751 Q 755 247.3 755 251.3 V 290 Z"/>
  <text class="value" x="700" y="237">32</text>
  <text class="small" x="700" y="166">24 in the transport, sessions and monitors</text>
  <text class="small" x="700" y="187">89% changed code under 7 days old,</text>
  <text class="small" x="700" y="208">where about 54% of the code then was</text>

  <!-- Oct 28 - Nov 13: 3 + 9 -->
  <rect class="s1" x="865" y="404" width="110" height="16"/>
  <path class="s2" d="M 865 402 V 358 Q 865 354 869 354 H 971 Q 975 354 975 358 V 402 Z"/>
  <text class="value" x="920" y="344">12</text>

  <!-- Periods -->
  <text x="260" y="446">Oct 14–17</text>
  <text class="small" x="260" y="467">the first build</text>
  <text x="480" y="446">Oct 18–22</text>
  <text class="small" x="480" y="467">the Oct 17 review's list</text>
  <text x="700" y="446">Oct 23–27</text>
  <text class="small" x="700" y="467">rewrites: A1, B1, A2,</text>
  <text class="small" x="700" y="486">one-session, silent-drops</text>
  <text x="920" y="446">Oct 28 – Nov 13</text>
  <text class="small" x="920" y="467">pipes, large directories,</text>
  <text class="small" x="920" y="486">filter, watch</text>

  <text class="small start" x="60" y="536">The 47 fixes to tests alone are left out. The transport went through about five versions between Oct 15 and Oct 28.</text>
</svg>
