<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="670" viewBox="0 0 1100 670" role="img" aria-labelledby="title description">
  <title id="title">提案中的 Destination：一個決策者，平行的執行者</title>
  <desc id="description">中間是決策者，一條 thread，不做任何 I/O，只保存目錄與檔案的狀態並做決定。它收到的事件：manifest page 到了、比較完成、block 驗證好了、操作完成、FileHash 與 Unlistable。它發出的命令：交給比較的 pool 列目錄與 stat，交給執行者做名稱操作（刪除、mkdir、symlink、link、rename）、寫內容與屬性、fsync、目錄收尾，並經 session 送出 Want、Credit、Results。下方：現在 applier 一條 thread 刪 100 萬個檔案，期間沒有任何 Want；提案中不同目錄的刪除由 K 條平行做，Want 照常送出。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <marker id="arrow-path" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-path"/>
    </marker>
    <marker id="arrow-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-client"/>
    </marker>
    <marker id="arrow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-hot"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-fail"/>
    </marker>
    <marker id="arrow-peer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-peer"/>
    </marker>
    <style>
      :root {
        --text: #172033;
        --muted: #526078;
        --surface: #f7f9fc;
        --surface-strong: #e9eef8;
        --border: #8491a8;
        --group: #b4bdcc;
        --peer: #e5efff;
        --peer-border: #3478c8;
        --client: #f1ecfb;
        --client-border: #7b56c4;
        --path: #27875b;
        --path-surface: #e3f3ea;
        --hot: #b7791f;
        --hot-surface: #fdf2dc;
        --fail: #c2412d;
        --fail-surface: #fdecea;
        --badge: #172033;
        --badge-text: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #eef3fb;
          --muted: #b5c0d3;
          --surface: #202938;
          --surface-strong: #2b3850;
          --border: #8390a6;
          --group: #5a667a;
          --peer: #193a62;
          --peer-border: #6aa8f0;
          --client: #2e2547;
          --client-border: #b39af0;
          --path: #5bc792;
          --path-surface: #16382a;
          --hot: #f0b44c;
          --hot-surface: #41321a;
          --fail: #ff8a70;
          --fail-surface: #4a2420;
          --badge: #eef3fb;
          --badge-text: #172033;
        }
      }
      text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans CJK TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; font-size: 15px; text-anchor: middle; }
      .title { font-weight: 700; }
      .h { font-weight: 700; font-size: 17px; }
      .small { fill: var(--muted); font-size: 13px; }
      .label { fill: var(--muted); font-size: 12.5px; }
      .group-label { fill: var(--muted); font-size: 13.5px; font-weight: 700; letter-spacing: .05em; }
      .start { text-anchor: start; }
      .end { text-anchor: end; }
      .group { fill: none; stroke: var(--group); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .panel { fill: none; stroke: var(--group); stroke-width: 1.5; }
      .node { fill: var(--surface); stroke: var(--border); stroke-width: 1.8; }
      .strong { fill: var(--surface-strong); stroke: var(--border); stroke-width: 1.8; }
      .peer { fill: var(--peer); stroke: var(--peer-border); stroke-width: 2; }
      .client { fill: var(--client); stroke: var(--client-border); stroke-width: 2; }
      .hot { fill: var(--hot-surface); stroke: var(--hot); stroke-width: 2.2; }
      .failbox { fill: var(--fail-surface); stroke: var(--fail); stroke-width: 2.2; }
      .pathbox { fill: var(--path-surface); stroke: var(--path); stroke-width: 2; }
      .ghost { fill: none; stroke: var(--border); stroke-width: 1.5; stroke-dasharray: 4 4; }
      .bar { fill: var(--surface-strong); stroke: var(--border); stroke-width: 1.2; }
      .bar-peer { fill: var(--peer); stroke: var(--peer-border); stroke-width: 1.2; }
      .bar-hot { fill: var(--hot-surface); stroke: var(--hot); stroke-width: 1.5; }
      .bar-fail { fill: var(--fail-surface); stroke: var(--fail); stroke-width: 1.5; }
      .bar-path { fill: var(--path-surface); stroke: var(--path); stroke-width: 1.5; }
      .bar-idle { fill: none; stroke: var(--group); stroke-width: 1.2; stroke-dasharray: 3 3; }
      .edge { fill: none; stroke: var(--border); stroke-width: 2.2; marker-end: url(#arrow); }
      .edge-plain { fill: none; stroke: var(--border); stroke-width: 2; }
      .edge-dash { fill: none; stroke: var(--border); stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .path-edge { fill: none; stroke: var(--path); stroke-width: 2.6; marker-end: url(#arrow-path); }
      .path-line { fill: none; stroke: var(--path); stroke-width: 2.6; }
      .path-dash { fill: none; stroke: var(--path); stroke-width: 2.2; stroke-dasharray: 7 5; marker-end: url(#arrow-path); }
      .client-edge { fill: none; stroke: var(--client-border); stroke-width: 2.2; marker-end: url(#arrow-client); }
      .client-dash { fill: none; stroke: var(--client-border); stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow-client); }
      .hot-edge { fill: none; stroke: var(--hot); stroke-width: 2.4; marker-end: url(#arrow-hot); }
      .hot-dash { fill: none; stroke: var(--hot); stroke-width: 2.2; stroke-dasharray: 6 5; marker-end: url(#arrow-hot); }
      .fail-edge { fill: none; stroke: var(--fail); stroke-width: 2.4; marker-end: url(#arrow-fail); }
      .fail-line { fill: none; stroke: var(--fail); stroke-width: 3; }
      .peer-edge { fill: none; stroke: var(--peer-border); stroke-width: 2.4; marker-end: url(#arrow-peer); }
      .arrow-head { fill: var(--border); }
      .arrow-path { fill: var(--path); }
      .arrow-client { fill: var(--client-border); }
      .arrow-hot { fill: var(--hot); }
      .arrow-fail { fill: var(--fail); }
      .arrow-peer { fill: var(--peer-border); }
      .path-text { fill: var(--path); font-weight: 700; }
      .client-text { fill: var(--client-border); font-weight: 700; }
      .hot-text { fill: var(--hot); font-weight: 700; }
      .fail-text { fill: var(--fail); font-weight: 700; }
      .peer-text { fill: var(--peer-border); font-weight: 700; }
      .badge { fill: var(--badge); }
      .badge-text { fill: var(--badge-text); font-size: 12px; font-weight: 700; }
      .hot-badge { fill: var(--hot); }
      .dot { fill: var(--border); }
    </style>
  </defs>
  <rect class="peer" x="400" y="210" width="300" height="120" rx="10"/>
  <text class="title" x="550" y="258">決策者</text>
  <text class="small" x="550" y="277">1 條 thread，不做 I/O</text>
  <text class="small" x="550" y="295">目錄與檔案的狀態都在這裡</text>
  <rect class="node" x="40" y="70" width="220" height="46" rx="10"/>
  <text class="title" x="150" y="98.5">manifest page 到了</text>
  <path class="edge" d="M 260 93 L 398 230"/>
  <rect class="node" x="40" y="136" width="220" height="46" rx="10"/>
  <text class="title" x="150" y="164.5">比較完成</text>
  <path class="edge" d="M 260 159 L 398 250"/>
  <rect class="node" x="40" y="202" width="220" height="46" rx="10"/>
  <text class="title" x="150" y="230.5">block 驗證好了</text>
  <path class="edge" d="M 260 225 L 398 270"/>
  <rect class="node" x="40" y="268" width="220" height="46" rx="10"/>
  <text class="title" x="150" y="296.5">操作完成</text>
  <path class="edge" d="M 260 291 L 398 290"/>
  <rect class="node" x="40" y="334" width="220" height="46" rx="10"/>
  <text class="title" x="150" y="362.5">FileHash、Unlistable</text>
  <path class="edge" d="M 260 357 L 398 310"/>
  <text class="group-label" x="150" y="52">事件</text>
  <rect class="node" x="840" y="60" width="230" height="48" rx="10"/>
  <text class="title" x="955" y="81">比較 ×8</text>
  <text class="small" x="955" y="100">列目錄、merge、stat</text>
  <path class="edge" d="M 700 226 L 838 84"/>
  <rect class="node" x="840" y="120" width="230" height="48" rx="10"/>
  <text class="title" x="955" y="141">名稱操作 ×K</text>
  <text class="small" x="955" y="160">刪除、mkdir、symlink、link</text>
  <path class="edge" d="M 700 244 L 838 144"/>
  <rect class="node" x="840" y="180" width="230" height="48" rx="10"/>
  <text class="title" x="955" y="201">內容 ×16</text>
  <text class="small" x="955" y="220">寫入暫存檔、屬性</text>
  <path class="edge" d="M 700 262 L 838 204"/>
  <rect class="node" x="840" y="240" width="230" height="48" rx="10"/>
  <text class="title" x="955" y="261">fsync ×64</text>
  <text class="small" x="955" y="280">只是在等磁碟</text>
  <path class="edge" d="M 700 280 L 838 264"/>
  <rect class="node" x="840" y="300" width="230" height="48" rx="10"/>
  <text class="title" x="955" y="321">收尾</text>
  <text class="small" x="955" y="340">目錄的屬性、fsync</text>
  <path class="edge" d="M 700 298 L 838 324"/>
  <rect class="pathbox" x="840" y="360" width="230" height="48" rx="10"/>
  <text class="title" x="955" y="381">session</text>
  <text class="small" x="955" y="400">Want、Credit、Results</text>
  <path class="edge" d="M 700 316 L 838 384"/>
  <text class="group-label" x="955" y="44">命令</text>
  <text class="small" x="550" y="360">所有檔案系統操作都交給右邊的 pool；決策者只收事件、發命令</text>
  <rect class="group" x="20" y="430" width="1060" height="220" rx="14"/>
  <text class="group-label start" x="36" y="454">同一次 sync：old/ 裡有 100 萬個多餘的檔案</text>
  <text class="title start" x="40" y="488">現在</text>
  <text class="small start" x="40" y="506">applier 1 條</text>
  <rect class="bar-hot" x="150" y="476" width="760" height="26" rx="5"/>
  <text class="small" x="530" y="494">刪除 old/：一個接一個，WekaFS 上約 11 分鐘</text>
  <rect class="bar-peer" x="914" y="476" width="140" height="26" rx="5"/>
  <text class="label" x="984" y="494">其他目錄</text>
  <text class="fail-text start" x="150" y="530">Want：這段時間一個都沒有</text>
  <text class="title start" x="40" y="578">提案</text>
  <text class="small start" x="40" y="596">執行者 K 條</text>
  <rect class="bar-hot" x="150" y="558" width="230" height="9" rx="3"/>
  <rect class="bar-hot" x="150" y="570" width="230" height="9" rx="3"/>
  <rect class="bar-hot" x="150" y="582" width="230" height="9" rx="3"/>
  <rect class="bar-hot" x="150" y="594" width="230" height="9" rx="3"/>
  <text class="small start" x="390" y="578">不同目錄的刪除由 K 條平行做；伺服器跟得上時約 ÷K</text>
  <circle class="dot" cx="160" cy="630" r="5"/>
  <circle class="dot" cx="220" cy="630" r="5"/>
  <circle class="dot" cx="280" cy="630" r="5"/>
  <circle class="dot" cx="340" cy="630" r="5"/>
  <circle class="dot" cx="400" cy="630" r="5"/>
  <circle class="dot" cx="460" cy="630" r="5"/>
  <circle class="dot" cx="520" cy="630" r="5"/>
  <circle class="dot" cx="580" cy="630" r="5"/>
  <circle class="dot" cx="640" cy="630" r="5"/>
  <circle class="dot" cx="700" cy="630" r="5"/>
  <circle class="dot" cx="760" cy="630" r="5"/>
  <circle class="dot" cx="820" cy="630" r="5"/>
  <circle class="dot" cx="880" cy="630" r="5"/>
  <circle class="dot" cx="940" cy="630" r="5"/>
  <circle class="dot" cx="1000" cy="630" r="5"/>
  <text class="path-text end" x="1060" y="606">Want 照常送出 →</text>
</svg>
