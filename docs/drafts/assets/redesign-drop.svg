<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title description">
  <title id="title">一條路徑斷掉時：現在與提案</title>
  <desc id="description">上：現在，片段全域編號後分到三條路徑；第 2 條斷了，第 5、8 片跟著消失，接收端等第 5 片，它永遠不會來，整條連線失敗，傳輸失敗；重跑時，傳到一半的大檔從頭來。下：提案，block 各自獨立，Destination 的 session 收到就確認，Source 的 session 保留還沒被確認的 block；stream 2 斷了，B5、B8 沒被確認，就改從 stream 1、3 重送，順序不拘，傳輸照常完成，stream 2 在背景重建。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <marker id="arrow-path" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-path"/>
    </marker>
    <marker id="arrow-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-client"/>
    </marker>
    <marker id="arrow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-hot"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-fail"/>
    </marker>
    <marker id="arrow-peer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-peer"/>
    </marker>
    <style>
      :root {
        --text: #172033;
        --muted: #526078;
        --surface: #f7f9fc;
        --surface-strong: #e9eef8;
        --border: #8491a8;
        --group: #b4bdcc;
        --peer: #e5efff;
        --peer-border: #3478c8;
        --client: #f1ecfb;
        --client-border: #7b56c4;
        --path: #27875b;
        --path-surface: #e3f3ea;
        --hot: #b7791f;
        --hot-surface: #fdf2dc;
        --fail: #c2412d;
        --fail-surface: #fdecea;
        --badge: #172033;
        --badge-text: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #eef3fb;
          --muted: #b5c0d3;
          --surface: #202938;
          --surface-strong: #2b3850;
          --border: #8390a6;
          --group: #5a667a;
          --peer: #193a62;
          --peer-border: #6aa8f0;
          --client: #2e2547;
          --client-border: #b39af0;
          --path: #5bc792;
          --path-surface: #16382a;
          --hot: #f0b44c;
          --hot-surface: #41321a;
          --fail: #ff8a70;
          --fail-surface: #4a2420;
          --badge: #eef3fb;
          --badge-text: #172033;
        }
      }
      text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans CJK TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; font-size: 15px; text-anchor: middle; }
      .title { font-weight: 700; }
      .h { font-weight: 700; font-size: 17px; }
      .small { fill: var(--muted); font-size: 13px; }
      .label { fill: var(--muted); font-size: 12.5px; }
      .group-label { fill: var(--muted); font-size: 13.5px; font-weight: 700; letter-spacing: .05em; }
      .start { text-anchor: start; }
      .end { text-anchor: end; }
      .group { fill: none; stroke: var(--group); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .panel { fill: none; stroke: var(--group); stroke-width: 1.5; }
      .node { fill: var(--surface); stroke: var(--border); stroke-width: 1.8; }
      .strong { fill: var(--surface-strong); stroke: var(--border); stroke-width: 1.8; }
      .peer { fill: var(--peer); stroke: var(--peer-border); stroke-width: 2; }
      .client { fill: var(--client); stroke: var(--client-border); stroke-width: 2; }
      .hot { fill: var(--hot-surface); stroke: var(--hot); stroke-width: 2.2; }
      .failbox { fill: var(--fail-surface); stroke: var(--fail); stroke-width: 2.2; }
      .pathbox { fill: var(--path-surface); stroke: var(--path); stroke-width: 2; }
      .ghost { fill: none; stroke: var(--border); stroke-width: 1.5; stroke-dasharray: 4 4; }
      .bar { fill: var(--surface-strong); stroke: var(--border); stroke-width: 1.2; }
      .bar-peer { fill: var(--peer); stroke: var(--peer-border); stroke-width: 1.2; }
      .bar-hot { fill: var(--hot-surface); stroke: var(--hot); stroke-width: 1.5; }
      .bar-fail { fill: var(--fail-surface); stroke: var(--fail); stroke-width: 1.5; }
      .bar-path { fill: var(--path-surface); stroke: var(--path); stroke-width: 1.5; }
      .bar-idle { fill: none; stroke: var(--group); stroke-width: 1.2; stroke-dasharray: 3 3; }
      .edge { fill: none; stroke: var(--border); stroke-width: 2.2; marker-end: url(#arrow); }
      .edge-plain { fill: none; stroke: var(--border); stroke-width: 2; }
      .edge-dash { fill: none; stroke: var(--border); stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .path-edge { fill: none; stroke: var(--path); stroke-width: 2.6; marker-end: url(#arrow-path); }
      .path-line { fill: none; stroke: var(--path); stroke-width: 2.6; }
      .path-dash { fill: none; stroke: var(--path); stroke-width: 2.2; stroke-dasharray: 7 5; marker-end: url(#arrow-path); }
      .client-edge { fill: none; stroke: var(--client-border); stroke-width: 2.2; marker-end: url(#arrow-client); }
      .client-dash { fill: none; stroke: var(--client-border); stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow-client); }
      .hot-edge { fill: none; stroke: var(--hot); stroke-width: 2.4; marker-end: url(#arrow-hot); }
      .hot-dash { fill: none; stroke: var(--hot); stroke-width: 2.2; stroke-dasharray: 6 5; marker-end: url(#arrow-hot); }
      .fail-edge { fill: none; stroke: var(--fail); stroke-width: 2.4; marker-end: url(#arrow-fail); }
      .fail-line { fill: none; stroke: var(--fail); stroke-width: 3; }
      .peer-edge { fill: none; stroke: var(--peer-border); stroke-width: 2.4; marker-end: url(#arrow-peer); }
      .arrow-head { fill: var(--border); }
      .arrow-path { fill: var(--path); }
      .arrow-client { fill: var(--client-border); }
      .arrow-hot { fill: var(--hot); }
      .arrow-fail { fill: var(--fail); }
      .arrow-peer { fill: var(--peer-border); }
      .path-text { fill: var(--path); font-weight: 700; }
      .client-text { fill: var(--client-border); font-weight: 700; }
      .hot-text { fill: var(--hot); font-weight: 700; }
      .fail-text { fill: var(--fail); font-weight: 700; }
      .peer-text { fill: var(--peer-border); font-weight: 700; }
      .badge { fill: var(--badge); }
      .badge-text { fill: var(--badge-text); font-size: 12px; font-weight: 700; }
      .hot-badge { fill: var(--hot); }
      .dot { fill: var(--border); }
    </style>
  </defs>
  <rect class="group" x="20" y="20" width="1060" height="280" rx="14"/>
  <text class="group-label start" x="36" y="44">現在：一條路徑斷了</text>
  <rect class="node" x="40" y="120" width="130" height="60" rx="10"/>
  <text class="title" x="105" y="147">pump</text>
  <text class="small" x="105" y="166">片段全域編號</text>
  <path class="path-edge" d="M 170 150 L 200 95 L 840 95"/>
  <text class="label end" x="826" y="85">路徑 1</text>
  <path class="path-edge" d="M 170 150 L 840 150"/>
  <text class="label end" x="826" y="140">路徑 2</text>
  <path class="path-edge" d="M 170 150 L 200 205 L 840 205"/>
  <text class="label end" x="826" y="195">路徑 3</text>
  <rect class="bar-path" x="700" y="83" width="40" height="24" rx="5"/>
  <text class="label" x="720" y="100">1</text>
  <rect class="bar-path" x="520" y="83" width="40" height="24" rx="5"/>
  <text class="label" x="540" y="100">4</text>
  <rect class="bar-path" x="340" y="83" width="40" height="24" rx="5"/>
  <text class="label" x="360" y="100">7</text>
  <rect class="bar-path" x="700" y="138" width="40" height="24" rx="5"/>
  <text class="label" x="720" y="155">2</text>
  <rect class="bar-path" x="700" y="193" width="40" height="24" rx="5"/>
  <text class="label" x="720" y="210">3</text>
  <rect class="bar-path" x="520" y="193" width="40" height="24" rx="5"/>
  <text class="label" x="540" y="210">6</text>
  <rect class="bar-path" x="340" y="193" width="40" height="24" rx="5"/>
  <text class="label" x="360" y="210">9</text>
  <path class="fail-line" d="M 590 138 L 610 162"/>
  <path class="fail-line" d="M 590 162 L 610 138"/>
  <rect class="bar-fail" x="500" y="138" width="40" height="24" rx="5"/>
  <text class="label" x="520" y="155">5</text>
  <rect class="bar-fail" x="330" y="138" width="40" height="24" rx="5"/>
  <text class="label" x="350" y="155">8</text>
  <text class="fail-text" x="600" y="182">斷了：5、8 跟著消失</text>
  <rect class="failbox" x="860" y="100" width="200" height="110" rx="10"/>
  <text class="title" x="960" y="128">重排</text>
  <text class="small" x="960" y="152">已收 1 2 3 4 · 6 7 · 9</text>
  <text class="small" x="960" y="174">等第 5 片</text>
  <text class="small" x="960" y="196">它永遠不會來</text>
  <text class="fail-text" x="960" y="244">→ 整條連線失敗 → 傳輸失敗</text>
  <text class="small start" x="40" y="282">重跑時，完成的檔案會跳過；傳到一半的大檔從頭來。</text>
  <rect class="group" x="20" y="320" width="1060" height="280" rx="14"/>
  <text class="group-label start" x="36" y="344">提案：沒被確認的 block 改走別條</text>
  <rect class="peer" x="40" y="420" width="130" height="60" rx="10"/>
  <text class="title" x="105" y="447">session</text>
  <text class="small" x="105" y="466">保留未確認的</text>
  <path class="path-edge" d="M 170 450 L 200 395 L 840 395"/>
  <text class="label end" x="826" y="385">stream 1</text>
  <path class="path-edge" d="M 170 450 L 840 450"/>
  <text class="label end" x="826" y="440">stream 2</text>
  <path class="path-edge" d="M 170 450 L 200 505 L 840 505"/>
  <text class="label end" x="826" y="495">stream 3</text>
  <rect class="bar-path" x="700" y="383" width="40" height="24" rx="5"/>
  <text class="label" x="720" y="400">B1</text>
  <rect class="bar-path" x="520" y="383" width="40" height="24" rx="5"/>
  <text class="label" x="540" y="400">B4</text>
  <rect class="bar-path" x="340" y="383" width="40" height="24" rx="5"/>
  <text class="label" x="360" y="400">B7</text>
  <rect class="bar-hot" x="260" y="383" width="40" height="24" rx="5"/>
  <text class="label" x="280" y="400">B5</text>
  <rect class="bar-path" x="700" y="438" width="40" height="24" rx="5"/>
  <text class="label" x="720" y="455">B2</text>
  <path class="fail-line" d="M 590 438 L 610 462"/>
  <path class="fail-line" d="M 590 462 L 610 438"/>
  <rect class="bar-fail" x="500" y="438" width="40" height="24" rx="5"/>
  <text class="label" x="520" y="455">B5</text>
  <rect class="bar-fail" x="330" y="438" width="40" height="24" rx="5"/>
  <text class="label" x="350" y="455">B8</text>
  <rect class="bar-path" x="700" y="493" width="40" height="24" rx="5"/>
  <text class="label" x="720" y="510">B3</text>
  <rect class="bar-path" x="520" y="493" width="40" height="24" rx="5"/>
  <text class="label" x="540" y="510">B6</text>
  <rect class="bar-path" x="340" y="493" width="40" height="24" rx="5"/>
  <text class="label" x="360" y="510">B9</text>
  <rect class="bar-hot" x="260" y="493" width="40" height="24" rx="5"/>
  <text class="label" x="280" y="510">B8</text>
  <text class="fail-text" x="600" y="482">斷了：B5、B8 沒被確認</text>
  <text class="hot-text" x="280" y="376">重送</text>
  <text class="hot-text" x="280" y="538">重送</text>
  <path class="client-dash" d="M 860 352 L 172 352"/>
  <text class="client-text" x="516" y="344">Ack：B1–B4、B6、B7、B9</text>
  <rect class="pathbox" x="860" y="400" width="200" height="110" rx="10"/>
  <text class="title" x="960" y="428">session 依編號收</text>
  <text class="small" x="960" y="452">B1 到 B9 都到了</text>
  <text class="small" x="960" y="474">順序不拘</text>
  <text class="small" x="960" y="496">重複的丟掉</text>
  <text class="path-text" x="960" y="548">→ 照常完成</text>
  <text class="small" x="960" y="570">stream 2 在背景重建</text>
</svg>
