<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="772" viewBox="0 0 1100 772" role="img" aria-labelledby="title description">
  <title id="title">Frames once ready</title>
  <desc id="description">Frames and compression once ready. a, the frame: pipe, one byte; kind, one byte; length, four bytes; then the content, at most 64 KiB; kind 0 is Bytes, the next piece of this pipe's content; kind 1 is Window, giving back this pipe's window; kind 2 is End, this pipe is fully written, data's carrying the number of chunks; kind 3 is Sync, a sync marker, carrying the number of bytes written before it; kind 4 is Synced, the answer that the program at the far end has read up to there. Pipe numbers are fixed by the kind of connection. b, a pipe with streaming compression, the manifest for example: records one after another, compressed into one zstd stream, cut into several Bytes frames; the boundaries of records, of zstd blocks and of frames have nothing to do with one another. c, data: each chunk is a sequence number, raw or zstd, a length and the content; a chunk can be cut into several frames, all on the same stream, with frames of other pipes between them; chunks are spread over the streams, and the receiver puts them back in order by sequence number. d, the first stream's two directions: from the Source to the Destination, the manifest, data and control; the other way, answers, the windows given back for the manifest and data, and control.</desc>
