  <text class="group-label start" x="20" y="28">a. The frame: once ready, the only thing on a connection</text>
  <rect class="strong" x="40" y="48" width="70" height="40" rx="4"/>
  <text class="title" x="75" y="73">pipe</text>
  <text class="label" x="75" y="106">1 byte</text>
  <rect class="strong" x="114" y="48" width="70" height="40" rx="4"/>
  <text class="title" x="149" y="73">kind</text>
  <text class="label" x="149" y="106">1 byte</text>
  <rect class="strong" x="188" y="48" width="150" height="40" rx="4"/>
  <text class="title" x="263" y="73">length</text>
  <text class="label" x="263" y="106">4 bytes, little-endian</text>
  <rect class="node" x="342" y="48" width="330" height="40" rx="4"/>
  <text class="title" x="507" y="73">content</text>
  <text class="label" x="507" y="106">up to 64 KiB</text>
  <text class="small start" x="700" y="56">kind 0 Bytes: the next piece of the pipe's content</text>
  <text class="small start" x="700" y="80">kind 1 Window: gives back the pipe's window, u32 bytes</text>
  <text class="small start" x="700" y="104">kind 2 End: the pipe is written; data's: u64 chunk count</text>
  <text class="small start" x="700" y="128">kind 3 Sync: u32 number, u64 bytes written before</text>
  <text class="small start" x="700" y="152">kind 4 Synced: far program read up to it, same number</text>
  <text class="small start" x="40" y="184">Pipe numbers are fixed by connection kind: stream 0 control, 1 manifest, 2 data, 3 answers; control connection 0 control, 1 reports; link 0 control.</text>
  <g transform="translate(0, 44)">
  <text class="group-label start" x="20" y="186">b. A pipe with streaming compression: the manifest, for example</text>
  <rect class="bar-peer" x="40" y="206" width="46" height="26" rx="4"/>
  <text class="label" x="63" y="224">In a</text>
  <rect class="bar-peer" x="90" y="206" width="30" height="26" rx="4"/>
  <text class="label" x="105" y="224">x</text>
  <rect class="bar-peer" x="124" y="206" width="30" height="26" rx="4"/>
  <text class="label" x="139" y="224">y</text>
  <rect class="bar-peer" x="158" y="206" width="66" height="26" rx="4"/>
  <text class="label" x="191" y="224">Listed a</text>
  <rect class="bar-peer" x="228" y="206" width="46" height="26" rx="4"/>
  <text class="label" x="251" y="224">In b</text>
  <rect class="bar-peer" x="278" y="206" width="30" height="26" rx="4"/>
  <text class="label" x="293" y="224">z</text>
  <text class="label start" x="318" y="224">…</text>
  <path class="edge" d="M 360 219 H 396"/>
  <rect class="node" x="400" y="200" width="120" height="40" rx="6"/>
  <text class="title" x="460" y="218">zstd</text>
  <text class="label" x="460" y="234">one stream</text>
  <path class="edge" d="M 520 219 H 556"/>
  <rect class="bar" x="560" y="207" width="220" height="24" rx="4"/>
  <text class="label" x="670" y="224">compressed bytes</text>
  <path class="edge" d="M 780 219 H 816"/>
  <rect class="strong" x="820" y="207" width="14" height="24" rx="3"/>
  <rect class="bar-peer" x="836" y="207" width="70" height="24" rx="3"/>
  <rect class="strong" x="914" y="207" width="14" height="24" rx="3"/>
  <rect class="bar-peer" x="930" y="207" width="54" height="24" rx="3"/>
  <rect class="strong" x="992" y="207" width="14" height="24" rx="3"/>
  <rect class="bar-peer" x="1008" y="207" width="40" height="24" rx="3"/>
  <text class="label" x="940" y="250">three Bytes frames</text>
  <text class="small start" x="40" y="282">Records, zstd blocks and frames don't line up: the reader feeds each frame in order to the pipe's decompressor and finds the records itself.</text>
  <text class="small start" x="40" y="304">Compression is pulled by the pump: only on this pipe's turn, with room downstream, does it take all of the send buffer, compress it and flush;</text>
  <text class="small start" x="40" y="326">when downstream is slow, more gathers on its own. answers, reports and control work the same way.</text>
  <text class="group-label start" x="20" y="372">c. data: cut into chunks, compressed in parallel, spread over the streams</text>
  <rect class="strong" x="40" y="392" width="110" height="36" rx="4"/>
  <text class="title" x="95" y="415">sequence</text>
  <text class="label" x="95" y="446">8 bytes</text>
  <rect class="strong" x="154" y="392" width="120" height="36" rx="4"/>
  <text class="title" x="214" y="415">raw or zstd</text>
  <text class="label" x="214" y="446">1 byte</text>
  <rect class="strong" x="278" y="392" width="100" height="36" rx="4"/>
  <text class="title" x="328" y="415">length</text>
  <text class="label" x="328" y="446">4 bytes</text>
  <rect class="bar-path" x="382" y="392" width="230" height="36" rx="4"/>
  <text class="small" x="497" y="415">chunk content</text>
  <text class="label" x="497" y="446">compressed, or raw</text>
  <path class="edge" d="M 616 410 H 690"/>
  <text class="label end" x="756" y="404">stream 0</text>
  <path class="edge-plain" d="M 766 400 H 1070"/>
  <text class="label end" x="756" y="438">stream 1</text>
  <path class="edge-plain" d="M 766 434 H 1070"/>
  <text class="label end" x="756" y="472">stream 2</text>
  <path class="edge-plain" d="M 766 468 H 1070"/>
  <rect class="strong" x="776" y="388" width="14" height="24" rx="3"/>
  <rect class="bar-path" x="792" y="388" width="60" height="24" rx="3"/>
  <text class="label" x="822" y="404.5">chunk 4</text>
  <rect class="strong" x="856" y="388" width="14" height="24" rx="3"/>
  <rect class="bar-peer" x="872" y="388" width="40" height="24" rx="3"/>
  <text class="label" x="892" y="404.5">m</text>
  <rect class="strong" x="916" y="388" width="14" height="24" rx="3"/>
  <rect class="bar-path" x="932" y="388" width="60" height="24" rx="3"/>
  <text class="label" x="962" y="404.5">chunk 4</text>
  <rect class="strong" x="776" y="422" width="14" height="24" rx="3"/>
  <rect class="bar-path" x="792" y="422" width="80" height="24" rx="3"/>
  <text class="label" x="832" y="438.5">chunk 5</text>
  <rect class="strong" x="876" y="422" width="14" height="24" rx="3"/>
  <rect class="bar-path" x="892" y="422" width="80" height="24" rx="3"/>
  <text class="label" x="932" y="438.5">chunk 5</text>
  <rect class="strong" x="976" y="422" width="14" height="24" rx="3"/>
  <rect class="bar-path" x="992" y="422" width="60" height="24" rx="3"/>
  <text class="label" x="1022" y="438.5">chunk 7</text>
  <rect class="strong" x="776" y="456" width="14" height="24" rx="3"/>
  <rect class="bar-path" x="792" y="456" width="100" height="24" rx="3"/>
  <text class="label" x="842" y="472.5">chunk 6</text>
  <rect class="strong" x="896" y="456" width="14" height="24" rx="3"/>
  <rect class="bar-path" x="912" y="456" width="70" height="24" rx="3"/>
  <text class="label" x="947" y="472.5">chunk 6</text>
  <text class="small start" x="40" y="510">A chunk may span several frames, all on one stream, with other pipes' frames between (m: manifest); a stream sends one chunk at a time.</text>
  <text class="small start" x="40" y="532">Less than a chunk: what is there on data's turn makes a chunk. The receiver puts chunks back in order by sequence number;</text>
  <text class="small start" x="40" y="554">data's End carries the chunk count; complete only when all have arrived. A chunk that compression does not shrink is sent marked raw.</text>
  <text class="group-label start" x="20" y="600">d. The first stream's two directions</text>
  <text class="small start" x="40" y="640">S → D</text>
  <text class="small start" x="40" y="680">D → S</text>
  <path class="edge-plain" d="M 100 634 H 1070"/>
  <path class="edge-plain" d="M 100 674 H 1070"/>
  <rect class="strong" x="110" y="622" width="14" height="24" rx="3"/>
  <rect class="bar-peer" x="126" y="622" width="90" height="24" rx="3"/>
  <text class="label" x="171" y="638.5">manifest</text>
  <rect class="strong" x="230" y="622" width="14" height="24" rx="3"/>
  <rect class="bar-path" x="246" y="622" width="70" height="24" rx="3"/>
  <text class="label" x="281" y="638.5">data</text>
  <rect class="strong" x="330" y="622" width="14" height="24" rx="3"/>
  <rect class="bar-path" x="346" y="622" width="70" height="24" rx="3"/>
  <text class="label" x="381" y="638.5">data</text>
  <rect class="strong" x="430" y="622" width="14" height="24" rx="3"/>
  <rect class="bar-peer" x="446" y="622" width="90" height="24" rx="3"/>
  <text class="label" x="491" y="638.5">manifest</text>
  <rect class="strong" x="550" y="622" width="14" height="24" rx="3"/>
  <rect class="node" x="566" y="622" width="80" height="24" rx="3"/>
  <text class="label" x="606" y="638.5">control</text>
  <rect class="strong" x="660" y="622" width="14" height="24" rx="3"/>
  <rect class="bar-path" x="676" y="622" width="70" height="24" rx="3"/>
  <text class="label" x="711" y="638.5">data</text>
  <rect class="strong" x="760" y="622" width="14" height="24" rx="3"/>
  <rect class="bar-peer" x="776" y="622" width="90" height="24" rx="3"/>
  <text class="label" x="821" y="638.5">manifest</text>
  <rect class="strong" x="880" y="622" width="14" height="24" rx="3"/>
  <rect class="bar-peer" x="896" y="622" width="110" height="24" rx="3"/>
  <text class="label" x="951" y="638.5">manifest End</text>
  <rect class="strong" x="110" y="662" width="14" height="24" rx="3"/>
  <rect class="bar-hot" x="126" y="662" width="90" height="24" rx="3"/>
  <text class="label" x="171" y="678.5">answers</text>
  <rect class="strong" x="230" y="662" width="14" height="24" rx="3"/>
  <rect class="node" x="246" y="662" width="120" height="24" rx="3"/>
  <text class="label" x="306" y="678.5">Window: manifest</text>
  <rect class="strong" x="380" y="662" width="14" height="24" rx="3"/>
  <rect class="bar-hot" x="396" y="662" width="90" height="24" rx="3"/>
  <text class="label" x="441" y="678.5">answers</text>
  <rect class="strong" x="500" y="662" width="14" height="24" rx="3"/>
  <rect class="node" x="516" y="662" width="110" height="24" rx="3"/>
  <text class="label" x="571" y="678.5">Window: data</text>
  <rect class="strong" x="640" y="662" width="14" height="24" rx="3"/>
  <rect class="bar-hot" x="656" y="662" width="90" height="24" rx="3"/>
  <text class="label" x="701" y="678.5">answers</text>
  <rect class="strong" x="760" y="662" width="14" height="24" rx="3"/>
  <rect class="node" x="776" y="662" width="80" height="24" rx="3"/>
  <text class="label" x="816" y="678.5">control</text>
  <text class="small start" x="40" y="712">Windows and Synced come back from the reader's transport, the other way; control, Window and Synced go first.</text>
  </g>
</svg>
