<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title description">
  <title id="title">Every operation reaches every side</title>
  <desc id="description">Three ways a transfer is stopped. A first Ctrl-C, a SIGTERM or the terminal closing: the client sends stop on the connection it follows each launcher by; the launcher sends SIGTERM to what it started, gathers how each ended, and tells the client, which waits the grace at most and then says what came of each side. A second Ctrl-C: the client ends at once; the host reads the connection ending, not silence, and cleans up at once. The client killed with SIGKILL: its ssh ends the channels as their input ends, or the heartbeat stops; the host cleans up within 20 s.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      :root {
        --text: #172033; --muted-text: #526078; --surface: #f7f9fc; --surface-strong: #e9eef8;
        --border: #8491a8; --group: #b4bdcc; --client-surface: #e4f6ec; --client-border: #27875b;
        --server-surface: #e5efff; --server-border: #3478c8; --warn-surface: #fdf0e1; --warn-border: #c47a1d;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #eef3fb; --muted-text: #b5c0d3; --surface: #202938; --surface-strong: #2b3850;
          --border: #8390a6; --group: #5a667a; --client-surface: #173d30; --client-border: #5bc792;
          --server-surface: #193a62; --server-border: #72aef2; --warn-surface: #4a3417; --warn-border: #e0a456;
        }
      }
      text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 15px; text-anchor: middle; }
      .secondary { fill: var(--muted-text); font-size: 12.5px; }
      .group-label { fill: var(--muted-text); font-size: 13px; font-weight: 600; letter-spacing: .08em; }
      .edge-label { fill: var(--muted-text); font-size: 12px; }
      .start { text-anchor: start; }
      .group { fill: none; stroke: var(--group); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .node { fill: var(--surface); stroke: var(--border); stroke-width: 2; }
      .client { fill: var(--client-surface); stroke: var(--client-border); stroke-width: 2; }
      .server { fill: var(--server-surface); stroke: var(--server-border); stroke-width: 2; }
      .warn { fill: var(--warn-surface); stroke: var(--warn-border); stroke-width: 2; }
      .strong { fill: var(--surface-strong); stroke: var(--border); stroke-width: 1.5; }
      .tree { fill: none; stroke: var(--border); stroke-width: 1.8; }
      .edge { fill: none; stroke: var(--border); stroke-width: 2.2; marker-end: url(#arrow); }
      .both { marker-start: url(#arrow); }
      .beat { stroke: var(--server-border); stroke-dasharray: 8 5; }
      .arrow-head { fill: var(--border); }
    </style>
  </defs>

  <text class="group-label" x="150" y="40">THE USER</text>
  <text class="group-label" x="470" y="40">THE CLIENT</text>
  <text class="group-label" x="860" y="40">EACH HOST</text>
  <rect class="node" x="30" y="60" width="240" height="80" rx="10"/>
  <text x="150.0" y="96.0">first Ctrl-C, SIGTERM,</text>
  <text x="150.0" y="114.0">the terminal closed</text>
  <rect class="client" x="330" y="60" width="280" height="80" rx="10"/>
  <text x="470.0" y="96.0">sends stop on the follow</text>
  <text x="470.0" y="114.0">connection; waits the grace</text>
  <rect class="server" x="680" y="60" width="390" height="80" rx="10"/>
  <text x="875.0" y="96.0">launcher: SIGTERM, gathers</text>
  <text x="875.0" y="114.0">how each ended, tells the client</text>
  <path class="edge" d="M 272 100 H 328"/>
  <path class="edge" d="M 612 86 H 678"/>
  <path class="edge" d="M 678 116 H 612"/>
  <rect class="node" x="30" y="170" width="240" height="80" rx="10"/>
  <text x="150.0" y="215.0">second Ctrl-C</text>
  <rect class="warn" x="330" y="170" width="280" height="80" rx="10"/>
  <text x="470.0" y="215.0">ends at once</text>
  <rect class="warn" x="680" y="170" width="390" height="80" rx="10"/>
  <text x="875.0" y="206.0">reads the connection ending:</text>
  <text x="875.0" y="224.0">cleans up at once</text>
  <path class="edge" d="M 272 210 H 328"/>
  <path class="edge beat" d="M 612 210 H 678"/>
  <rect class="node" x="30" y="280" width="240" height="80" rx="10"/>
  <text x="150.0" y="316.0">kill -9</text>
  <text x="150.0" y="334.0">(cannot be caught)</text>
  <rect class="warn" x="330" y="280" width="280" height="80" rx="10"/>
  <text x="470.0" y="325.0">gone</text>
  <rect class="warn" x="680" y="280" width="390" height="80" rx="10"/>
  <text x="875.0" y="316.0">heartbeat stops, or channels</text>
  <text x="875.0" y="334.0">end: cleans up within 20 s</text>
  <path class="edge" d="M 272 320 H 328"/>
  <path class="edge beat" d="M 612 320 H 678"/>
  <text class="edge-label" x="645" y="78">stop</text>
  <text class="edge-label" x="645" y="132">outcomes</text>
  <text class="edge-label" x="645" y="198">EOF</text>
  <text class="edge-label" x="645" y="292">EOF, or</text>
  <text class="edge-label" x="645" y="308">silence</text>
  <text class="secondary" x="550" y="410">While the connection lives, an operation goes across and its outcome comes back; once it is lost, each side cleans up on its own.</text>
</svg>
