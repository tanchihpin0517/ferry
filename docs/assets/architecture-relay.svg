<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title description">
  <title id="title">Remote to remote through the client</title>
  <desc id="description">Three machines. Host A's ferry server, started over SSH, holds the Source peer, which reads a. Host B's ferry server, likewise, holds the Destination peer, which writes b. The ferry client on the local machine, run as ferry copy hostA:a hostB:b, holds a relay that is connected to both hosts over SSH and forwards packets between them without decoding the data, which flows from host A through the local machine to host B.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      :root {
        --text: #172033;
        --muted-text: #526078;
        --surface: #f7f9fc;
        --surface-strong: #e9eef8;
        --border: #8491a8;
        --group: #b4bdcc;
        --client-surface: #e4f6ec;
        --client-border: #27875b;
        --server-surface: #e5efff;
        --server-border: #3478c8;
        --badge: #172033;
        --badge-text: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #eef3fb;
          --muted-text: #b5c0d3;
          --surface: #202938;
          --surface-strong: #2b3850;
          --border: #8390a6;
          --group: #5a667a;
          --client-surface: #173d30;
          --client-border: #5bc792;
          --server-surface: #193a62;
          --server-border: #72aef2;
          --badge: #eef3fb;
          --badge-text: #172033;
        }
      }
      text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; text-anchor: middle; }
      .secondary { fill: var(--muted-text); font-size: 13px; }
      .group-label { fill: var(--muted-text); font-size: 13px; font-weight: 600; letter-spacing: .08em; }
      .edge-label { fill: var(--muted-text); font-size: 12px; }
      .start-label { text-anchor: start; }
      .group { fill: none; stroke: var(--group); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .node { fill: var(--surface); stroke: var(--border); stroke-width: 2; }
      .server-node { fill: var(--server-surface); stroke: var(--server-border); stroke-width: 2; }
      .runtime-node { fill: var(--surface-strong); stroke: var(--server-border); stroke-width: 2.5; }
      .client-node { fill: var(--client-surface); stroke: var(--client-border); stroke-width: 2; }
      .edge { fill: none; stroke: var(--border); stroke-width: 2.5; marker-end: url(#arrow); }
      .both { marker-start: url(#arrow); }
      .wire { stroke: var(--server-border); }
      .control { stroke-dasharray: 7 5; }
      .arrow-head { fill: var(--border); }
      .badge { fill: var(--badge); }
      .badge-text { fill: var(--badge-text); font-size: 12px; font-weight: 700; }
    </style>
  </defs>

  <!-- Machines. -->
  <rect class="group" x="20" y="30" width="260" height="300" rx="14"/>
  <text class="group-label" x="150" y="58">HOST A</text>
  <rect class="group" x="400" y="30" width="300" height="300" rx="14"/>
  <text class="group-label" x="550" y="58">LOCAL MACHINE</text>
  <rect class="group" x="820" y="30" width="260" height="300" rx="14"/>
  <text class="group-label" x="950" y="58">HOST B</text>

  <!-- Host A. -->
  <rect class="server-node" x="45" y="90" width="210" height="200" rx="12"/>
  <text x="150" y="120">ferry server</text>
  <rect class="runtime-node" x="60" y="175" width="180" height="72" rx="10"/>
  <text x="150" y="205">Source peer</text>
  <text class="secondary" x="150" y="227">reads a</text>

  <!-- Local machine. -->
  <rect class="client-node" x="430" y="90" width="240" height="200" rx="12"/>
  <text x="550" y="120">ferry client</text>
  <text class="secondary" x="550" y="140">ferry copy hostA:a hostB:b</text>
  <rect class="runtime-node" x="470" y="175" width="160" height="72" rx="10"/>
  <text x="550" y="205">Relay</text>
  <text class="secondary" x="550" y="227">forwards packets</text>

  <!-- Host B. -->
  <rect class="server-node" x="845" y="90" width="210" height="200" rx="12"/>
  <text x="950" y="120">ferry server</text>
  <rect class="runtime-node" x="860" y="175" width="180" height="72" rx="10"/>
  <text x="950" y="205">Destination peer</text>
  <text class="secondary" x="950" y="227">writes b</text>

  <!-- Wires. -->
  <path class="edge both wire" d="M 257 211 H 428"/>
  <text class="edge-label" x="342" y="200">SSH</text>
  <text class="edge-label" x="342" y="232">data →</text>
  <path class="edge both wire" d="M 672 211 H 843"/>
  <text class="edge-label" x="757" y="200">SSH</text>
  <text class="edge-label" x="757" y="232">data →</text>
</svg>
