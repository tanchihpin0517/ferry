<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title description">
  <title id="title">Layers: program, pipe, transport, connection</title>
  <desc id="description">Layers: the writer and the reader each have four. The program, a peer, the client or a monitor, writes what it has, waits when it cannot write more, and does not know how much one write can take; the reader reads what came and cuts out the records itself. Pipe: one set for each kind of connection, with fixed purposes and numbers, one way, in order, reliable, complete only once End is read. Transport: the send buffer, compression, the pump's scheduling and cutting into frames, keeping to the window; the receiving thread only sorts frames to their pipes, then decompresses, and gives back as much window as is read. The connection, that is, the wire: raw bytes while preparing, frames once ready, over an SSH channel, a socket pair or a pipe. The bytes of preparing do not take this path; nothing is compressed on this machine, and across the network every pipe is.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <marker id="arrow-path" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-path"/>
    </marker>
    <marker id="arrow-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-client"/>
    </marker>
    <marker id="arrow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-hot"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-fail"/>
    </marker>
    <marker id="arrow-peer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-peer"/>
    </marker>
    <style>
      :root {
        --text: #172033;
