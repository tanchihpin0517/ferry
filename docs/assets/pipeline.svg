<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1150" viewBox="0 0 1000 1150" role="img" aria-labelledby="title description">
  <title id="title">Pipeline: prepare, then transfer</title>
  <desc id="description">A run has two phases. Phase 1, prepare, by the client, one step after another: read the arguments and check the locations; the transport opens every SSH connection, logging each in, with no task of its own; over control connections, each to a program on the host, probe each host and install Ferry where it is missing, asking before a first install, then run the servers and shake hands; and open the connections, whose paths join the servers. Everything that asks you is asked here, nothing is changed on either side, and none of it overlaps the transfer. Once every peer is ready, phase 2, transfer, runs between two peers, each in a server, through the client, which relays every packet and shows what the peers report. 1: the Source scans its directories, one thread listing them and 8 statting their entries, and streams the manifest to the Destination, one directory at a time, in a fixed depth-first order. 2: the Destination compares, scanning its own tree alongside the manifest in the same way and merging the two, and streams back the files it needs. 3: the Source reads the needed files and hashes them with BLAKE3, in parallel. 4: it serialises them into records of header, content and hash, and compresses the stream in frames of 2 MiB, in parallel, at zstd level 1, sent in data packets. 5: the Destination decompresses frames in parallel, puts them back in order, and parses the records on one thread. 6: it writes files in parallel: temporary file, hash verification, metadata, batched fsync, rename, and reports each file in results packets. 7: the Source resends failed files in a final pass, back through reading. 8: the Destination finishes with directory mtimes, --delete, and the summary. Control packets run both ways, in order with the rest. Numbers match the sections of the pipeline document.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      :root {
        --text: #172033;
        --muted-text: #526078;
        --surface: #f7f9fc;
        --surface-strong: #e9eef8;
        --border: #8491a8;
        --group: #b4bdcc;
        --client-surface: #e4f6ec;
        --client-border: #27875b;
        --server-surface: #e5efff;
        --server-border: #3478c8;
        --badge: #172033;
        --badge-text: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #eef3fb;
          --muted-text: #b5c0d3;
          --surface: #202938;
          --surface-strong: #2b3850;
          --border: #8390a6;
          --group: #5a667a;
          --client-surface: #173d30;
          --client-border: #5bc792;
          --server-surface: #193a62;
          --server-border: #72aef2;
          --badge: #eef3fb;
          --badge-text: #172033;
        }
      }
      text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; text-anchor: middle; }
      .secondary { fill: var(--muted-text); font-size: 13px; }
      .group-label { fill: var(--muted-text); font-size: 13px; font-weight: 600; letter-spacing: .08em; }
      .edge-label { fill: var(--muted-text); font-size: 12px; }
      .start-label { text-anchor: start; }
      .edge.plain { marker-end: none; }
      .phase { fill: none; stroke: var(--group); stroke-width: 2; }
      .phase-label { fill: var(--text); font-size: 14px; font-weight: 700; letter-spacing: .1em; }
      .group { fill: none; stroke: var(--group); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .node { fill: var(--surface); stroke: var(--border); stroke-width: 2; }
      .server-node { fill: var(--server-surface); stroke: var(--server-border); stroke-width: 2; }
      .runtime-node { fill: var(--surface-strong); stroke: var(--server-border); stroke-width: 2.5; }
      .client-node { fill: var(--client-surface); stroke: var(--client-border); stroke-width: 2; }
      .edge { fill: none; stroke: var(--border); stroke-width: 2.5; marker-end: url(#arrow); }
      .both { marker-start: url(#arrow); }
      .wire { stroke: var(--server-border); }
      .control { stroke-dasharray: 7 5; }
      .arrow-head { fill: var(--border); }
      .badge { fill: var(--badge); }
      .badge-text { fill: var(--badge-text); font-size: 12px; font-weight: 700; }
    </style>
  </defs>

  <!-- Phase 1: prepare. -->
  <rect class="phase" x="10" y="10" width="980" height="200" rx="18"/>
  <text class="phase-label" x="500" y="40">PHASE 1 · PREPARE, BY THE CLIENT</text>
  <rect class="client-node" x="26" y="62" width="172" height="64" rx="10"/>
  <text x="112" y="89">Read arguments</text>
  <text class="secondary" x="112" y="109">and check locations</text>
  <path class="edge" d="M 198 94 H 218"/>
  <rect class="client-node" x="220" y="62" width="172" height="64" rx="10"/>
  <text x="306" y="89">SSH connections</text>
  <text class="secondary" x="306" y="109">logins only, no task</text>
  <path class="edge" d="M 392 94 H 412"/>
  <rect class="client-node" x="414" y="62" width="172" height="64" rx="10"/>
  <text x="500" y="89">Probe + install</text>
  <text class="secondary" x="500" y="109">asks before first install</text>
  <path class="edge" d="M 586 94 H 606"/>
  <rect class="client-node" x="608" y="62" width="172" height="64" rx="10"/>
  <text x="694" y="89">Start servers</text>
  <text class="secondary" x="694" y="109">and shake hands</text>
  <path class="edge" d="M 780 94 H 800"/>
  <rect class="client-node" x="802" y="62" width="172" height="64" rx="10"/>
  <text x="888" y="89">Open connections</text>
  <text class="secondary" x="888" y="109">paths join servers</text>
  <path class="edge plain" d="M 226 134 V 140 H 386 V 134"/>
  <text class="edge-label" x="306" y="156">by the transport</text>
  <path class="edge plain" d="M 420 134 V 140 H 774 V 134"/>
  <text class="edge-label" x="597" y="156">over control connections</text>
  <path class="edge plain" d="M 808 134 V 140 H 968 V 134"/>
  <text class="edge-label" x="888" y="156">over the paths</text>
  <text class="secondary" x="500" y="182">Everything that asks you is asked here. Nothing is changed on either side.</text>
  <text class="secondary" x="500" y="200">None of it overlaps the transfer.</text>

  <!-- Ready. -->
  <path class="edge" d="M 500 210 V 248"/>
  <text class="edge-label start-label" x="512" y="234">every peer ready</text>

  <!-- Phase 2: transfer. -->
  <rect class="phase" x="10" y="250" width="980" height="880" rx="18"/>
  <text class="phase-label" x="500" y="280">PHASE 2 · TRANSFER</text>
  <g transform="translate(0 270)">
    <!-- Peers. -->
    <rect class="group" x="20" y="30" width="330" height="800" rx="14"/>
    <text class="group-label" x="185" y="62">SOURCE PEER, IN A SERVER</text>
    <rect class="group" x="650" y="30" width="330" height="800" rx="14"/>
    <text class="group-label" x="815" y="62">DESTINATION PEER, IN A SERVER</text>

    <!-- The client, between the peers. -->
    <rect class="group" x="385" y="30" width="230" height="800" rx="14"/>
    <text class="group-label" x="500" y="58">CLIENT</text>
    <text class="secondary" x="500" y="78">relays, shows reports</text>

    <!-- Source stages. -->
    <rect class="server-node" x="50" y="100" width="270" height="56" rx="10"/>
    <text x="185" y="125">Scan directories</text>
    <text class="secondary" x="185" y="144">one lists, 8 stat, fixed order</text>

    <rect class="server-node" x="50" y="250" width="270" height="56" rx="10"/>
    <text x="185" y="275">Read + BLAKE3</text>
    <text class="secondary" x="185" y="294">parallel, needed files only</text>

    <rect class="server-node" x="50" y="340" width="270" height="56" rx="10"/>
    <text x="185" y="365">Serialise records</text>
    <text class="secondary" x="185" y="384">header, content, hash</text>

    <rect class="server-node" x="50" y="430" width="270" height="56" rx="10"/>
    <text x="185" y="455">Compress frames</text>
    <text class="secondary" x="185" y="474">2 MiB each, level 1, parallel</text>

    <rect class="server-node" x="50" y="627" width="270" height="56" rx="10"/>
    <text x="185" y="652">Resend failed files</text>
    <text class="secondary" x="185" y="671">final pass</text>

    <!-- Destination stages. -->
    <rect class="runtime-node" x="680" y="100" width="270" height="56" rx="10"/>
    <text x="815" y="125">Compare</text>
    <text class="secondary" x="815" y="144">scans its own tree alongside</text>

    <rect class="runtime-node" x="680" y="430" width="270" height="56" rx="10"/>
    <text x="815" y="455">Decompress frames</text>
    <text class="secondary" x="815" y="474">parallel, put back in order</text>

    <rect class="runtime-node" x="680" y="520" width="270" height="56" rx="10"/>
    <text x="815" y="545">Parse records</text>
    <text class="secondary" x="815" y="564">one thread</text>

    <rect class="runtime-node" x="680" y="610" width="270" height="90" rx="10"/>
    <text x="815" y="636">Write files</text>
    <text class="secondary" x="815" y="658">parallel: temporary file, verify hash,</text>
    <text class="secondary" x="815" y="677">metadata, batched fsync, rename</text>

    <rect class="runtime-node" x="680" y="740" width="270" height="56" rx="10"/>
    <text x="815" y="765">Finish</text>
    <text class="secondary" x="815" y="784">directory mtimes, --delete, summary</text>

    <!-- Inside each peer. -->
    <path class="edge" d="M 185 306 V 338"/>
    <path class="edge" d="M 185 396 V 428"/>
    <path class="edge" d="M 50 655 H 36 V 278 H 48"/>
    <path class="edge" d="M 815 486 V 518"/>
    <path class="edge" d="M 815 576 V 608"/>
    <path class="edge" d="M 815 700 V 738"/>

    <!-- Packets between the peers. -->
    <path class="edge wire" d="M 320 118 H 678"/>
    <text class="edge-label" x="500" y="108">manifest</text>
    <path class="edge wire" d="M 680 146 H 500 V 278 H 322"/>
    <text class="edge-label start-label" x="510" y="221">needs</text>
    <path class="edge wire" d="M 320 458 H 678"/>
    <text class="edge-label" x="500" y="448">data</text>
    <text class="edge-label" x="500" y="478">compressed frames</text>
    <path class="edge both wire control" d="M 362 560 H 638"/>
    <text class="edge-label" x="500" y="550">control: both ways,</text>
    <text class="edge-label" x="500" y="580">in order with the rest</text>
    <path class="edge wire" d="M 680 655 H 322"/>
    <text class="edge-label" x="500" y="645">results</text>

    <!-- Section numbers. -->
    <circle class="badge" cx="50" cy="100" r="12"/><text class="badge-text" x="50" y="104">1</text>
    <circle class="badge" cx="680" cy="100" r="12"/><text class="badge-text" x="680" y="104">2</text>
    <circle class="badge" cx="50" cy="250" r="12"/><text class="badge-text" x="50" y="254">3</text>
    <circle class="badge" cx="50" cy="340" r="12"/><text class="badge-text" x="50" y="344">4</text>
    <circle class="badge" cx="680" cy="430" r="12"/><text class="badge-text" x="680" y="434">5</text>
    <circle class="badge" cx="680" cy="610" r="12"/><text class="badge-text" x="680" y="614">6</text>
    <circle class="badge" cx="50" cy="627" r="12"/><text class="badge-text" x="50" y="631">7</text>
    <circle class="badge" cx="680" cy="740" r="12"/><text class="badge-text" x="680" y="744">8</text>
  </g>
</svg>
