<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="366" viewBox="0 0 1100 366" role="img" aria-labelledby="title description">
  <title id="title">Flow of a stream</title>
  <desc id="description">Stream (over pipes): between the two servers, made by the client. Written in first: 01 or secret (host), [number][compression]; written in first: 01 or secret (host), [number][compression]; handed over: on this machine by a handover, on a host joined to ssh -W; handed over: the same as on the left; start mark: written by the Destination's end; start mark: written by the Source's end. Ready: manifest, data (S → D), answers (D → S), control (both ways). For a server on a host, the listener reads 01 and answers with the start mark; where the other end is on this machine, that server writes nothing first, and the client writes it for it. A server is ready once it has read [number][compression] and skipped to the start mark from the far end. Done once for each of K streams, numbered 0 to K−1.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <marker id="arrow-path" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-path"/>
    </marker>
    <marker id="arrow-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-client"/>
    </marker>
    <marker id="arrow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-hot"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-fail"/>
    </marker>
    <marker id="arrow-peer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-peer"/>
    </marker>
    <style>
      :root {
        --text: #172033;
        --muted: #526078;
        --surface: #f7f9fc;
        --surface-strong: #e9eef8;
        --border: #8491a8;
        --group: #b4bdcc;
        --peer: #e5efff;
        --peer-border: #3478c8;
        --client: #f1ecfb;
        --client-border: #7b56c4;
        --path: #27875b;
        --path-surface: #e3f3ea;
        --hot: #b7791f;
        --hot-surface: #fdf2dc;
        --fail: #c2412d;
        --fail-surface: #fdecea;
        --badge: #172033;
        --badge-text: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #eef3fb;
          --muted: #b5c0d3;
          --surface: #202938;
          --surface-strong: #2b3850;
          --border: #8390a6;
          --group: #5a667a;
          --peer: #193a62;
          --peer-border: #6aa8f0;
          --client: #2e2547;
          --client-border: #b39af0;
          --path: #5bc792;
          --path-surface: #16382a;
          --hot: #f0b44c;
          --hot-surface: #41321a;
          --fail: #ff8a70;
          --fail-surface: #4a2420;
          --badge: #eef3fb;
          --badge-text: #172033;
        }
      }
      text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans CJK TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; font-size: 15px; text-anchor: middle; }
      .title { font-weight: 700; }
      .h { font-weight: 700; font-size: 17px; }
      .small { fill: var(--muted); font-size: 13px; }
      .label { fill: var(--muted); font-size: 12.5px; }
      .group-label { fill: var(--muted); font-size: 13.5px; font-weight: 700; letter-spacing: .05em; }
      .start { text-anchor: start; }
      .end { text-anchor: end; }
      .group { fill: none; stroke: var(--group); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .panel { fill: none; stroke: var(--group); stroke-width: 1.5; }
      .node { fill: var(--surface); stroke: var(--border); stroke-width: 1.8; }
      .strong { fill: var(--surface-strong); stroke: var(--border); stroke-width: 1.8; }
      .peer { fill: var(--peer); stroke: var(--peer-border); stroke-width: 2; }
      .client { fill: var(--client); stroke: var(--client-border); stroke-width: 2; }
      .hot { fill: var(--hot-surface); stroke: var(--hot); stroke-width: 2.2; }
      .failbox { fill: var(--fail-surface); stroke: var(--fail); stroke-width: 2.2; }
      .pathbox { fill: var(--path-surface); stroke: var(--path); stroke-width: 2; }
      .ghost { fill: none; stroke: var(--border); stroke-width: 1.5; stroke-dasharray: 4 4; }
      .bar { fill: var(--surface-strong); stroke: var(--border); stroke-width: 1.2; }
      .bar-peer { fill: var(--peer); stroke: var(--peer-border); stroke-width: 1.2; }
      .bar-hot { fill: var(--hot-surface); stroke: var(--hot); stroke-width: 1.5; }
      .bar-fail { fill: var(--fail-surface); stroke: var(--fail); stroke-width: 1.5; }
      .bar-path { fill: var(--path-surface); stroke: var(--path); stroke-width: 1.5; }
      .bar-idle { fill: none; stroke: var(--group); stroke-width: 1.2; stroke-dasharray: 3 3; }
      .edge { fill: none; stroke: var(--border); stroke-width: 2.2; marker-end: url(#arrow); }
      .edge-plain { fill: none; stroke: var(--border); stroke-width: 2; }
      .edge-dash { fill: none; stroke: var(--border); stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .path-edge { fill: none; stroke: var(--path); stroke-width: 2.6; marker-end: url(#arrow-path); }
      .path-line { fill: none; stroke: var(--path); stroke-width: 2.6; }
      .path-dash { fill: none; stroke: var(--path); stroke-width: 2.2; stroke-dasharray: 7 5; marker-end: url(#arrow-path); }
      .client-edge { fill: none; stroke: var(--client-border); stroke-width: 2.2; marker-end: url(#arrow-client); }
      .client-dash { fill: none; stroke: var(--client-border); stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow-client); }
      .hot-edge { fill: none; stroke: var(--hot); stroke-width: 2.4; marker-end: url(#arrow-hot); }
      .hot-dash { fill: none; stroke: var(--hot); stroke-width: 2.2; stroke-dasharray: 6 5; marker-end: url(#arrow-hot); }
      .fail-edge { fill: none; stroke: var(--fail); stroke-width: 2.4; marker-end: url(#arrow-fail); }
      .fail-line { fill: none; stroke: var(--fail); stroke-width: 3; }
      .peer-edge { fill: none; stroke: var(--peer-border); stroke-width: 2.4; marker-end: url(#arrow-peer); }
      .arrow-head { fill: var(--border); }
      .arrow-path { fill: var(--path); }
      .arrow-client { fill: var(--client-border); }
      .arrow-hot { fill: var(--hot); }
      .arrow-fail { fill: var(--fail); }
      .arrow-peer { fill: var(--peer-border); }
      .path-text { fill: var(--path); font-weight: 700; }
      .client-text { fill: var(--client-border); font-weight: 700; }
      .hot-text { fill: var(--hot); font-weight: 700; }
      .fail-text { fill: var(--fail); font-weight: 700; }
      .peer-text { fill: var(--peer-border); font-weight: 700; }
      .badge { fill: var(--badge); }
      .badge-text { fill: var(--badge-text); font-size: 12px; font-weight: 700; }
      .hot-badge { fill: var(--hot); }
      .dot { fill: var(--border); }
    </style>
  </defs>
  <defs>
    <marker id="arrow-left" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="0">
      <path d="M 10 0 L 0 5 L 10 10 z" class="arrow-head"/>
    </marker>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="90">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <marker id="arrow-up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="270">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <marker id="path-left" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="0">
      <path d="M 10 0 L 0 5 L 10 10 z" class="arrow-path"/>
    </marker>
    <marker id="path-right" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="0">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-path"/>
    </marker>
    <marker id="fail-down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="90">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-fail"/>
    </marker>
    <marker id="fail-right" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="0">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-fail"/>
    </marker>
  </defs>
  <text class="group-label start" x="20" y="26">stream (over pipes): between the two servers, made by the client</text>
  <rect class="peer" x="65" y="40" width="170" height="46" rx="6"/>
  <text class="title" x="150" y="69">Source server</text>
  <rect class="client" x="465" y="40" width="170" height="46" rx="6"/>
  <text class="title" x="550" y="60">client</text>
  <text class="label" x="550" y="78">makes a socket pair</text>
  <rect class="peer" x="865" y="40" width="170" height="46" rx="6"/>
  <text class="title" x="950" y="69">Destination server</text>
  <path class="bar-idle" d="M 150 86 V 258"/>
  <path class="bar-idle" d="M 550 86 V 258"/>
  <path class="bar-idle" d="M 950 86 V 258"/>
  <path class="edge-plain" marker-end="url(#arrow-left)" d="M 550 120 H 154"/>
  <text class="small" x="350" y="112">written first: 01 or secret (host), [number][compression]</text>
  <path class="edge" d="M 550 120 H 946"/>
  <text class="small" x="750" y="112">written first: 01 or secret (host), [number][compression]</text>
  <path class="edge-plain" stroke-dasharray="6 5" marker-end="url(#arrow-left)" d="M 550 160 H 154"/>
  <text class="small" x="350" y="152">hand over: locally by handover; on a host, to ssh -W</text>
  <path class="edge-plain" stroke-dasharray="6 5" marker-end="url(#arrow)" d="M 550 160 H 946"/>
  <text class="small" x="750" y="152">hand over: as on the left</text>
  <path class="path-line" stroke-width="2.2" marker-end="url(#path-left)" d="M 950 200 H 154"/>
  <text class="small" x="550" y="192">start mark: written by the Destination's end</text>
  <path class="path-line" stroke-width="2.2" marker-end="url(#path-right)" d="M 150 240 H 946"/>
  <text class="small" x="550" y="232">start mark: written by the Source's end</text>
  <rect class="pathbox" x="65" y="264" width="970" height="34" rx="6"/>
  <text class="small path-text" x="550" y="286">ready: manifest, data (S → D), answers (D → S), control (both ways)</text>
  <text class="small start" x="20" y="322">On a host, the listener reads 01 and answers with the start mark; with the other end on this machine, that server writes nothing first: the client writes it.</text>
  <text class="small start" x="20" y="344">A server is ready once it has read [number][compression] and skipped to the start mark from the far end. Done once for each of K streams, numbered 0 to K−1.</text>
</svg>
