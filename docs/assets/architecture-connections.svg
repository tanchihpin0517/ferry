<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-labelledby="title description">
  <title id="title">SSH connections to a host</title>
  <desc id="description">The ferry client runs, for one host, one ssh master per SSH connection, and each master holds its own TCP connection. Master 1 is your own ControlMaster if your SSH configuration has one, and Ferry's otherwise; masters 2 and 3, from --ssh-connections 3, are Ferry's own, with control paths ending in -1 and -2. Master 1 carries the control connections, each a byte stream to one program on the host, in turn: a probe, an install, and the ferry server, which shakes hands over its control connection and ends when it closes; and path 1. Masters 2 and 3 carry paths 2 and 3. Every path runs ferry server --join, which hands its connection to the server through a private Unix socket. In order: first, the transport opens every SSH connection, holding an ssh -N for each master: logins only, one at a time, with no task. Second, control connections probe, install, and run the server. Third, every path joins it. Every path is equal; control connections are plain, and ride on whichever SSH connection the transport chooses.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      :root {
        --text: #172033;
        --muted-text: #526078;
        --surface: #f7f9fc;
        --surface-strong: #e9eef8;
        --border: #8491a8;
        --group: #b4bdcc;
        --client-surface: #e4f6ec;
        --client-border: #27875b;
        --server-surface: #e5efff;
        --server-border: #3478c8;
        --badge: #172033;
        --badge-text: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #eef3fb;
          --muted-text: #b5c0d3;
          --surface: #202938;
          --surface-strong: #2b3850;
          --border: #8390a6;
          --group: #5a667a;
          --client-surface: #173d30;
          --client-border: #5bc792;
          --server-surface: #193a62;
          --server-border: #72aef2;
          --badge: #eef3fb;
          --badge-text: #172033;
        }
      }
      text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; text-anchor: middle; }
      .secondary { fill: var(--muted-text); font-size: 13px; }
      .group-label { fill: var(--muted-text); font-size: 13px; font-weight: 600; letter-spacing: .08em; }
      .edge-label { fill: var(--muted-text); font-size: 12px; }
      .start-label { text-anchor: start; }
      .edge.plain { marker-end: none; }
      .phase { fill: none; stroke: var(--group); stroke-width: 2; }
      .phase-label { fill: var(--text); font-size: 14px; font-weight: 700; letter-spacing: .1em; }
      .group { fill: none; stroke: var(--group); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .node { fill: var(--surface); stroke: var(--border); stroke-width: 2; }
      .server-node { fill: var(--server-surface); stroke: var(--server-border); stroke-width: 2; }
      .runtime-node { fill: var(--surface-strong); stroke: var(--server-border); stroke-width: 2.5; }
      .client-node { fill: var(--client-surface); stroke: var(--client-border); stroke-width: 2; }
      .edge { fill: none; stroke: var(--border); stroke-width: 2.5; marker-end: url(#arrow); }
      .both { marker-start: url(#arrow); }
      .wire { stroke: var(--server-border); }
      .control { stroke-dasharray: 7 5; }
      .arrow-head { fill: var(--border); }
      .badge { fill: var(--badge); }
      .badge-text { fill: var(--badge-text); font-size: 12px; font-weight: 700; }
    </style>
  </defs>

  <!-- Machines. -->
  <rect class="group" x="20" y="30" width="360" height="450" rx="14"/>
  <text class="group-label" x="200" y="58">LOCAL MACHINE</text>
  <rect class="group" x="720" y="30" width="360" height="450" rx="14"/>
  <text class="group-label" x="900" y="58">HOST</text>
  <rect class="client-node" x="40" y="90" width="120" height="370" rx="12"/>
  <text x="100" y="265">ferry</text>
  <text x="100" y="287">client</text>
  <rect class="server-node" x="925" y="90" width="140" height="370" rx="12"/>
  <text x="995" y="124">ferry server</text>
  <text class="secondary" x="995" y="146">lives as long as</text>
  <text class="secondary" x="995" y="162">its control</text>
  <text class="secondary" x="995" y="178">connection</text>
  <rect class="runtime-node" x="937" y="250" width="116" height="72" rx="10"/>
  <text x="995" y="281">peer</text>
  <text class="secondary" x="995" y="303">Source or Dest.</text>
  <rect class="node" x="200" y="100" width="160" height="100" rx="10"/>
  <text x="280" y="145">ssh master 1</text>
  <text class="secondary" x="280" y="165">yours, or Ferry's %C</text>
  <path class="edge" d="M 160 150 H 198"/>
  <circle class="badge" cx="200" cy="100" r="12"/>
  <text class="badge-text" x="200" y="104">1</text>
  <rect class="node" x="200" y="273" width="160" height="64" rx="10"/>
  <text x="280" y="300">ssh master 2</text>
  <text class="secondary" x="280" y="320">Ferry's, %C-1</text>
  <path class="edge" d="M 160 305 H 198"/>
  <circle class="badge" cx="200" cy="273" r="12"/>
  <text class="badge-text" x="200" y="277">1</text>
  <rect class="node" x="200" y="378" width="160" height="64" rx="10"/>
  <text x="280" y="405">ssh master 3</text>
  <text class="secondary" x="280" y="425">Ferry's, %C-2</text>
  <path class="edge" d="M 160 410 H 198"/>
  <circle class="badge" cx="200" cy="378" r="12"/>
  <text class="badge-text" x="200" y="382">1</text>
  <path class="edge both" d="M 362 118 H 923"/>
  <text class="edge-label" x="550" y="108">control connections: probe, install, the server</text>
  <circle class="badge" cx="382" cy="118" r="12"/>
  <text class="badge-text" x="382" y="122">2</text>
  <path class="edge both wire" d="M 362 182 H 738"/>
  <text class="edge-label" x="550" y="172">path 1 · pieces of messages</text>
  <rect class="node" x="740" y="152" width="130" height="60" rx="10"/>
  <text x="805" y="178">ferry server</text>
  <text class="secondary" x="805" y="197">--join</text>
  <path class="edge control" d="M 870 182 H 923"/>
  <circle class="badge" cx="740" cy="152" r="12"/>
  <text class="badge-text" x="740" y="156">3</text>
  <text class="edge-label" x="897" y="158">Unix</text>
  <text class="edge-label" x="897" y="171">socket</text>
  <path class="edge both wire" d="M 362 305 H 738"/>
  <text class="edge-label" x="550" y="295">path 2 · pieces of messages</text>
  <rect class="node" x="740" y="275" width="130" height="60" rx="10"/>
  <text x="805" y="301">ferry server</text>
  <text class="secondary" x="805" y="320">--join</text>
  <path class="edge control" d="M 870 305 H 923"/>
  <circle class="badge" cx="740" cy="275" r="12"/>
  <text class="badge-text" x="740" y="279">3</text>
  <text class="edge-label" x="897" y="281">Unix</text>
  <text class="edge-label" x="897" y="294">socket</text>
  <path class="edge both wire" d="M 362 410 H 738"/>
  <text class="edge-label" x="550" y="400">path 3 · pieces of messages</text>
  <rect class="node" x="740" y="380" width="130" height="60" rx="10"/>
  <text x="805" y="406">ferry server</text>
  <text class="secondary" x="805" y="425">--join</text>
  <path class="edge control" d="M 870 410 H 923"/>
  <circle class="badge" cx="740" cy="380" r="12"/>
  <text class="badge-text" x="740" y="384">3</text>
  <text class="edge-label" x="897" y="386">Unix</text>
  <text class="edge-label" x="897" y="399">socket</text>

  <!-- Notes. -->
  <circle class="badge" cx="190" cy="512" r="10"/><text class="badge-text" x="190" y="516">1</text>
  <text class="secondary start-label" x="208" y="517">The transport opens every SSH connection first, holding an ssh -N for each: logins only, with no task.</text>
  <circle class="badge" cx="190" cy="538" r="10"/><text class="badge-text" x="190" y="542">2</text>
  <text class="secondary start-label" x="208" y="543">Then control connections, each a byte stream to a program on the host, probe, install, and run the server.</text>
  <circle class="badge" cx="190" cy="564" r="10"/><text class="badge-text" x="190" y="568">3</text>
  <text class="secondary start-label" x="208" y="569">Then every path joins the server. Every path is equal; control connections are plain.</text>
</svg>
