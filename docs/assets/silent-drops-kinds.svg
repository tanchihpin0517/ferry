<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title description">
  <title id="title">Five kinds of wait</title>
  <desc id="description">Waits are of five kinds, each bounded its own way. Once the connection is lost, each side cleans up within a bound; while it lives, every state is seen, and reported, for the user, or Ferry's own handling of errors, to act on. Waiting for a peer over the network: by its scope and the host's Liveness. Waiting for a third party over the network, a download or cargo fetching crates: by a floor on the progress of the tools Ferry runs. Waiting for a person, for a password, an OTP, or a yes: not bounded; only Ctrl-C ends it, and other hosts' heartbeats go on. Waiting on the system, a filesystem, a stopped process, PAM, a deadlock: seen while connected, and reported; not timed out. Waiting on the host before its monitor is there, when only a shell runs: a two-way heartbeat on the first session, by a watchdog in the shell.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      :root {
        --text: #172033; --muted-text: #526078; --surface: #f7f9fc; --surface-strong: #e9eef8;
        --border: #8491a8; --group: #b4bdcc; --client-surface: #e4f6ec; --client-border: #27875b;
        --server-surface: #e5efff; --server-border: #3478c8; --warn-surface: #fdf0e1; --warn-border: #c47a1d;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #eef3fb; --muted-text: #b5c0d3; --surface: #202938; --surface-strong: #2b3850;
          --border: #8390a6; --group: #5a667a; --client-surface: #173d30; --client-border: #5bc792;
          --server-surface: #193a62; --server-border: #72aef2; --warn-surface: #4a3417; --warn-border: #e0a456;
        }
      }
      text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 15px; text-anchor: middle; }
      .secondary { fill: var(--muted-text); font-size: 12.5px; }
      .group-label { fill: var(--muted-text); font-size: 13px; font-weight: 600; letter-spacing: .08em; }
      .edge-label { fill: var(--muted-text); font-size: 12px; }
      .start { text-anchor: start; }
      .group { fill: none; stroke: var(--group); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .node { fill: var(--surface); stroke: var(--border); stroke-width: 2; }
      .client { fill: var(--client-surface); stroke: var(--client-border); stroke-width: 2; }
      .server { fill: var(--server-surface); stroke: var(--server-border); stroke-width: 2; }
      .warn { fill: var(--warn-surface); stroke: var(--warn-border); stroke-width: 2; }
      .strong { fill: var(--surface-strong); stroke: var(--border); stroke-width: 1.5; }
      .tree { fill: none; stroke: var(--border); stroke-width: 1.8; }
      .edge { fill: none; stroke: var(--border); stroke-width: 2.2; marker-end: url(#arrow); }
      .both { marker-start: url(#arrow); }
      .beat { stroke: var(--server-border); stroke-dasharray: 8 5; }
      .arrow-head { fill: var(--border); }
    </style>
  </defs>

  <text class="group-label" x="150" y="40">WAITING FOR</text>
  <text class="group-label" x="470" y="40">FOR EXAMPLE</text>
  <text class="group-label" x="860" y="40">BOUNDED BY</text>
  <rect class="client" x="30" y="60" width="240" height="60" rx="10"/>
  <text x="150.0" y="95.0">a peer over the network</text>
  <rect class="strong" x="290" y="60" width="360" height="60" rx="10"/>
  <text x="470.0" y="95.0">reads, writes, accepts, who a connection is</text>
  <rect class="client" x="670" y="60" width="400" height="60" rx="10"/>
  <text x="870.0" y="95.0">its scope, and the host's Liveness</text>
  <path class="tree" d="M 272 90 H 288"/>
  <path class="edge" d="M 652 90 H 668"/>
  <rect class="client" x="30" y="136" width="240" height="60" rx="10"/>
  <text x="150.0" y="171.0">a third party, online</text>
  <rect class="strong" x="290" y="136" width="360" height="60" rx="10"/>
  <text x="470.0" y="171.0">a download, cargo fetching crates</text>
  <rect class="client" x="670" y="136" width="400" height="60" rx="10"/>
  <text x="870.0" y="171.0">a floor on the tools' progress</text>
  <path class="tree" d="M 272 166 H 288"/>
  <path class="edge" d="M 652 166 H 668"/>
  <rect class="node" x="30" y="212" width="240" height="60" rx="10"/>
  <text x="150.0" y="247.0">a person</text>
  <rect class="strong" x="290" y="212" width="360" height="60" rx="10"/>
  <text x="470.0" y="247.0">a password, an OTP, a yes to install</text>
  <rect class="node" x="670" y="212" width="400" height="60" rx="10"/>
  <text x="870.0" y="247.0">not bounded: only Ctrl-C; other hosts beat on</text>
  <path class="tree" d="M 272 242 H 288"/>
  <path class="edge" d="M 652 242 H 668"/>
  <rect class="warn" x="30" y="288" width="240" height="60" rx="10"/>
  <text x="150.0" y="323.0">the system</text>
  <rect class="strong" x="290" y="288" width="360" height="60" rx="10"/>
  <text x="470.0" y="323.0">a filesystem, a stopped process, PAM</text>
  <rect class="warn" x="670" y="288" width="400" height="60" rx="10"/>
  <text x="870.0" y="323.0">seen while connected: reported, not timed out</text>
  <path class="tree" d="M 272 318 H 288"/>
  <path class="edge" d="M 652 318 H 668"/>
  <rect class="server" x="30" y="364" width="240" height="60" rx="10"/>
  <text x="150.0" y="399.0">the host, before its monitor</text>
  <rect class="strong" x="290" y="364" width="360" height="60" rx="10"/>
  <text x="470.0" y="399.0">a shell waits for a command, an upload</text>
  <rect class="server" x="670" y="364" width="400" height="60" rx="10"/>
  <text x="870.0" y="399.0">a two-way heartbeat, by a shell watchdog</text>
  <path class="tree" d="M 272 394 H 288"/>
  <path class="edge" d="M 652 394 H 668"/>
  <text class="secondary" x="550" y="456">Once the connection is lost, each side cleans up within a bound. While it lives, everything is seen, and reported.</text>
  <text class="secondary" x="550" y="480">Scope and Liveness judge whether a connection is alive, not whether the work gets on.</text>
</svg>
