<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="title description">
  <title id="title">Several channels over one SSH connection</title>
  <desc id="description">A transfer may have K streams, all channels of the one SSH connection, and so of one TCP connection, as the connection the client follows the host monitor by is. Stream 0 carries everything but blocks: the manifest, needs, results, the credit, messages; blocks go to whichever stream has the shortest queue. They arrive out of order: the Destination puts them back in order by their sequence numbers, in a buffer the data credit bounds, before its decider takes them. The end of the blocks goes on stream 0, as END(N), after the file hashes and problems it must follow. All the channels drop together, so the one heartbeat covers them; but it queues behind their data in the TCP send buffer, which is to be measured.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      :root {
        --text: #172033; --muted-text: #526078; --surface: #f7f9fc; --surface-strong: #e9eef8;
        --border: #8491a8; --group: #b4bdcc; --client-surface: #e4f6ec; --client-border: #27875b;
        --server-surface: #e5efff; --server-border: #3478c8; --warn-surface: #fdf0e1; --warn-border: #c47a1d;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #eef3fb; --muted-text: #b5c0d3; --surface: #202938; --surface-strong: #2b3850;
          --border: #8390a6; --group: #5a667a; --client-surface: #173d30; --client-border: #5bc792;
          --server-surface: #193a62; --server-border: #72aef2; --warn-surface: #4a3417; --warn-border: #e0a456;
        }
      }
      text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 15px; text-anchor: middle; }
      .secondary { fill: var(--muted-text); font-size: 12.5px; }
      .group-label { fill: var(--muted-text); font-size: 13px; font-weight: 600; letter-spacing: .08em; }
      .edge-label { fill: var(--muted-text); font-size: 12px; }
      .start { text-anchor: start; }
      .group { fill: none; stroke: var(--group); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .node { fill: var(--surface); stroke: var(--border); stroke-width: 2; }
      .client { fill: var(--client-surface); stroke: var(--client-border); stroke-width: 2; }
      .server { fill: var(--server-surface); stroke: var(--server-border); stroke-width: 2; }
      .warn { fill: var(--warn-surface); stroke: var(--warn-border); stroke-width: 2; }
      .strong { fill: var(--surface-strong); stroke: var(--border); stroke-width: 1.5; }
      .tree { fill: none; stroke: var(--border); stroke-width: 1.8; }
      .edge { fill: none; stroke: var(--border); stroke-width: 2.2; marker-end: url(#arrow); }
      .both { marker-start: url(#arrow); }
      .beat { stroke: var(--server-border); stroke-dasharray: 8 5; }
      .arrow-head { fill: var(--border); }
    </style>
  </defs>

  <rect class="client" x="30" y="140" width="170" height="230" rx="10"/>
  <text x="115.0" y="224.0">Source</text>
  <text x="115.0" y="242.0">server</text>
  <text class="secondary" x="115.0" y="260.0">pump: blocks to the</text>
  <text class="secondary" x="115.0" y="278.0">shortest queue;</text>
  <text class="secondary" x="115.0" y="296.0">all else on stream 0</text>
  <rect class="group" x="230" y="40" width="560" height="350" rx="20"/>
  <text class="group-label" x="510" y="66">ONE SSH CONNECTION, ONE TCP</text>
  <rect class="server" x="250" y="88" width="520" height="36" rx="10"/>
  <text x="510.0" y="111.0">follow the host monitor: the heartbeat</text>
  <rect class="node" x="250" y="158" width="520" height="36" rx="10"/>
  <text x="510.0" y="181.0">stream 0: manifest, needs, results, credit, messages</text>
  <rect class="node" x="250" y="208" width="520" height="36" rx="10"/>
  <text x="510.0" y="231.0">stream 1: blocks</text>
  <rect class="node" x="250" y="258" width="520" height="36" rx="10"/>
  <text x="510.0" y="281.0">stream 2: blocks</text>
  <rect class="node" x="250" y="330" width="520" height="36" rx="10"/>
  <text x="510.0" y="353.0">stream K-1: blocks</text>
  <text class="secondary" x="510" y="314">. . .</text>
  <text class="edge-label" x="120" y="102">client ↔ host monitor</text>
  <path class="tree beat" d="M 120 110 V 106 H 248"/>
  <path class="edge both" d="M 202 176 H 248"/>
  <path class="edge" d="M 202 226 H 248"/>
  <path class="edge" d="M 202 276 H 248"/>
  <path class="edge" d="M 202 348 H 248"/>
  <rect class="group" x="810" y="120" width="270" height="270" rx="14"/>
  <text class="group-label" x="945.0" y="146">DESTINATION SERVER</text>
  <rect class="node" x="825" y="158" width="240" height="36" rx="10"/>
  <text x="945.0" y="181.0">stream 0, as it comes; END(N)</text>
  <rect class="strong" x="825" y="222" width="240" height="74" rx="10"/>
  <text x="945.0" y="246.0">blocks put back in order</text>
  <text class="secondary" x="945.0" y="264.0">by sequence number, in a buffer</text>
  <text class="secondary" x="945.0" y="282.0">the data credit bounds</text>
  <rect class="server" x="825" y="326" width="240" height="46" rx="10"/>
  <text x="945.0" y="354.0">decider</text>
  <path class="edge both" d="M 772 176 H 823"/>
  <path class="tree" d="M 772 226 C 797 226, 797 259, 823 259"/>
  <path class="tree" d="M 772 276 C 797 276, 797 259, 823 259"/>
  <path class="tree" d="M 772 348 C 797 348, 797 259, 823 259"/>
  <path class="edge" d="M 945 298 V 324"/>
  <path class="edge" d="M 1067 176 H 1072 V 349 H 1067"/>
  <text class="secondary" x="510" y="426">All drop together: the one heartbeat covers them. Any one ending without its end fails the transfer.</text>
  <text class="secondary" x="510" y="450">Each block whole on one stream. The blocks end once END(N) on stream 0 has come and blocks 0 to N-1 are in.</text>
</svg>
