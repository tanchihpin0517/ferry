  <text class="label start" x="298" y="428">local end</text>
  <path class="edge-plain" d="M 20 576 H 64"/>
  <rect class="node" x="70" y="565" width="76" height="22" rx="5"/>
  <text class="label" x="108" y="580.5">control ↔</text>
