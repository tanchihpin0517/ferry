  <path class="edge-plain" stroke-dasharray="6 5" d="M 360 576 H 404"/>
  <text class="small start" x="412" y="581">no pipes: raw bytes</text>
  <circle class="badge" cx="610" cy="576" r="10"/>
  <text class="badge-text" x="610" y="580">1</text>
  <text class="small start" x="626" y="581">order they are made</text>
  <text class="small start" x="800" y="581">local control connection: uncompressed</text>
  <text class="small start" x="20" y="604">Each worker a monitor starts (server, sudo ferry build-id, ferry fixture) has its stderr as a lifeline to it. Both sides on this machine: no 1 to 4.</text>
</svg>
