<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="630" viewBox="0 0 1100 630" role="img" aria-labelledby="title description">
  <title id="title">Every connection of a transfer</title>
  <desc id="description">Every connection of a transfer, with the client and the Source server on this machine, and the monitor and the Destination server on a host; solid lines go over pipes, dashed lines carry raw bytes, and the numbers give the order in which the connections are made. 1, one SSH connection, TCP; every connection across the machines is one of its channels. 2, the first session, through the login shell, raw: probing, installing, and exec into the host's monitor; when installing, the client uses curl to fetch SHA256SUMS and the binary to upload from GitHub, and the host downloads the release with curl or wget. 3, the link, between the client's monitor and the host's monitor, one control pipe. 4, the sudo check, only with --remote-sudo, raw. The fixture, only in ferry test, raw. 5, the control connection, between the client and each server, reports and control; the one on this machine is not compressed; a server's stderr is its lifeline, to its monitor, raw, never across the network. 6, the stream, between the two servers, manifest, data, answers and control; its end on this machine is handed over by the client, as a descriptor, through the server's socket.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <marker id="arrow-path" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-path"/>
    </marker>
    <marker id="arrow-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-client"/>
    </marker>
    <marker id="arrow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-hot"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-fail"/>
    </marker>
    <marker id="arrow-peer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-peer"/>
    </marker>
