  <text x="135" y="135">main thread</text>
  <text class="secondary" x="135" y="155">reads the answers</text>
  <rect class="server-node" x="286" y="114" width="170" height="52" rx="10"/>
  <text x="371" y="136">pipes in</text>
  <text class="secondary" x="371" y="154">answers, control</text>
  <rect class="server-node" x="40" y="218" width="190" height="64" rx="10"/>
  <text x="135" y="245">owner</text>
  <text class="secondary" x="135" y="265">files, as they are ready</text>
  <rect class="server-node" x="320" y="228" width="150" height="64" rx="10"/>
  <rect class="server-node" x="315" y="223" width="150" height="64" rx="10"/>
  <rect class="server-node" x="310" y="218" width="150" height="64" rx="10"/>
  <text x="385" y="245">readers</text>
  <text class="secondary" x="385" y="265">a file or segment</text>
  <rect class="count" x="424" y="208" width="44" height="20" rx="10"/>
  <text class="count-text" x="446" y="222">×16</text>
  <rect class="server-node" x="40" y="328" width="190" height="64" rx="10"/>
  <text x="135" y="355">data sender</text>
  <text class="secondary" x="135" y="375">a record each, in order</text>
  <rect class="server-node" x="40" y="438" width="190" height="64" rx="10"/>
  <text x="135" y="465">data pipe</text>
  <text class="secondary" x="135" y="485">8 compress its chunks</text>
  <rect class="count" x="194" y="428" width="44" height="20" rx="10"/>
  <text class="count-text" x="216" y="442">×8</text>
  <rect class="server-node" x="50" y="558" width="190" height="64" rx="10"/>
  <rect class="server-node" x="45" y="553" width="190" height="64" rx="10"/>
  <rect class="server-node" x="40" y="548" width="190" height="64" rx="10"/>
  <text x="135" y="575">pumps</text>
  <text class="secondary" x="135" y="595">control, answers, data</text>
  <rect class="count" x="194" y="538" width="44" height="20" rx="10"/>
  <text class="count-text" x="216" y="552">×K</text>
  <rect class="server-node" x="286" y="554" width="170" height="52" rx="10"/>
  <text x="371" y="576">streams</text>
  <text class="secondary" x="371" y="594">frames of the pipes</text>
  <rect class="server-node" x="286" y="624" width="170" height="52" rx="10"/>
  <text x="371" y="646">lifeline</text>
  <text class="secondary" x="371" y="664">its monitor gone: stop</text>

  <!-- Destination. -->
  <rect class="runtime-node" x="650" y="114" width="170" height="52" rx="10"/>
  <text x="735" y="136">streams</text>
  <text class="secondary" x="735" y="154">frames of the pipes</text>
  <rect class="runtime-node" x="650" y="184" width="170" height="52" rx="10"/>
  <text x="735" y="206">lifeline</text>
  <text class="secondary" x="735" y="224">its monitor gone: stop</text>
  <rect class="runtime-node" x="890" y="108" width="150" height="64" rx="10"/>
  <text x="965" y="135">pump</text>
  <text class="secondary" x="965" y="155">answers, control</text>
  <rect class="runtime-node" x="650" y="554" width="170" height="52" rx="10"/>
  <text x="735" y="576">a reader each</text>
  <text class="secondary" x="735" y="594">8 decompress chunks</text>
  <rect class="runtime-node" x="890" y="548" width="150" height="64" rx="10"/>
  <text x="965" y="575">data reader</text>
  <text class="secondary" x="965" y="595">records in order</text>
  <rect class="runtime-node" x="650" y="678" width="190" height="64" rx="10"/>
  <rect class="runtime-node" x="645" y="673" width="190" height="64" rx="10"/>
  <rect class="runtime-node" x="640" y="668" width="190" height="64" rx="10"/>
  <text x="735" y="695">checkers</text>
  <text class="secondary" x="735" y="715">each file, its hash</text>
  <rect class="count" x="794" y="658" width="44" height="20" rx="10"/>
  <text class="count-text" x="816" y="672">×8</text>
  <rect class="runtime-node" x="640" y="778" width="190" height="64" rx="10"/>
  <text x="735" y="805">feeder</text>
  <text class="secondary" x="735" y="825">files as they came</text>
  <rect class="runtime-node" x="640" y="888" width="190" height="64" rx="10"/>
  <text x="735" y="915">decider</text>
  <text class="secondary" x="735" y="935">batches in order</text>
  <rect class="runtime-node" x="920" y="898" width="130" height="64" rx="10"/>
  <rect class="runtime-node" x="915" y="893" width="130" height="64" rx="10"/>
  <rect class="runtime-node" x="910" y="888" width="130" height="64" rx="10"/>
  <text x="975" y="915">writers</text>
  <text class="secondary" x="975" y="935">file or segment</text>
  <rect class="count" x="1004" y="878" width="44" height="20" rx="10"/>
  <text class="count-text" x="1026" y="892">×16</text>
  <rect class="runtime-node" x="650" y="1008" width="190" height="64" rx="10"/>
  <rect class="runtime-node" x="645" y="1003" width="190" height="64" rx="10"/>
  <rect class="runtime-node" x="640" y="998" width="190" height="64" rx="10"/>
  <text x="735" y="1025">renamers</text>
  <text class="secondary" x="735" y="1045">a directory each</text>
  <rect class="count" x="794" y="988" width="44" height="20" rx="10"/>
  <text class="count-text" x="816" y="1002">×4</text>

  <!-- Source edges. -->
  <path class="edge" d="M 286 140 H 232"/>
  <text class="edge-label" x="259" y="130">recv</text>
  <path class="edge" d="M 135 172 V 216"/>
  <text class="edge-label start-label" x="145" y="199">files needed</text>
  <path class="edge" d="M 230 238 H 308"/>
  <text class="edge-label" x="270" y="230">≤32</text>
  <path class="edge any" d="M 310 262 H 232"/>
  <text class="edge-label" x="270" y="280">any order</text>
  <path class="edge" d="M 135 282 V 326"/>
  <text class="edge-label start-label" x="145" y="309">≤16 records</text>
  <path class="edge" d="M 135 392 V 436"/>
  <text class="edge-label start-label" x="145" y="414">≤ the window</text>
  <path class="edge" d="M 135 502 V 546"/>
  <text class="edge-label start-label" x="145" y="529">chunks, ≤16 MiB waiting</text>
  <path class="edge" d="M 242 580 H 284"/>
  <text class="edge-label" x="263" y="570">send</text>
  <path class="edge" d="M 371 624 V 608"/>

  <!-- The stream, between the servers: the client made it, and touches none of it. -->
  <rect class="group" x="488" y="30" width="124" height="1150" rx="14"/>
  <text class="group-label" x="550" y="58">THE STREAMS</text>
  <text class="secondary" x="550" y="82">1 to 8, made by</text>
  <text class="secondary" x="550" y="100">the client, which</text>
  <text class="secondary" x="550" y="118">touches none of it</text>
  <path class="edge wire" d="M 650 140 H 458"/>
  <text class="edge-label" x="550" y="160">answers, control</text>
  <path class="edge wire" d="M 456 580 H 648"/>
  <text class="edge-label" x="550" y="600">manifest, data</text>
  <text class="edge-label" x="550" y="616">control</text>

  <!-- Destination edges. -->
  <path class="edge" d="M 890 140 H 822"/>
  <text class="edge-label" x="855" y="130">send</text>
  <path class="edge" d="M 735 184 V 168"/>
  <path class="edge" d="M 820 580 H 888"/>
  <text class="edge-label" x="855" y="570">data</text>
  <path class="edge" d="M 965 612 V 700 H 842"/>
  <text class="edge-label start-label" x="975" y="640">records,</text>
  <text class="edge-label start-label" x="975" y="654">≤64 MiB held</text>
  <path class="edge" d="M 735 742 V 776"/>
  <text class="edge-label start-label" x="745" y="764">put back as they came</text>
  <path class="edge" d="M 735 842 V 886"/>
  <text class="edge-label start-label" x="745" y="869">in order</text>
  <path class="edge" d="M 830 908 H 908"/>
  <text class="edge-label" x="870" y="900">≤32</text>
  <path class="edge any" d="M 908 932 H 832"/>
  <text class="edge-label" x="870" y="950">any order</text>
  <path class="edge" d="M 735 952 V 996"/>
  <text class="edge-label start-label" x="745" y="979">batches, ≤2</text>
  <path class="edge" d="M 830 1040 H 860 V 1092 H 1062 V 140 H 1042"/>
  <text class="edge-label" x="1054" y="1110" style="text-anchor: end">what failed</text>
  <text class="edge-label" x="1054" y="192" style="text-anchor: end">answers</text>

  <!-- Legend. -->
  <rect class="node" x="40" y="1197" width="56" height="30" rx="7"/>
  <text class="secondary start-label" x="106" y="1217">one thread</text>
  <rect class="node" x="210" y="1207" width="56" height="30" rx="7"/>
  <rect class="node" x="205" y="1202" width="56" height="30" rx="7"/>
  <rect class="node" x="200" y="1197" width="56" height="30" rx="7"/>
  <rect class="count" x="234" y="1187" width="36" height="18" rx="9"/>
  <text class="count-text" x="252" y="1200">×N</text>
  <text class="secondary start-label" x="280" y="1217">a pool of N threads</text>
  <rect class="transport" x="420" y="1197" width="56" height="30" rx="7"/>
  <text class="secondary start-label" x="486" y="1217">the transport</text>
  <path class="edge" d="M 590 1212 H 640"/>
  <text class="secondary start-label" x="650" y="1217">in order</text>
  <path class="edge any" d="M 720 1212 H 770"/>
  <text class="secondary start-label" x="780" y="1217">any order</text>
  <text class="secondary start-label" x="860" y="1217">≤n: holds at most n</text>
  <text class="secondary" x="550" y="1262">Pools have as many threads as there are cores, up to the number shown; K, the streams&#8217; pumps, one for each.</text>
  <text class="secondary" x="550" y="1284">Each server has its end of the streams, drawn where each way goes through it: a pump writes each stream, a thread reads each.</text>
  <text class="secondary" x="550" y="1306">Each stream is a channel of the host&#8217;s one SSH connection, or a socket pair on this machine: should one break, the transfer fails.</text>
</svg>
