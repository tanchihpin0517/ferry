<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1330" viewBox="0 0 1100 1330" role="img" aria-labelledby="title description">
  <title id="title">Workers, queues, and the transport of a transfer</title>
  <desc id="description">The threads of a transfer, the queues between them, and the transport under them. On the Source, the main thread reads the Destination's answers from their pipe and tells the owner, which does no I/O, the files needed. The owner hands 16 readers up to 32 files at a time, whatever their size, each a job at a time: a whole file of up to 2 MiB, or the next segment of 2 MiB of a larger one, in order; the readers read 16 at once, hashing as they read, and hand them back in any order. The owner hands each file, or segment, as it is ready, to the data sender, at most 16 not yet written, which writes each as a record on the data pipe, in order, waiting while its window is used up. In the transport, the data waits in the pipe's send buffer, at most 16 MiB, and is cut into chunks of 2 MiB, compressed by 8 threads where the connection is compressed; a pump for each stream takes what waits, control first, then the answers, then the data while enough of it waits, and the manifest otherwise. There are 1 to 8 streams between the two servers: the client made them, and touches none of them; should one break, the transfer fails. Each server also has a lifeline thread, which waits on its standard error, and stops the server once its monitor is gone. On the Destination, a thread for each stream reads it, and never waits for a peer, putting each pipe's bytes in its receive buffer, the data's chunks decompressed by 8 threads and put back in order. The data reader reads the records in order, and hands each file, or segment, to 8 checkers, which check it against its hash, holding at most 64 MiB of it read and not written, so nothing past it ever waits for room. A feeder passes them on in the order they came to the decider, which does no I/O, and hands each file, or each segment of a large one, to one of 16 writers, at most two jobs each. Writers write each file, without a name where the filesystem can, or under a temporary name, and each segment where it goes in its file, a file's one at a time, in order, and report back in any order. Every 256 files, or a second after the first of a batch not full, the decider hands the batch to 4 renamers, which last the transfer, and goes on; they rename the batch, a directory each, with at most two batches waiting for them. The answers go back on their pipe, through the Destination's transport and the first stream, the same way. Pools have as many threads as there are cores, up to the number shown.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      :root {
        --text: #172033;
        --muted-text: #526078;
        --surface: #f7f9fc;
        --surface-strong: #e9eef8;
        --border: #8491a8;
        --group: #b4bdcc;
        --client-surface: #e4f6ec;
        --client-border: #27875b;
        --server-surface: #e5efff;
        --server-border: #3478c8;
        --badge: #172033;
        --badge-text: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #eef3fb;
          --muted-text: #b5c0d3;
          --surface: #202938;
          --surface-strong: #2b3850;
          --border: #8390a6;
          --group: #5a667a;
          --client-surface: #173d30;
          --client-border: #5bc792;
          --server-surface: #193a62;
          --server-border: #72aef2;
          --badge: #eef3fb;
          --badge-text: #172033;
        }
      }
      text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; text-anchor: middle; }
      .secondary { fill: var(--muted-text); font-size: 13px; }
      .group-label { fill: var(--muted-text); font-size: 13px; font-weight: 600; letter-spacing: .08em; }
      .edge-label { fill: var(--muted-text); font-size: 12px; }
      .start-label { text-anchor: start; }
      .edge.plain { marker-end: none; }
      .phase { fill: none; stroke: var(--group); stroke-width: 2; }
      .phase-label { fill: var(--text); font-size: 14px; font-weight: 700; letter-spacing: .1em; }
      .group { fill: none; stroke: var(--group); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .node { fill: var(--surface); stroke: var(--border); stroke-width: 2; }
      .server-node { fill: var(--server-surface); stroke: var(--server-border); stroke-width: 2; }
      .runtime-node { fill: var(--surface-strong); stroke: var(--server-border); stroke-width: 2.5; }
      .client-node { fill: var(--client-surface); stroke: var(--client-border); stroke-width: 2; }
      .edge { fill: none; stroke: var(--border); stroke-width: 2.5; marker-end: url(#arrow); }
      .both { marker-start: url(#arrow); }
      .wire { stroke: var(--server-border); }
      .control { stroke-dasharray: 7 5; }
      .arrow-head { fill: var(--border); }
      .any { stroke-dasharray: 6 5; }
      .plain { marker-end: none; }
      .count { fill: var(--badge); }
      .count-text { fill: var(--badge-text); font-size: 12px; font-weight: 700; }
      .transport { fill: none; stroke: var(--client-border); stroke-width: 2; }
      .transport-label { fill: var(--client-border); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-anchor: start; }
      .badge { fill: var(--badge); }
      .badge-text { fill: var(--badge-text); font-size: 12px; font-weight: 700; }
    </style>
  </defs>

  <!-- Peers. -->
  <rect class="group" x="20" y="30" width="460" height="1150" rx="14"/>
  <text class="group-label" x="250" y="58">SOURCE PEER, IN A SERVER</text>
  <rect class="group" x="620" y="30" width="460" height="1150" rx="14"/>
  <text class="group-label" x="850" y="58">DESTINATION PEER, IN A SERVER</text>

  <!-- The transport: each server's end of the streams, read and written by the peer's own threads, and its lifeline. -->
  <rect class="transport" x="274" y="96" width="200" height="100" rx="12"/>
  <text class="transport-label" x="278" y="90">TRANSPORT</text>
  <rect class="transport" x="30" y="424" width="444" height="280" rx="12"/>
  <text class="transport-label" x="470" y="418" style="text-anchor: end">TRANSPORT</text>
  <rect class="transport" x="638" y="96" width="414" height="170" rx="12"/>
  <text class="transport-label" x="642" y="90">TRANSPORT</text>
  <rect class="transport" x="638" y="534" width="200" height="100" rx="12"/>
  <text class="transport-label" x="642" y="528">TRANSPORT</text>

