<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1360" viewBox="0 0 1100 1360" role="img" aria-labelledby="title description">
  <title id="title">Workers, queues, and connections of a transfer</title>
  <desc id="description">The threads of a transfer, the queues between them, and the transport under them. On the Source, the main thread reads the Destination's needs and results from the connection and tells the sender which files to send. The sender hands files to 16 readers, at most 64 at a time; the readers open them, read small ones whole, and hand them back in any order. The sender writes each file's record into the stream in the order files are ready, streaming large files itself, and cuts the stream into 2 MiB frames for 8 compressors, with at most 16 waiting. A frame sender takes compressed frames back in order and queues them, at most 256 packets of 64 KiB, for the pump, which sends messages first, then data while enough of it waits, and the manifest otherwise, into the connection. The transport cuts the messages into numbered pieces and spreads them over its paths, all equal; the far end's transport puts them back together and hands on whole messages, in order. On the Destination, the main thread receives messages from the connection, compares the manifest, sends needs, and hands frames to 8 decompressors, with at most 16 waiting. A frame feeder passes them on in order to the parser. The parser reads records in order and hands each file to one of 16 writers, at most 16 at a time, forwarding its bytes as it parses them. Writers write and fsync each file under a temporary name and report back in any order. Every 256 files, the parser renames the batch after one barrier per drive, with 8 threads. Needs and results go back through the Destination's pump and transport. The client, between the two servers, relays every message from one to the other, and shows the reports they send it. Pools have as many threads as there are cores, up to the number shown.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      :root {
        --text: #172033;
        --muted-text: #526078;
        --surface: #f7f9fc;
        --surface-strong: #e9eef8;
        --border: #8491a8;
        --group: #b4bdcc;
        --client-surface: #e4f6ec;
        --client-border: #27875b;
        --server-surface: #e5efff;
        --server-border: #3478c8;
        --badge: #172033;
        --badge-text: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #eef3fb;
          --muted-text: #b5c0d3;
          --surface: #202938;
          --surface-strong: #2b3850;
          --border: #8390a6;
          --group: #5a667a;
          --client-surface: #173d30;
          --client-border: #5bc792;
          --server-surface: #193a62;
          --server-border: #72aef2;
          --badge: #eef3fb;
          --badge-text: #172033;
        }
      }
      text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; text-anchor: middle; }
      .secondary { fill: var(--muted-text); font-size: 13px; }
      .group-label { fill: var(--muted-text); font-size: 13px; font-weight: 600; letter-spacing: .08em; }
      .edge-label { fill: var(--muted-text); font-size: 12px; }
      .start-label { text-anchor: start; }
      .edge.plain { marker-end: none; }
      .phase { fill: none; stroke: var(--group); stroke-width: 2; }
      .phase-label { fill: var(--text); font-size: 14px; font-weight: 700; letter-spacing: .1em; }
      .group { fill: none; stroke: var(--group); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .node { fill: var(--surface); stroke: var(--border); stroke-width: 2; }
      .server-node { fill: var(--server-surface); stroke: var(--server-border); stroke-width: 2; }
      .runtime-node { fill: var(--surface-strong); stroke: var(--server-border); stroke-width: 2.5; }
      .client-node { fill: var(--client-surface); stroke: var(--client-border); stroke-width: 2; }
      .edge { fill: none; stroke: var(--border); stroke-width: 2.5; marker-end: url(#arrow); }
      .both { marker-start: url(#arrow); }
      .wire { stroke: var(--server-border); }
      .control { stroke-dasharray: 7 5; }
      .arrow-head { fill: var(--border); }
      .any { stroke-dasharray: 6 5; }
      .plain { marker-end: none; }
      .count { fill: var(--badge); }
      .count-text { fill: var(--badge-text); font-size: 12px; font-weight: 700; }
      .transport { fill: none; stroke: var(--client-border); stroke-width: 2; }
      .transport-label { fill: var(--client-border); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-anchor: start; }
      .badge { fill: var(--badge); }
      .badge-text { fill: var(--badge-text); font-size: 12px; font-weight: 700; }
    </style>
  </defs>

