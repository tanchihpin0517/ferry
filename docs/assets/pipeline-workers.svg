  <text class="secondary" x="550" y="1302">Pools have as many threads as there are cores, up to the number shown.</text>
  <text class="secondary" x="550" y="1324">Connections 2 to N, from --connections N, are not built yet; without them, connection 1 carries every frame.</text>
</svg>
