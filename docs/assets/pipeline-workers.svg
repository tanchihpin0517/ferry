<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1540" viewBox="0 0 1100 1540" role="img" aria-labelledby="title description">
  <title id="title">Workers, queues, and the transport of a transfer</title>
  <desc id="description">The threads of a transfer, the queues between them, and the transport under them. On the Source, the main thread reads the Destination's needs and results from its transport and tells the owner, which does no I/O, the files needed, and the credit the Destination gives. The owner hands 16 readers up to 32 files at a time, whatever their size, each a job at a time: a whole file, or the next segment of 2 MiB of one too large for a pack, in order; the readers read 16 at once, hashing as they read, and hand them back in any order. The owner puts each file in a pack as it is ready, and hands each pack of up to 2 MiB, and each segment, to 8 compressors, at most 16 not yet sent, and within the data credit. A block sender takes the blocks back in order and queues them, at most 256 packets of 64 KiB, for the pump, which sends messages first, then data while enough of it waits, and the manifest otherwise, to its server's transport. There, a thread puts each block back together, whole, and hands it to the session as a block, and every other message as a control message; the session numbers each, and keeps it until the other side says it has it, and sends it on the streams, a writer on each, all equal: each control message on one, ahead of what is still to be written there, and each block, in fragments, on the one with the least to write. At the other server, a reader on each stream hands what comes to its session, which hands on each control message once, in the order sent, and each block once, in any order; a thread passes them on to the peer as packets. On the Destination, the main thread receives messages from its transport, compares the manifest, sends needs, and hands blocks to 8 decompressors, which decompress each and check what it holds: as many may wait as the data credit allows, which the Destination gives the Source as it starts, and gives back as blocks are written, so nothing on this side ever waits for room. A feeder passes them on in the order they came to the decider, which does no I/O, and hands each file, or each segment of a large one, to one of 16 writers, at most two jobs each. Writers write each file, without a name where the filesystem can, or under a temporary name, and each segment where it goes in its file, a file's one at a time, in order, and report back in any order. Every 256 files, or a second after the first of a batch not full, the decider hands the batch to 4 renamers, which last the transfer, and goes on; they rename the batch, a directory each, with at most two batches waiting for them. Needs and results go back through the Destination's pump and transport, the same way. Each server has one session, drawn where each way goes through it. The client made the streams between the two servers, each a channel of one of its SSH connections, or a socket pair on this machine; it touches none of what goes on them, makes again one that breaks, and shows the reports the servers send it on their control connections. Pools have as many threads as there are cores, up to the number shown.</desc>

