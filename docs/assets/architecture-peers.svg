<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="title description">
  <title id="title">Peers in a push</title>
  <desc id="description">Two machines. On the local machine, the ferry client, run as ferry ./a host:b in your terminal, holds the Source peer, which reads ./a. Over one SSH connection carrying typed packets, it reaches the ferry server on the remote machine, which SSH started and which exits when the connection closes. The server holds the Destination peer, which writes b. In a pull the two peers swap sides.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      :root {
        --text: #172033;
        --muted-text: #526078;
        --surface: #f7f9fc;
        --surface-strong: #e9eef8;
        --border: #8491a8;
        --group: #b4bdcc;
        --client-surface: #e4f6ec;
        --client-border: #27875b;
        --server-surface: #e5efff;
        --server-border: #3478c8;
        --badge: #172033;
        --badge-text: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #eef3fb;
          --muted-text: #b5c0d3;
          --surface: #202938;
          --surface-strong: #2b3850;
          --border: #8390a6;
          --group: #5a667a;
          --client-surface: #173d30;
          --client-border: #5bc792;
          --server-surface: #193a62;
          --server-border: #72aef2;
          --badge: #eef3fb;
          --badge-text: #172033;
        }
      }
      text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; text-anchor: middle; }
      .secondary { fill: var(--muted-text); font-size: 13px; }
      .group-label { fill: var(--muted-text); font-size: 13px; font-weight: 600; letter-spacing: .08em; }
      .edge-label { fill: var(--muted-text); font-size: 12px; }
      .start-label { text-anchor: start; }
      .group { fill: none; stroke: var(--group); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .node { fill: var(--surface); stroke: var(--border); stroke-width: 2; }
      .server-node { fill: var(--server-surface); stroke: var(--server-border); stroke-width: 2; }
      .runtime-node { fill: var(--surface-strong); stroke: var(--server-border); stroke-width: 2.5; }
      .client-node { fill: var(--client-surface); stroke: var(--client-border); stroke-width: 2; }
      .edge { fill: none; stroke: var(--border); stroke-width: 2.5; marker-end: url(#arrow); }
      .both { marker-start: url(#arrow); }
      .wire { stroke: var(--server-border); }
      .control { stroke-dasharray: 7 5; }
      .arrow-head { fill: var(--border); }
      .badge { fill: var(--badge); }
      .badge-text { fill: var(--badge-text); font-size: 12px; font-weight: 700; }
    </style>
  </defs>

  <!-- Machines. -->
  <rect class="group" x="20" y="30" width="400" height="290" rx="14"/>
  <text class="group-label" x="220" y="58">LOCAL MACHINE</text>
  <rect class="group" x="580" y="30" width="300" height="290" rx="14"/>
  <text class="group-label" x="730" y="58">REMOTE MACHINE</text>

  <!-- Client. -->
  <rect class="client-node" x="60" y="90" width="320" height="190" rx="12"/>
  <text x="220" y="120">ferry client</text>
  <text class="secondary" x="220" y="140">ferry ./a host:b, in your terminal</text>
  <rect class="runtime-node" x="130" y="175" width="180" height="72" rx="10"/>
  <text x="220" y="205">Source peer</text>
  <text class="secondary" x="220" y="227">reads ./a</text>

  <!-- Server. -->
  <rect class="server-node" x="610" y="90" width="240" height="190" rx="12"/>
  <text x="730" y="120">ferry server</text>
  <text class="secondary" x="730" y="140">started over SSH, exits with it</text>
  <rect class="runtime-node" x="640" y="175" width="180" height="72" rx="10"/>
  <text x="730" y="205">Destination peer</text>
  <text class="secondary" x="730" y="227">writes b</text>

  <!-- Wire. -->
  <path class="edge both wire" d="M 382 201 H 608"/>
  <text class="edge-label" x="495" y="190">SSH</text>
  <text class="edge-label" x="495" y="222">one connection,</text>
  <text class="edge-label" x="495" y="238">typed packets</text>
</svg>
