<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title description">
  <title id="title">Every transfer: two servers, and the streams the client makes between them</title>
  <desc id="description">The ferry client, on this machine, starts two ferry servers, one through each side's transport: the Source peer runs in one, the Destination peer in the other. Each server runs on this machine, through the local transport, or on a host, through the SSH transport. The client makes the streams between the two servers, which carry their session, and touches none of what goes on them; it shows what they report: progress, warnings, and the summary. A push has the Source server on this machine and the Destination server on a host; a pull the reverse; a local copy both on this machine; remote to remote one on each host. All four run the same way.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      :root {
        --text: #172033;
        --muted-text: #526078;
        --surface: #f7f9fc;
        --surface-strong: #e9eef8;
        --border: #8491a8;
        --group: #b4bdcc;
        --client-surface: #e4f6ec;
        --client-border: #27875b;
        --server-surface: #e5efff;
        --server-border: #3478c8;
        --badge: #172033;
        --badge-text: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #eef3fb;
          --muted-text: #b5c0d3;
          --surface: #202938;
          --surface-strong: #2b3850;
          --border: #8390a6;
          --group: #5a667a;
          --client-surface: #173d30;
          --client-border: #5bc792;
          --server-surface: #193a62;
          --server-border: #72aef2;
          --badge: #eef3fb;
          --badge-text: #172033;
        }
      }
      text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; text-anchor: middle; }
      .secondary { fill: var(--muted-text); font-size: 13px; }
      .group-label { fill: var(--muted-text); font-size: 13px; font-weight: 600; letter-spacing: .08em; }
      .edge-label { fill: var(--muted-text); font-size: 12px; }
      .start-label { text-anchor: start; }
      .edge.plain { marker-end: none; }
      .phase { fill: none; stroke: var(--group); stroke-width: 2; }
      .phase-label { fill: var(--text); font-size: 14px; font-weight: 700; letter-spacing: .1em; }
      .group { fill: none; stroke: var(--group); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .node { fill: var(--surface); stroke: var(--border); stroke-width: 2; }
      .server-node { fill: var(--server-surface); stroke: var(--server-border); stroke-width: 2; }
      .runtime-node { fill: var(--surface-strong); stroke: var(--server-border); stroke-width: 2.5; }
      .client-node { fill: var(--client-surface); stroke: var(--client-border); stroke-width: 2; }
      .edge { fill: none; stroke: var(--border); stroke-width: 2.5; marker-end: url(#arrow); }
      .both { marker-start: url(#arrow); }
      .wire { stroke: var(--server-border); }
      .control { stroke-dasharray: 7 5; }
      .arrow-head { fill: var(--border); }
      .transport { fill: none; stroke: var(--client-border); stroke-width: 2; }
      .transport-label { fill: var(--client-border); font-size: 12px; font-weight: 700; letter-spacing: .08em; }
      .cell { fill: var(--muted-text); font-size: 13px; }
      .head { fill: var(--muted-text); font-size: 12px; font-weight: 700; letter-spacing: .06em; }
      .rule { stroke: var(--group); stroke-width: 1; }
      .badge { fill: var(--badge); }
      .badge-text { fill: var(--badge-text); font-size: 12px; font-weight: 700; }
    </style>
  </defs>
  <rect class="group" x="20" y="30" width="300" height="300" rx="14"/>
  <text class="group-label" x="170" y="58">SOURCE SIDE</text>
  <text class="secondary" x="170" y="82">this machine or a host</text>
  <rect class="server-node" x="60" y="110" width="220" height="170" rx="12"/>
  <text x="170" y="140">ferry server</text>
  <rect class="runtime-node" x="85" y="180" width="170" height="72" rx="10"/>
  <text x="170" y="211">Source peer</text>
  <text class="secondary" x="170" y="233">reads</text>
  <rect class="group" x="780" y="30" width="300" height="300" rx="14"/>
  <text class="group-label" x="930" y="58">DESTINATION SIDE</text>
  <text class="secondary" x="930" y="82">this machine or a host</text>
  <rect class="server-node" x="820" y="110" width="220" height="170" rx="12"/>
  <text x="930" y="140">ferry server</text>
  <rect class="runtime-node" x="845" y="180" width="170" height="72" rx="10"/>
  <text x="930" y="211">Destination peer</text>
  <text class="secondary" x="930" y="233">writes</text>
  <rect class="group" x="400" y="30" width="300" height="300" rx="14"/>
  <text class="group-label" x="550" y="58">THIS MACHINE</text>
  <rect class="client-node" x="440" y="110" width="220" height="170" rx="12"/>
  <text x="550" y="150">ferry client</text>
  <text class="secondary" x="550" y="176">prepares, starts both servers,</text>
  <text class="secondary" x="550" y="194">makes the streams between,</text>
  <text class="secondary" x="550" y="212">shows what they report</text>
  <path class="edge both wire" d="M 280 195 H 438"/>
  <text class="transport-label" x="360" y="183">transport</text>
  <text class="edge-label" x="360" y="220">local or SSH</text>
  <path class="edge both wire" d="M 660 195 H 818"/>
  <text class="transport-label" x="740" y="183">transport</text>
  <text class="edge-label" x="740" y="220">local or SSH</text>
  <!-- The streams, server to server: the client makes them, and touches nothing on them. -->
  <path class="edge both wire" d="M 170 282 V 306 H 930 V 282"/>
  <text class="edge-label" x="550" y="300">the streams: the two servers' session, the client touching none of it</text>

  <!-- The four combinations. -->
  <text class="head" x="420" y="372">COMMAND</text>
  <text class="head" x="600" y="372">SOURCE SERVER</text>
  <text class="head" x="780" y="372">DESTINATION SERVER</text>
  <path class="rule" d="M 330 382 H 870"/>
  <text class="cell" x="420" y="404">push</text>
  <text class="cell" x="600" y="404">this machine</text>
  <text class="cell" x="780" y="404">a host</text>
  <text class="cell" x="420" y="428">pull</text>
  <text class="cell" x="600" y="428">a host</text>
  <text class="cell" x="780" y="428">this machine</text>
  <text class="cell" x="420" y="452">local copy</text>
  <text class="cell" x="600" y="452">this machine</text>
  <text class="cell" x="780" y="452">this machine</text>
  <text class="cell" x="420" y="476">remote to remote</text>
  <text class="cell" x="600" y="476">host A</text>
  <text class="cell" x="780" y="476">host B</text>
  <text class="secondary" x="550" y="506">All four run the same way; where a server runs only decides which transport starts it.</text>
</svg>
