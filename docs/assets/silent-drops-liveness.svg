<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="title description">
  <title id="title">A host's Liveness through its phases</title>
  <desc id="description">Where a host's Liveness comes from, phase by phase. Logging in: ssh's own ConnectTimeout, and 30 s for a ControlMaster. The first session, which probes and installs: an alive line every 5 s from the script, gone after 30 s with none; on the host, a shell watchdog ends the session once no line, a no-op the client sends every 5 s, came for 30 s. Once the host monitor has said where it is: the client waits 30 s at most for the connection it follows the monitor by to start, and the monitor 30 s at most to be followed. Once followed: the heartbeat, 5 s, gone after 30 s. When it says gone, every wait on the host returns on the client, with why, and the transfer fails; on the host, the monitor sends SIGTERM to what it started, waits the grace, kills what is left, and ends.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      :root {
        --text: #172033; --muted-text: #526078; --surface: #f7f9fc; --surface-strong: #e9eef8;
        --border: #8491a8; --group: #b4bdcc; --client-surface: #e4f6ec; --client-border: #27875b;
        --server-surface: #e5efff; --server-border: #3478c8; --warn-surface: #fdf0e1; --warn-border: #c47a1d;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #eef3fb; --muted-text: #b5c0d3; --surface: #202938; --surface-strong: #2b3850;
          --border: #8390a6; --group: #5a667a; --client-surface: #173d30; --client-border: #5bc792;
          --server-surface: #193a62; --server-border: #72aef2; --warn-surface: #4a3417; --warn-border: #e0a456;
        }
      }
      text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 15px; text-anchor: middle; }
      .secondary { fill: var(--muted-text); font-size: 12.5px; }
      .group-label { fill: var(--muted-text); font-size: 13px; font-weight: 600; letter-spacing: .08em; }
      .edge-label { fill: var(--muted-text); font-size: 12px; }
      .start { text-anchor: start; }
      .group { fill: none; stroke: var(--group); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .node { fill: var(--surface); stroke: var(--border); stroke-width: 2; }
      .client { fill: var(--client-surface); stroke: var(--client-border); stroke-width: 2; }
      .server { fill: var(--server-surface); stroke: var(--server-border); stroke-width: 2; }
      .warn { fill: var(--warn-surface); stroke: var(--warn-border); stroke-width: 2; }
      .strong { fill: var(--surface-strong); stroke: var(--border); stroke-width: 1.5; }
      .tree { fill: none; stroke: var(--border); stroke-width: 1.8; }
      .edge { fill: none; stroke: var(--border); stroke-width: 2.2; marker-end: url(#arrow); }
      .both { marker-start: url(#arrow); }
      .beat { stroke: var(--server-border); stroke-dasharray: 8 5; }
      .arrow-head { fill: var(--border); }
    </style>
  </defs>

  <path class="edge" d="M 200 52 H 1076"/>
  <text class="edge-label" x="1060" y="44">time</text>
  <text x="295.0" y="84">log in</text>
  <text x="525.0" y="84">first session</text>
  <text x="760.0" y="84">monitor said where</text>
  <text x="975.0" y="84">followed: the transfer</text>
  <text class="group-label start" x="30" y="146">client sees</text>
  <text class="group-label start" x="30" y="164">host A's Liveness</text>
  <text class="group-label start" x="30" y="238">the host sees</text>
  <text class="group-label start" x="30" y="256">the client</text>
  <text class="secondary start" x="30" y="274">(its shell, then</text>
  <text class="secondary start" x="30" y="290">its monitor)</text>
  <rect class="client" x="200" y="110" width="180" height="80" rx="10"/>
  <text x="290.0" y="146.0">ssh ConnectTimeout</text>
  <text class="secondary" x="290.0" y="164.0">30 s for a ControlMaster</text>
  <rect class="client" x="400" y="110" width="240" height="80" rx="10"/>
  <text x="520.0" y="137.0">alive line every 5 s</text>
  <text class="secondary" x="520.0" y="155.0">gone after 30 s with none</text>
  <text class="secondary" x="520.0" y="173.0">(minutes of build included)</text>
  <rect class="client" x="660" y="110" width="190" height="80" rx="10"/>
  <text x="755.0" y="146.0">start mark in 30 s</text>
  <text class="secondary" x="755.0" y="164.0">on the follow connection</text>
  <rect class="client" x="870" y="110" width="200" height="80" rx="10"/>
  <text x="970.0" y="146.0">heartbeat</text>
  <text class="secondary" x="970.0" y="164.0">5 s; gone after 30 s</text>
  <rect class="strong" x="200" y="210" width="180" height="80" rx="10"/>
  <text x="290.0" y="246.0">nothing of Ferry's</text>
  <text class="secondary" x="290.0" y="264.0">sshd only</text>
  <rect class="server" x="400" y="210" width="240" height="80" rx="10"/>
  <text x="520.0" y="237.0">shell watchdog</text>
  <text class="secondary" x="520.0" y="255.0">a ':' line every 5 s from</text>
  <text class="secondary" x="520.0" y="273.0">the client; gone after 30 s</text>
  <rect class="server" x="660" y="210" width="190" height="80" rx="10"/>
  <text x="755.0" y="255.0">followed in 30 s</text>
  <rect class="server" x="870" y="210" width="200" height="80" rx="10"/>
  <text x="970.0" y="246.0">heartbeat</text>
  <text class="secondary" x="970.0" y="264.0">the same one</text>
  <rect class="warn" x="200" y="320" width="866" height="50" rx="10"/>
  <text x="633.0" y="350.0">client, when gone: every wait on host A returns, with why; the transfer fails</text>
  <rect class="warn" x="400" y="390" width="240" height="50" rx="10"/>
  <text x="520.0" y="420.0">shell: ends the session</text>
  <rect class="warn" x="660" y="390" width="406" height="50" rx="10"/>
  <text x="863.0" y="420.0">monitor, when gone: SIGTERM, grace, kill, end</text>
  <text class="group-label start" x="30" y="350">when it says</text>
  <text class="group-label start" x="30" y="368">gone</text>
</svg>
