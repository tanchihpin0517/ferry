<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="title description">
  <title id="title">The transport: the session, and its streams</title>
  <desc id="description">What the two peers see: one sends control messages and blocks to its session; the other's session delivers each control message once, in the order sent, and each block once, in any order. What the session does underneath: it numbers what it is handed, and keeps it until the other side says it has it; it sends the control messages on one stream, ahead of any fragments still to be written there, and each block, cut into fragments, on the stream with the least to write. The other session puts each block back together, delivers each once, and says what it has. A stream that breaks: what was on it, not yet had, goes again on another, and the client makes another stream in its place. Every stream is equal: a channel of one of the client's SSH connections, or a socket pair on this machine. The other direction works the same way.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      :root {
        --text: #172033;
        --muted-text: #526078;
        --surface: #f7f9fc;
        --surface-strong: #e9eef8;
        --border: #8491a8;
        --group: #b4bdcc;
        --client-surface: #e4f6ec;
        --client-border: #27875b;
        --server-surface: #e5efff;
        --server-border: #3478c8;
        --badge: #172033;
        --badge-text: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #eef3fb;
          --muted-text: #b5c0d3;
          --surface: #202938;
          --surface-strong: #2b3850;
          --border: #8390a6;
          --group: #5a667a;
          --client-surface: #173d30;
          --client-border: #5bc792;
          --server-surface: #193a62;
          --server-border: #72aef2;
          --badge: #eef3fb;
          --badge-text: #172033;
        }
      }
      text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; text-anchor: middle; }
      .secondary { fill: var(--muted-text); font-size: 13px; }
      .group-label { fill: var(--muted-text); font-size: 13px; font-weight: 600; letter-spacing: .08em; }
      .edge-label { fill: var(--muted-text); font-size: 12px; }
      .start-label { text-anchor: start; }
      .edge.plain { marker-end: none; }
      .phase { fill: none; stroke: var(--group); stroke-width: 2; }
      .phase-label { fill: var(--text); font-size: 14px; font-weight: 700; letter-spacing: .1em; }
      .group { fill: none; stroke: var(--group); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .node { fill: var(--surface); stroke: var(--border); stroke-width: 2; }
      .server-node { fill: var(--server-surface); stroke: var(--server-border); stroke-width: 2; }
      .runtime-node { fill: var(--surface-strong); stroke: var(--server-border); stroke-width: 2.5; }
      .client-node { fill: var(--client-surface); stroke: var(--client-border); stroke-width: 2; }
      .edge { fill: none; stroke: var(--border); stroke-width: 2.5; marker-end: url(#arrow); }
      .both { marker-start: url(#arrow); }
      .wire { stroke: var(--server-border); }
      .control { stroke-dasharray: 7 5; }
      .arrow-head { fill: var(--border); }
      .any { stroke-dasharray: 6 5; }
      .plain { marker-end: none; }
      .transport { fill: none; stroke: var(--client-border); stroke-width: 2; }
      .transport-label { fill: var(--client-border); font-size: 13px; font-weight: 700; letter-spacing: .08em; }
      .chunk { fill: var(--surface-strong); stroke: var(--server-border); stroke-width: 1.5; }
      .chunk-text { fill: var(--text); font-size: 11px; }
      .badge { fill: var(--badge); }
      .badge-text { fill: var(--badge-text); font-size: 12px; font-weight: 700; }
    </style>
  </defs>

  <!-- What the two peers see. -->
  <text class="group-label" x="550" y="36">WHAT THE TWO PEERS SEE</text>
  <rect class="runtime-node" x="40" y="60" width="210" height="64" rx="10"/>
  <text x="145" y="88">Source peer</text>
  <text class="secondary" x="145" y="108">control(message), block(bytes)</text>
  <rect class="runtime-node" x="850" y="60" width="210" height="64" rx="10"/>
  <text x="955" y="88">Destination peer</text>
  <text class="secondary" x="955" y="108">each delivered once</text>
  <path class="edge wire" d="M 250 92 H 848"/>
  <text class="edge-label" x="550" y="82">control messages once, in order; blocks once, in any order</text>

  <!-- What the sessions do. -->
  <text class="group-label" x="550" y="176">WHAT THE SESSIONS DO</text>
  <rect class="transport" x="30" y="196" width="350" height="300" rx="14"/>
  <text class="transport-label" x="205" y="222">SESSION</text>
  <rect class="transport" x="720" y="196" width="350" height="300" rx="14"/>
  <text class="transport-label" x="895" y="222">SESSION</text>
  <path class="edge any" d="M 145 124 V 250"/>
  <path class="edge any" d="M 955 318 V 126"/>
  <rect class="node" x="50" y="252" width="180" height="64" rx="10"/>
  <text x="140" y="279">numbered, kept</text>
  <text class="secondary" x="140" y="299">until the other side has it</text>
  <rect class="chunk" x="56" y="334" width="40" height="26" rx="5"/>
  <text class="chunk-text" x="76" y="351">c1</text>
  <rect class="chunk" x="100" y="334" width="40" height="26" rx="5"/>
  <text class="chunk-text" x="120" y="351">c2</text>
  <rect class="chunk" x="144" y="334" width="40" height="26" rx="5"/>
  <text class="chunk-text" x="164" y="351">B1</text>
  <rect class="chunk" x="188" y="334" width="40" height="26" rx="5"/>
  <text class="chunk-text" x="208" y="351">B2</text>
  <text class="secondary" x="140" y="384">control messages, blocks</text>
  <rect class="server-node" x="260" y="248" width="100" height="44" rx="8"/>
  <text x="310" y="275">writer</text>
  <rect class="runtime-node" x="740" y="248" width="100" height="44" rx="8"/>
  <text x="790" y="275">reader</text>
  <path class="edge wire" d="M 360 270 H 738"/>
  <text class="edge-label" x="550" y="260">stream 1 · control messages, ahead of fragments</text>
  <path class="edge any plain" d="M 738 284 H 362"/>
  <text class="edge-label" x="550" y="302">what the other side has, said back</text>
  <rect class="server-node" x="260" y="328" width="100" height="44" rx="8"/>
  <text x="310" y="355">writer</text>
  <rect class="runtime-node" x="740" y="328" width="100" height="44" rx="8"/>
  <text x="790" y="355">reader</text>
  <path class="edge any plain" d="M 360 350 H 738"/>
  <text class="edge-label" x="550" y="340">stream 2 · broke: what was on it goes on another</text>
  <text class="edge-label" x="550" y="368">the client makes another in its place</text>
  <rect class="server-node" x="260" y="408" width="100" height="44" rx="8"/>
  <text x="310" y="435">writer</text>
  <rect class="runtime-node" x="740" y="408" width="100" height="44" rx="8"/>
  <text x="790" y="435">reader</text>
  <path class="edge wire" d="M 360 430 H 738"/>
  <text class="edge-label" x="550" y="420">stream 3 · a block's fragments, where least is to write</text>
  <path class="edge" d="M 230 284 H 244 V 270 H 258"/>
  <path class="edge" d="M 244 284 V 350 H 258"/>
  <path class="edge" d="M 244 350 V 430 H 258"/>
  <rect class="node" x="880" y="318" width="170" height="64" rx="10"/>
  <text x="965" y="345">put together</text>
  <text class="secondary" x="965" y="365">each once, said back</text>
  <path class="edge" d="M 840 270 H 860 V 340 H 878"/>
  <path class="edge plain" d="M 840 350 H 860"/>
  <path class="edge plain" d="M 840 430 H 860 V 360 H 878"/>

  <!-- Notes. -->
  <text class="secondary" x="550" y="528">Every stream is equal: a channel of one of the client's SSH connections, or a socket pair on this machine.</text>
  <text class="secondary" x="550" y="550">The other direction works the same way. With no stream left for a minute, a session gives up.</text>
</svg>
