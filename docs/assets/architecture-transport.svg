<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="title description">
  <title id="title">The transport: pipes on the stream, as each server has them</title>
  <desc id="description">What the two peers see: a pipe for each kind of content, one way, in order. The Source's scan writes the manifest, and its data sender the data, each as records, waiting while the pipe's window is used up: 2 MiB for the manifest, 64 MiB for the data. The Destination reads them, to compare and to check, and its decider writes the answers back, with a window of 1 MiB. Control goes both ways, with no window, first. What the transport does, in each server: each pipe's bytes wait in a send buffer, and the pump of each stream takes what waits, control first, then the answers, then the data while a quarter of its buffer is full, the manifest otherwise. The manifest is one zstd stream; the data is cut into chunks of 2 MiB, compressed by 8 threads, numbered, on any stream. On the other side, one thread reads each stream, and never waits, as what comes always has room; it puts each pipe's bytes in its receive buffer, decompressed as the program reads them, the data's chunks by 8 threads, put back in order, and the window given back as the program reads. There are 1 to 8 streams, each an SSH channel, or one socket pair on this machine; the first carries every pipe, the others data. A pipe that ends before its end, or a connection that breaks, fails the transfer, and nothing makes it again. A server's control connection, and the link to a host's monitor, carry their pipes the same way.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      :root {
        --text: #172033;
        --muted-text: #526078;
        --surface: #f7f9fc;
        --surface-strong: #e9eef8;
        --border: #8491a8;
        --group: #b4bdcc;
        --client-surface: #e4f6ec;
        --client-border: #27875b;
        --server-surface: #e5efff;
        --server-border: #3478c8;
        --badge: #172033;
        --badge-text: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #eef3fb;
          --muted-text: #b5c0d3;
          --surface: #202938;
          --surface-strong: #2b3850;
          --border: #8390a6;
          --group: #5a667a;
          --client-surface: #173d30;
          --client-border: #5bc792;
          --server-surface: #193a62;
          --server-border: #72aef2;
          --badge: #eef3fb;
          --badge-text: #172033;
        }
      }
      text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; text-anchor: middle; }
      .secondary { fill: var(--muted-text); font-size: 13px; }
      .group-label { fill: var(--muted-text); font-size: 13px; font-weight: 600; letter-spacing: .08em; }
      .edge-label { fill: var(--muted-text); font-size: 12px; }
      .start-label { text-anchor: start; }
      .edge.plain { marker-end: none; }
      .phase { fill: none; stroke: var(--group); stroke-width: 2; }
      .phase-label { fill: var(--text); font-size: 14px; font-weight: 700; letter-spacing: .1em; }
      .group { fill: none; stroke: var(--group); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .node { fill: var(--surface); stroke: var(--border); stroke-width: 2; }
      .server-node { fill: var(--server-surface); stroke: var(--server-border); stroke-width: 2; }
      .runtime-node { fill: var(--surface-strong); stroke: var(--server-border); stroke-width: 2.5; }
      .client-node { fill: var(--client-surface); stroke: var(--client-border); stroke-width: 2; }
      .edge { fill: none; stroke: var(--border); stroke-width: 2.5; marker-end: url(#arrow); }
      .both { marker-start: url(#arrow); }
      .wire { stroke: var(--server-border); }
      .control { stroke-dasharray: 7 5; }
      .arrow-head { fill: var(--border); }
      .any { stroke-dasharray: 6 5; }
      .plain { marker-end: none; }
      .transport { fill: none; stroke: var(--client-border); stroke-width: 2; }
      .transport-label { fill: var(--client-border); font-size: 13px; font-weight: 700; letter-spacing: .08em; }
      .chunk { fill: var(--surface-strong); stroke: var(--server-border); stroke-width: 1.5; }
      .chunk-text { fill: var(--text); font-size: 11px; }
      .badge { fill: var(--badge); }
      .badge-text { fill: var(--badge-text); font-size: 12px; font-weight: 700; }
    </style>
  </defs>

  <!-- What the two peers see. -->
  <text class="group-label" x="550" y="36">WHAT THE TWO PEERS SEE</text>
  <rect class="runtime-node" x="40" y="56" width="240" height="150" rx="10"/>
  <text x="160" y="84">Source peer</text>
  <text class="secondary" x="160" y="112">the scan writes the manifest</text>
  <text class="secondary" x="160" y="140">the data sender writes the data</text>
  <text class="secondary" x="160" y="168">a thread reads the answers</text>
  <text class="secondary" x="160" y="192">and control</text>
  <rect class="runtime-node" x="820" y="56" width="240" height="150" rx="10"/>
  <text x="940" y="84">Destination peer</text>
  <text class="secondary" x="940" y="112">compares the manifest</text>
  <text class="secondary" x="940" y="140">checks the data</text>
  <text class="secondary" x="940" y="168">the decider writes the answers</text>
  <text class="secondary" x="940" y="192">and control</text>
  <path class="edge wire" d="M 282 106 H 818"/>
  <text class="edge-label" x="550" y="98">manifest: records, a window of 2 MiB</text>
  <path class="edge wire" d="M 282 134 H 818"/>
  <text class="edge-label" x="550" y="126">data: records, a window of 64 MiB</text>
  <path class="edge wire" d="M 818 162 H 284"/>
  <text class="edge-label" x="550" y="154">answers: records, a window of 1 MiB</text>
  <path class="edge wire both control" d="M 284 190 H 818"/>
  <text class="edge-label" x="550" y="182">control: an error, both ways, no window, first</text>

  <!-- What the transport does. -->
  <text class="group-label" x="550" y="252">WHAT THE TRANSPORT DOES</text>
  <rect class="transport" x="30" y="268" width="360" height="232" rx="14"/>
  <text class="transport-label" x="210" y="294">THE SOURCE'S SERVER</text>
  <rect class="server-node" x="50" y="308" width="320" height="58" rx="10"/>
  <text x="210" y="332">a send buffer for each pipe</text>
  <text class="secondary" x="210" y="352">its writer waits while the window is used up</text>
  <rect class="server-node" x="50" y="380" width="320" height="58" rx="10"/>
  <text x="210" y="404">a pump for each stream</text>
  <text class="secondary" x="210" y="424">control, answers, then data or manifest</text>
  <text class="secondary" x="210" y="464">the manifest one zstd stream; the data</text>
  <text class="secondary" x="210" y="482">in chunks of 2 MiB, 8 threads compressing</text>
  <path class="edge plain" d="M 210 366 V 380"/>

  <rect class="transport" x="710" y="268" width="360" height="232" rx="14"/>
  <text class="transport-label" x="890" y="294">THE DESTINATION'S SERVER</text>
  <rect class="runtime-node" x="730" y="308" width="320" height="58" rx="10"/>
  <text x="890" y="332">a receive buffer for each pipe</text>
  <text class="secondary" x="890" y="352">window given back as the program reads</text>
  <rect class="runtime-node" x="730" y="380" width="320" height="58" rx="10"/>
  <text x="890" y="404">a thread reads each stream</text>
  <text class="secondary" x="890" y="424">never waits: what comes always has room</text>
  <text class="secondary" x="890" y="464">decompressed as read; the data's chunks</text>
  <text class="secondary" x="890" y="482">by 8 threads, put back in order</text>
  <path class="edge plain" d="M 890 380 V 366"/>

  <path class="edge wire" d="M 372 400 H 728"/>
  <text class="edge-label" x="550" y="380">stream 1: every pipe</text>
  <rect class="chunk" x="462" y="390" width="58" height="20" rx="4"/>
  <text class="chunk-text" x="491" y="404">control</text>
  <rect class="chunk" x="524" y="390" width="58" height="20" rx="4"/>
  <text class="chunk-text" x="553" y="404">manifest</text>
  <rect class="chunk" x="586" y="390" width="58" height="20" rx="4"/>
  <text class="chunk-text" x="615" y="404">chunk 6</text>
  <path class="edge wire any" d="M 372 428 H 728"/>
  <rect class="chunk" x="493" y="418" width="58" height="20" rx="4"/>
  <text class="chunk-text" x="522" y="432">chunk 7</text>
  <rect class="chunk" x="555" y="418" width="58" height="20" rx="4"/>
  <text class="chunk-text" x="584" y="432">chunk 8</text>
  <text class="edge-label" x="550" y="456">streams 2 to K: the data's chunks</text>
  <text class="edge-label" x="550" y="478">1 to 8 streams, an SSH channel each,</text>
  <text class="edge-label" x="550" y="494">or a socket pair; window back the other way</text>

  <text class="secondary" x="550" y="536">A pipe that ends before its end, or a connection that breaks, fails the transfer, and nothing makes it again.</text>
  <text class="secondary" x="550" y="558">A server's control connection, and the link to a host's monitor, carry their pipes the same way, on one stream.</text>
</svg>
