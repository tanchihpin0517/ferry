<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="title description">
  <title id="title">The transport</title>
  <desc id="description">What the two ends, the client and a server, see: one connection between them; one sends messages, the other receives them, each whole and in the order sent. What the transport does underneath: the sending side's transport cuts messages into numbered pieces and gives each piece to the path with the shortest queue. Every path is equal: a channel of one of the transport's SSH connections, with no role of its own. The receiving side's transport puts the pieces back together and hands on whole messages, in order. The other direction works the same way.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      :root {
        --text: #172033;
        --muted-text: #526078;
        --surface: #f7f9fc;
        --surface-strong: #e9eef8;
        --border: #8491a8;
        --group: #b4bdcc;
        --client-surface: #e4f6ec;
        --client-border: #27875b;
        --server-surface: #e5efff;
        --server-border: #3478c8;
        --badge: #172033;
        --badge-text: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #eef3fb;
          --muted-text: #b5c0d3;
          --surface: #202938;
          --surface-strong: #2b3850;
          --border: #8390a6;
          --group: #5a667a;
          --client-surface: #173d30;
          --client-border: #5bc792;
          --server-surface: #193a62;
          --server-border: #72aef2;
          --badge: #eef3fb;
          --badge-text: #172033;
        }
      }
      text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; text-anchor: middle; }
      .secondary { fill: var(--muted-text); font-size: 13px; }
      .group-label { fill: var(--muted-text); font-size: 13px; font-weight: 600; letter-spacing: .08em; }
      .edge-label { fill: var(--muted-text); font-size: 12px; }
      .start-label { text-anchor: start; }
      .edge.plain { marker-end: none; }
      .phase { fill: none; stroke: var(--group); stroke-width: 2; }
      .phase-label { fill: var(--text); font-size: 14px; font-weight: 700; letter-spacing: .1em; }
      .group { fill: none; stroke: var(--group); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .node { fill: var(--surface); stroke: var(--border); stroke-width: 2; }
      .server-node { fill: var(--server-surface); stroke: var(--server-border); stroke-width: 2; }
      .runtime-node { fill: var(--surface-strong); stroke: var(--server-border); stroke-width: 2.5; }
      .client-node { fill: var(--client-surface); stroke: var(--client-border); stroke-width: 2; }
      .edge { fill: none; stroke: var(--border); stroke-width: 2.5; marker-end: url(#arrow); }
      .both { marker-start: url(#arrow); }
      .wire { stroke: var(--server-border); }
      .control { stroke-dasharray: 7 5; }
      .arrow-head { fill: var(--border); }
      .any { stroke-dasharray: 6 5; }
      .plain { marker-end: none; }
      .transport { fill: none; stroke: var(--client-border); stroke-width: 2; }
      .transport-label { fill: var(--client-border); font-size: 13px; font-weight: 700; letter-spacing: .08em; }
      .chunk { fill: var(--surface-strong); stroke: var(--server-border); stroke-width: 1.5; }
      .chunk-text { fill: var(--text); font-size: 11px; }
      .badge { fill: var(--badge); }
      .badge-text { fill: var(--badge-text); font-size: 12px; font-weight: 700; }
    </style>
  </defs>

  <!-- What the two ends see. -->
  <text class="group-label" x="550" y="36">WHAT THE TWO ENDS SEE</text>
  <rect class="client-node" x="40" y="60" width="190" height="64" rx="10"/>
  <text x="135" y="88">client</text>
  <text class="secondary" x="135" y="108">send(message)</text>
  <rect class="server-node" x="870" y="60" width="190" height="64" rx="10"/>
  <text x="965" y="88">server</text>
  <text class="secondary" x="965" y="108">recv()</text>
  <path class="edge both wire" d="M 230 92 H 868"/>
  <text class="edge-label" x="550" y="82">one connection: every message whole, in order</text>

  <!-- What the transport does. -->
  <text class="group-label" x="550" y="176">WHAT THE TRANSPORT DOES</text>
  <rect class="transport" x="30" y="196" width="350" height="300" rx="14"/>
  <text class="transport-label" x="205" y="222">TRANSPORT</text>
  <rect class="transport" x="720" y="196" width="350" height="300" rx="14"/>
  <text class="transport-label" x="895" y="222">TRANSPORT</text>
  <path class="edge any" d="M 135 124 V 250"/>
  <path class="edge any" d="M 965 250 V 126"/>
  <rect class="node" x="50" y="252" width="170" height="64" rx="10"/>
  <text x="135" y="279">cut into pieces</text>
  <text class="secondary" x="135" y="299">each numbered</text>
  <rect class="chunk" x="58" y="334" width="48" height="26" rx="5"/>
  <text class="chunk-text" x="82" y="351">1</text>
  <rect class="chunk" x="112" y="334" width="48" height="26" rx="5"/>
  <text class="chunk-text" x="136" y="351">2</text>
  <rect class="chunk" x="166" y="334" width="48" height="26" rx="5"/>
  <text class="chunk-text" x="190" y="351">3</text>
  <text class="secondary" x="135" y="384">pieces, in order</text>
  <rect class="server-node" x="260" y="248" width="100" height="44" rx="8"/>
  <text x="310" y="275">queue</text>
  <rect class="runtime-node" x="740" y="248" width="100" height="44" rx="8"/>
  <text x="790" y="275">path end</text>
  <path class="edge wire" d="M 360 270 H 738"/>
  <text class="edge-label" x="550" y="260">path 1</text>
  <rect class="server-node" x="260" y="328" width="100" height="44" rx="8"/>
  <text x="310" y="355">queue</text>
  <rect class="runtime-node" x="740" y="328" width="100" height="44" rx="8"/>
  <text x="790" y="355">path end</text>
  <path class="edge wire" d="M 360 350 H 738"/>
  <text class="edge-label" x="550" y="340">path 2</text>
  <rect class="server-node" x="260" y="408" width="100" height="44" rx="8"/>
  <text x="310" y="435">queue</text>
  <rect class="runtime-node" x="740" y="408" width="100" height="44" rx="8"/>
  <text x="790" y="435">path end</text>
  <path class="edge wire" d="M 360 430 H 738"/>
  <text class="edge-label" x="550" y="420">path 3</text>
  <path class="edge" d="M 220 284 H 240 V 270 H 258"/>
  <path class="edge" d="M 240 284 V 350 H 258"/>
  <path class="edge" d="M 240 350 V 430 H 258"/>
  <text class="edge-label" x="242" y="470">to the shortest queue</text>
  <rect class="node" x="880" y="318" width="170" height="64" rx="10"/>
  <text x="965" y="345">put back</text>
  <text class="secondary" x="965" y="365">whole, in order</text>
  <path class="edge" d="M 840 270 H 860 V 340 H 878"/>
  <path class="edge" d="M 840 350 H 878"/>
  <path class="edge plain" d="M 840 430 H 860 V 360"/>
  <path class="edge plain" d="M 965 318 V 252"/>

  <!-- Notes. -->
  <text class="secondary" x="550" y="528">Every path is equal: a channel of one of the transport's SSH connections, with no role of its own.</text>
  <text class="secondary" x="550" y="550">The other direction works the same way.</text>
</svg>
