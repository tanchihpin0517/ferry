<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="title description">
  <title id="title">The transport: one stream, as each server has it</title>
  <desc id="description">What the two peers see: the Source peer writes its packets, and the Destination peer reads them, as they are, in the order written, whole, each once; the needs and results go back the same way. What the stream adds, in each server: its writer sends the peer's packets on as they come, and the stream's end once its peer is done. Its reader takes the end out, so that no peer sees it, and reads to the end; it takes the stream for broken once it ends without its end, and the peer reading it then fails, and the transfer with it. Its silence breaks nothing: whether the far end is there is the monitors' to judge, by their heartbeat. There is one stream: a channel of the host's one SSH connection, or a socket pair on this machine, which the client made and touches none of. Nothing makes it again. The other direction works the same way.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      :root {
        --text: #172033;
        --muted-text: #526078;
        --surface: #f7f9fc;
        --surface-strong: #e9eef8;
        --border: #8491a8;
        --group: #b4bdcc;
        --client-surface: #e4f6ec;
        --client-border: #27875b;
        --server-surface: #e5efff;
        --server-border: #3478c8;
        --badge: #172033;
        --badge-text: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #eef3fb;
          --muted-text: #b5c0d3;
          --surface: #202938;
          --surface-strong: #2b3850;
          --border: #8390a6;
          --group: #5a667a;
          --client-surface: #173d30;
          --client-border: #5bc792;
          --server-surface: #193a62;
          --server-border: #72aef2;
          --badge: #eef3fb;
          --badge-text: #172033;
        }
      }
      text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; text-anchor: middle; }
      .secondary { fill: var(--muted-text); font-size: 13px; }
      .group-label { fill: var(--muted-text); font-size: 13px; font-weight: 600; letter-spacing: .08em; }
      .edge-label { fill: var(--muted-text); font-size: 12px; }
      .start-label { text-anchor: start; }
      .edge.plain { marker-end: none; }
      .phase { fill: none; stroke: var(--group); stroke-width: 2; }
      .phase-label { fill: var(--text); font-size: 14px; font-weight: 700; letter-spacing: .1em; }
      .group { fill: none; stroke: var(--group); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .node { fill: var(--surface); stroke: var(--border); stroke-width: 2; }
      .server-node { fill: var(--server-surface); stroke: var(--server-border); stroke-width: 2; }
      .runtime-node { fill: var(--surface-strong); stroke: var(--server-border); stroke-width: 2.5; }
      .client-node { fill: var(--client-surface); stroke: var(--client-border); stroke-width: 2; }
      .edge { fill: none; stroke: var(--border); stroke-width: 2.5; marker-end: url(#arrow); }
      .both { marker-start: url(#arrow); }
      .wire { stroke: var(--server-border); }
      .control { stroke-dasharray: 7 5; }
      .arrow-head { fill: var(--border); }
      .any { stroke-dasharray: 6 5; }
      .plain { marker-end: none; }
      .transport { fill: none; stroke: var(--client-border); stroke-width: 2; }
      .transport-label { fill: var(--client-border); font-size: 13px; font-weight: 700; letter-spacing: .08em; }
      .chunk { fill: var(--surface-strong); stroke: var(--server-border); stroke-width: 1.5; }
      .chunk-text { fill: var(--text); font-size: 11px; }
      .badge { fill: var(--badge); }
      .badge-text { fill: var(--badge-text); font-size: 12px; font-weight: 700; }
    </style>
  </defs>

  <!-- What the two peers see. -->
  <text class="group-label" x="550" y="36">WHAT THE TWO PEERS SEE</text>
  <rect class="runtime-node" x="40" y="60" width="210" height="64" rx="10"/>
  <text x="145" y="88">Source peer</text>
  <text class="secondary" x="145" y="108">writes its packets</text>
  <rect class="runtime-node" x="850" y="60" width="210" height="64" rx="10"/>
  <text x="955" y="88">Destination peer</text>
  <text class="secondary" x="955" y="108">reads them, as they are</text>
  <path class="edge wire" d="M 252 84 H 848"/>
  <text class="edge-label" x="550" y="74">the packets, in order, whole, each once: the manifest, the data, messages</text>
  <path class="edge wire" d="M 848 108 H 254"/>
  <text class="edge-label" x="550" y="124">the needs, the results, messages: the same way back</text>

  <!-- What the stream adds. -->
  <text class="group-label" x="550" y="176">WHAT THE STREAM ADDS</text>
  <rect class="transport" x="30" y="196" width="340" height="190" rx="14"/>
  <text class="transport-label" x="200" y="222">THE SOURCE'S SERVER</text>
  <rect class="server-node" x="50" y="240" width="300" height="64" rx="10"/>
  <text x="200" y="267">writer</text>
  <text class="secondary" x="200" y="287">the peer's packets, as they come</text>
  <text class="secondary" x="200" y="339">its end, once its peer is done;</text>
  <text class="secondary" x="200" y="357">nothing more</text>
  <rect class="transport" x="730" y="196" width="340" height="190" rx="14"/>
  <text class="transport-label" x="900" y="222">THE DESTINATION'S SERVER</text>
  <rect class="runtime-node" x="750" y="240" width="300" height="64" rx="10"/>
  <text x="900" y="267">reader</text>
  <text class="secondary" x="900" y="287">takes its own packets out</text>
  <text class="secondary" x="900" y="330">an end without its end: broken,</text>
  <text class="secondary" x="900" y="348">and the peer reading it fails, the</text>
  <text class="secondary" x="900" y="366">transfer too; silence breaks nothing</text>
  <path class="edge wire" d="M 352 272 H 748"/>
  <text class="edge-label" x="550" y="262">the one stream</text>
  <text class="edge-label" x="550" y="292">an SSH channel, or a socket pair</text>
  <rect class="chunk" x="451" y="306" width="60" height="22" rx="4"/>
  <text class="chunk-text" x="481" y="321">packet</text>
  <rect class="chunk" x="517" y="306" width="60" height="22" rx="4"/>
  <text class="chunk-text" x="547" y="321">packet</text>
  <rect class="chunk" x="583" y="306" width="60" height="22" rx="4"/>
  <text class="chunk-text" x="613" y="321">end</text>
  <text class="secondary" x="550" y="420">One stream, which the client made and touches none of: should it break, the transfer fails, and nothing makes it again.</text>
  <text class="secondary" x="550" y="442">The other direction works the same way: each server has a writer and a reader.</text>
</svg>
