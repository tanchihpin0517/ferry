<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="title description">
  <title id="title">The heartbeat's path</title>
  <desc id="description">The heartbeat goes from a thread in the client, through the ssh -W that carries the connection the launcher is followed by, the ssh master, TCP and sshd, to the launcher. Anything on that path that stops, or goes silent, is taken for the connection lost: from the other end it cannot be told apart, so each side cleans up within 30 s. Off the path, the stream's ssh, a server on this machine, and on the host the servers, sudo's check and fixtures, are each watched by another process, the client or the launcher: stopped, they are seen, and reported, and the user decides.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      :root {
        --text: #172033; --muted-text: #526078; --surface: #f7f9fc; --surface-strong: #e9eef8;
        --border: #8491a8; --group: #b4bdcc; --client-surface: #e4f6ec; --client-border: #27875b;
        --server-surface: #e5efff; --server-border: #3478c8; --warn-surface: #fdf0e1; --warn-border: #c47a1d;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #eef3fb; --muted-text: #b5c0d3; --surface: #202938; --surface-strong: #2b3850;
          --border: #8390a6; --group: #5a667a; --client-surface: #173d30; --client-border: #5bc792;
          --server-surface: #193a62; --server-border: #72aef2; --warn-surface: #4a3417; --warn-border: #e0a456;
        }
      }
      text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 15px; text-anchor: middle; }
      .secondary { fill: var(--muted-text); font-size: 12.5px; }
      .group-label { fill: var(--muted-text); font-size: 13px; font-weight: 600; letter-spacing: .08em; }
      .edge-label { fill: var(--muted-text); font-size: 12px; }
      .start { text-anchor: start; }
      .group { fill: none; stroke: var(--group); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .node { fill: var(--surface); stroke: var(--border); stroke-width: 2; }
      .client { fill: var(--client-surface); stroke: var(--client-border); stroke-width: 2; }
      .server { fill: var(--server-surface); stroke: var(--server-border); stroke-width: 2; }
      .warn { fill: var(--warn-surface); stroke: var(--warn-border); stroke-width: 2; }
      .strong { fill: var(--surface-strong); stroke: var(--border); stroke-width: 1.5; }
      .tree { fill: none; stroke: var(--border); stroke-width: 1.8; }
      .edge { fill: none; stroke: var(--border); stroke-width: 2.2; marker-end: url(#arrow); }
      .both { marker-start: url(#arrow); }
      .beat { stroke: var(--server-border); stroke-dasharray: 8 5; }
      .arrow-head { fill: var(--border); }
    </style>
  </defs>

  <text class="group-label" x="550" y="34">ON THE PATH: STOPPED OR SILENT, THE CONNECTION IS LOST; EACH SIDE CLEANS UP WITHIN 30 S</text>
  <rect class="client" x="30" y="60" width="150" height="64" rx="10"/>
  <text x="105.0" y="88.0">client</text>
  <text class="secondary" x="105.0" y="106.0">heartbeat thread</text>
  <path class="edge both beat" d="M 182 92 H 206"/>
  <rect class="node" x="208" y="60" width="150" height="64" rx="10"/>
  <text x="283.0" y="88.0">ssh -W</text>
  <text class="secondary" x="283.0" y="106.0">follow connection</text>
  <path class="edge both beat" d="M 360 92 H 384"/>
  <rect class="node" x="386" y="60" width="150" height="64" rx="10"/>
  <text x="461.0" y="88.0">ssh master</text>
  <text class="secondary" x="461.0" y="106.0">yours or Ferry's</text>
  <path class="edge both beat" d="M 538 92 H 562"/>
  <rect class="node" x="564" y="60" width="150" height="64" rx="10"/>
  <text x="639.0" y="88.0">TCP</text>
  <text class="secondary" x="639.0" y="106.0">the network</text>
  <path class="edge both beat" d="M 716 92 H 740"/>
  <rect class="node" x="742" y="60" width="150" height="64" rx="10"/>
  <text x="817.0" y="88.0">sshd</text>
  <text class="secondary" x="817.0" y="106.0">on the host</text>
  <path class="edge both beat" d="M 894 92 H 918"/>
  <rect class="server" x="920" y="60" width="150" height="64" rx="10"/>
  <text x="995.0" y="88.0">launcher</text>
  <text class="secondary" x="995.0" y="106.0">heartbeat</text>
  <text class="group-label" x="550" y="196">OFF THE PATH: STOPPED, IT IS SEEN; ITS WATCHER REPORTS IT, AND THE USER DECIDES</text>
  <rect class="client" x="30" y="220" width="330" height="64" rx="10"/>
  <text x="195.0" y="248.0">the client watches</text>
  <text class="secondary" x="195.0" y="266.0">as a Child: stopped, continued, ended</text>
  <rect class="node" x="30" y="320" width="155" height="64" rx="10"/>
  <text x="107.5" y="357.0">stream's ssh -W</text>
  <rect class="node" x="205" y="320" width="155" height="64" rx="10"/>
  <text x="282.5" y="357.0">local server</text>
  <path class="edge" d="M 107 286 V 318"/>
  <path class="edge" d="M 282 286 V 318"/>
  <rect class="server" x="740" y="220" width="330" height="64" rx="10"/>
  <text x="905.0" y="248.0">the launcher watches</text>
  <text class="secondary" x="905.0" y="266.0">as a Child, and tells the client</text>
  <rect class="node" x="740" y="320" width="100" height="64" rx="10"/>
  <text x="790.0" y="357.0">server</text>
  <rect class="node" x="855" y="320" width="100" height="64" rx="10"/>
  <text x="905.0" y="348.0">sudo</text>
  <text x="905.0" y="366.0">check</text>
  <rect class="node" x="970" y="320" width="100" height="64" rx="10"/>
  <text x="1020.0" y="357.0">fixture</text>
  <path class="edge" d="M 790 286 V 318"/>
  <path class="edge" d="M 905 286 V 318"/>
  <path class="edge" d="M 1020 286 V 318"/>
  <path class="tree" d="M 995 126 V 218"/>
  <path class="tree" d="M 105 126 V 218"/>
  <text class="secondary" x="550" y="300">reports go to the user over the live connection:</text>
  <text class="secondary" x="550" y="318">the launcher's on the connection it is followed by</text>
  <text class="secondary" x="550" y="430">Each thing that can get stuck has a watcher that is not itself, so that while the connection lives,</text>
  <text class="secondary" x="550" y="450">even a process stuck whole is seen. A wait in the kernel (D state) shows only as alive and not stopped.</text>
</svg>
