<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title description">
  <title id="title">A monitor in each place</title>
  <desc id="description">Each place has one monitor: the client's machine one, in the client; each host one, which is the launcher. It is the top of its place, and holds every resource there: connections, listeners, children; starting a worker is how it gets one. The two share one core, which does no input or output: it holds the scope tree and only decides. Watchers do the input and output, and hand it events: the heartbeat, children stopped, continued or ended, the user's signals, the wires. Its actions: start a worker or open a connection, end a scope, send stop, report, end. Below it, a worker, a server, with the peer inside, hears only stop and says only done or failed; it holds a lifeline, a pipe its monitor holds the other end of, and stops once that closes. The two monitors are paired over the connection the client follows the launcher by: the only link for health, and for control.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      :root {
        --text: #172033; --muted-text: #526078; --surface: #f7f9fc; --surface-strong: #e9eef8;
        --border: #8491a8; --group: #b4bdcc; --client-surface: #e4f6ec; --client-border: #27875b;
        --server-surface: #e5efff; --server-border: #3478c8; --warn-surface: #fdf0e1; --warn-border: #c47a1d;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #eef3fb; --muted-text: #b5c0d3; --surface: #202938; --surface-strong: #2b3850;
          --border: #8390a6; --group: #5a667a; --client-surface: #173d30; --client-border: #5bc792;
          --server-surface: #193a62; --server-border: #72aef2; --warn-surface: #4a3417; --warn-border: #e0a456;
        }
      }
      text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 15px; text-anchor: middle; }
      .secondary { fill: var(--muted-text); font-size: 12.5px; }
      .group-label { fill: var(--muted-text); font-size: 13px; font-weight: 600; letter-spacing: .08em; }
      .edge-label { fill: var(--muted-text); font-size: 12px; }
      .start { text-anchor: start; }
      .group { fill: none; stroke: var(--group); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .node { fill: var(--surface); stroke: var(--border); stroke-width: 2; }
      .client { fill: var(--client-surface); stroke: var(--client-border); stroke-width: 2; }
      .server { fill: var(--server-surface); stroke: var(--server-border); stroke-width: 2; }
      .warn { fill: var(--warn-surface); stroke: var(--warn-border); stroke-width: 2; }
      .strong { fill: var(--surface-strong); stroke: var(--border); stroke-width: 1.5; }
      .tree { fill: none; stroke: var(--border); stroke-width: 1.8; }
      .edge { fill: none; stroke: var(--border); stroke-width: 2.2; marker-end: url(#arrow); }
      .both { marker-start: url(#arrow); }
      .beat { stroke: var(--server-border); stroke-dasharray: 8 5; }
      .arrow-head { fill: var(--border); }
    </style>
  </defs>

  <rect class="group" x="20" y="20" width="1060" height="390" rx="14"/>
  <text class="group-label" x="550.0" y="46">EACH PLACE: THE CLIENT'S MACHINE, AND EACH HOST, WHERE IT IS THE LAUNCHER</text>
  <rect class="node" x="40" y="64" width="240" height="56" rx="10"/>
  <text x="160.0" y="88.0">heartbeat</text>
  <text class="secondary" x="160.0" y="106.0">with the other monitor</text>
  <path class="edge" d="M 282 92 C 330 92, 330 176, 378 176"/>
  <rect class="node" x="40" y="136" width="240" height="56" rx="10"/>
  <text x="160.0" y="160.0">Child</text>
  <text class="secondary" x="160.0" y="178.0">stopped, continued, ended</text>
  <path class="edge" d="M 282 164 C 330 164, 330 176, 378 176"/>
  <rect class="node" x="40" y="208" width="240" height="56" rx="10"/>
  <text x="160.0" y="232.0">signals</text>
  <text class="secondary" x="160.0" y="250.0">Ctrl-C, SIGTERM, SIGHUP</text>
  <path class="edge" d="M 282 236 C 330 236, 330 176, 378 176"/>
  <rect class="node" x="40" y="280" width="240" height="56" rx="10"/>
  <text x="160.0" y="304.0">Wire, Listener</text>
  <text class="secondary" x="160.0" y="322.0">data, an end, a connection</text>
  <path class="edge" d="M 282 308 C 330 308, 330 176, 378 176"/>
  <text class="secondary" x="160" y="362">watchers: do the I/O, hand in events</text>
  <rect class="strong" x="380" y="110" width="340" height="132" rx="10"/>
  <text x="550.0" y="145.0">monitor core</text>
  <text class="secondary" x="550.0" y="163.0">no I/O: holds the scope tree,</text>
  <text class="secondary" x="550.0" y="181.0">only decides; time given from</text>
  <text class="secondary" x="550.0" y="199.0">outside, so tested with made-up</text>
  <text class="secondary" x="550.0" y="217.0">events and time</text>
  <rect class="client" x="820" y="64" width="240" height="56" rx="10"/>
  <text x="940.0" y="88.0">start a worker</text>
  <text class="secondary" x="940.0" y="106.0">or open a connection</text>
  <path class="edge" d="M 722 176 C 770 176, 770 92, 818 92"/>
  <rect class="client" x="820" y="136" width="240" height="56" rx="10"/>
  <text x="940.0" y="160.0">end a scope</text>
  <text class="secondary" x="940.0" y="178.0">and all under it</text>
  <path class="edge" d="M 722 176 C 770 176, 770 164, 818 164"/>
  <rect class="client" x="820" y="208" width="240" height="56" rx="10"/>
  <text x="940.0" y="232.0">send stop, report</text>
  <text class="secondary" x="940.0" y="250.0">to the other monitor, a worker</text>
  <path class="edge" d="M 722 176 C 770 176, 770 236, 818 236"/>
  <rect class="warn" x="820" y="280" width="240" height="56" rx="10"/>
  <text x="940.0" y="304.0">end</text>
  <text class="secondary" x="940.0" y="322.0">once its children have</text>
  <path class="edge" d="M 722 176 C 770 176, 770 308, 818 308"/>
  <text class="secondary" x="940" y="362">actions</text>
  <rect class="server" x="380" y="300" width="340" height="80" rx="10"/>
  <text x="550.0" y="318.0">worker: a server</text>
  <text class="secondary" x="550.0" y="336.0">the peer inside: owner, decider,</text>
  <text class="secondary" x="550.0" y="354.0">executors; it stops on stop, or</text>
  <text class="secondary" x="550.0" y="372.0">once its lifeline closes</text>
  <path class="edge" d="M 500 244 V 298"/>
  <path class="edge" d="M 600 298 V 244"/>
  <text class="edge-label" x="450" y="272">stop, why</text>
  <text class="edge-label" x="660" y="272">done, failed</text>
  <path class="tree beat" d="M 378 364 H 345 V 224 H 378"/>
  <text class="edge-label" x="345" y="386">lifeline</text>
  <text class="secondary" x="550" y="440">Paired with the other place's monitor over the follow connection: the only link for health, and for control.</text>
  <text class="secondary" x="550" y="464">Lifecycle only: not speed, which control.rs and --profile keep; not data, nor files; the peer stops its stages itself.</text>
</svg>
