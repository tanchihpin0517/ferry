<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title description">
  <title id="title">Every wait belongs to a scope</title>
  <desc id="description">Scopes form a tree. On the client, the transfer is the root; under it, each host; under each host, its connections, the first session, the connection the launcher is followed by, each control connection, and the stream half, and the ssh processes that carry them; a server on this machine hangs from the transfer itself, as the client's child. On the host, the launcher is the root; under it, its listener, and what it started: servers, sudo's check, fixtures. The client's connection to the launcher carries the host's heartbeat. A scope ends for one reason only, and everything under it ends with it.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      :root {
        --text: #172033; --muted-text: #526078; --surface: #f7f9fc; --surface-strong: #e9eef8;
        --border: #8491a8; --group: #b4bdcc; --client-surface: #e4f6ec; --client-border: #27875b;
        --server-surface: #e5efff; --server-border: #3478c8; --warn-surface: #fdf0e1; --warn-border: #c47a1d;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #eef3fb; --muted-text: #b5c0d3; --surface: #202938; --surface-strong: #2b3850;
          --border: #8390a6; --group: #5a667a; --client-surface: #173d30; --client-border: #5bc792;
          --server-surface: #193a62; --server-border: #72aef2; --warn-surface: #4a3417; --warn-border: #e0a456;
        }
      }
      text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 15px; text-anchor: middle; }
      .secondary { fill: var(--muted-text); font-size: 12.5px; }
      .group-label { fill: var(--muted-text); font-size: 13px; font-weight: 600; letter-spacing: .08em; }
      .edge-label { fill: var(--muted-text); font-size: 12px; }
      .start { text-anchor: start; }
      .group { fill: none; stroke: var(--group); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .node { fill: var(--surface); stroke: var(--border); stroke-width: 2; }
      .client { fill: var(--client-surface); stroke: var(--client-border); stroke-width: 2; }
      .server { fill: var(--server-surface); stroke: var(--server-border); stroke-width: 2; }
      .warn { fill: var(--warn-surface); stroke: var(--warn-border); stroke-width: 2; }
      .strong { fill: var(--surface-strong); stroke: var(--border); stroke-width: 1.5; }
      .tree { fill: none; stroke: var(--border); stroke-width: 1.8; }
      .edge { fill: none; stroke: var(--border); stroke-width: 2.2; marker-end: url(#arrow); }
      .both { marker-start: url(#arrow); }
      .beat { stroke: var(--server-border); stroke-dasharray: 8 5; }
      .arrow-head { fill: var(--border); }
    </style>
  </defs>

  <rect class="group" x="20" y="20" width="600" height="380" rx="14"/>
  <text class="group-label" x="320.0" y="46">CLIENT</text>
  <rect class="group" x="650" y="20" width="430" height="380" rx="14"/>
  <text class="group-label" x="865.0" y="46">HOST A</text>
  <rect class="client" x="40" y="64" width="560" height="60" rx="10"/>
  <text x="320.0" y="90.0">client monitor: the transfer</text>
  <text class="secondary" x="320.0" y="108.0">ends on Ctrl-C, a failure, or any host scope ending</text>
  <rect class="node" x="40" y="168" width="140" height="60" rx="10"/>
  <text x="110.0" y="194.0">this machine</text>
  <text class="secondary" x="110.0" y="212.0">no Liveness</text>
  <rect class="client" x="200" y="168" width="400" height="60" rx="10"/>
  <text x="400.0" y="194.0">host A</text>
  <text class="secondary" x="400.0" y="212.0">ends when host A's Liveness says gone</text>
  <path class="tree" d="M 320 124 V 146 H 110 V 166"/>
  <path class="tree" d="M 320 146 H 400 V 166"/>
  <rect class="node" x="40" y="272" width="140" height="60" rx="10"/>
  <text x="110.0" y="298.0">local server</text>
  <text class="secondary" x="110.0" y="316.0">a worker; lifeline</text>
  <path class="tree" d="M 110 228 V 270"/>
  <rect class="node" x="200" y="272" width="94" height="60" rx="10"/>
  <text x="247.0" y="298.0">first</text>
  <text x="247.0" y="316.0">session</text>
  <rect class="node" x="302" y="272" width="94" height="60" rx="10"/>
  <text x="349.0" y="298.0">control</text>
  <text x="349.0" y="316.0">connection</text>
  <rect class="node" x="404" y="272" width="94" height="60" rx="10"/>
  <text x="451.0" y="298.0">stream</text>
  <text x="451.0" y="316.0">half</text>
  <rect class="server" x="506" y="272" width="94" height="60" rx="10"/>
  <text x="553.0" y="298.0">follow the</text>
  <text x="553.0" y="316.0">launcher</text>
  <path class="tree" d="M 400 228 V 250"/>
  <path class="tree" d="M 247 250 H 553"/>
  <path class="tree" d="M 247 250 V 270"/>
  <path class="tree" d="M 349 250 V 270"/>
  <path class="tree" d="M 451 250 V 270"/>
  <path class="tree" d="M 553 250 V 270"/>
  <text class="secondary" x="400" y="360">each a Wire, carried by an ssh process: a Child</text>
  <rect class="server" x="670" y="168" width="390" height="60" rx="10"/>
  <text x="865.0" y="194.0">host monitor: the launcher</text>
  <text class="secondary" x="865.0" y="212.0">ends: not followed in 30 s, or no heartbeat</text>
  <rect class="node" x="670" y="272" width="124" height="60" rx="10"/>
  <text x="732.0" y="298.0">listener</text>
  <text class="secondary" x="732.0" y="316.0">accept, secrets</text>
  <rect class="node" x="803" y="272" width="124" height="60" rx="10"/>
  <text x="865.0" y="298.0">server</text>
  <text class="secondary" x="865.0" y="316.0">a worker; lifeline</text>
  <rect class="node" x="936" y="272" width="124" height="60" rx="10"/>
  <text x="998.0" y="298.0">sudo check</text>
  <text class="secondary" x="998.0" y="316.0">or a fixture</text>
  <path class="tree" d="M 865 228 V 250"/>
  <path class="tree" d="M 732 250 H 998"/>
  <path class="tree" d="M 732 250 V 270"/>
  <path class="tree" d="M 865 250 V 270"/>
  <path class="tree" d="M 998 250 V 270"/>
  <path class="edge both beat" d="M 602 302 H 635 V 198 H 668"/>
  <text class="edge-label" x="865" y="118">the heartbeat, on the connection</text>
  <text class="edge-label" x="865" y="134">the client follows the launcher by:</text>
  <text class="edge-label" x="865" y="150">sent every 5 s, gone after 30 s</text>
  <text class="secondary" x="550" y="440">A scope ends for one reason only, and everything under it ends with it.</text>
  <text class="secondary" x="550" y="466">Each wait, a read, a write, an accept, a child's end, returns once what it waits for comes, or its scope ends.</text>
</svg>
