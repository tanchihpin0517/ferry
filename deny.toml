# What `cargo deny check` holds the dependencies to, as `make deny` and CI
# run it: no crate with a known advisory, or yanked; none under a license
# not among those below, which ask only that their notice go with the
# binary, as the release's THIRD-PARTY-LICENSES does; none from anywhere but
# crates.io.

# Only what the release builds, for the platforms it ships.
[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# ISC, as MIT asks only that its notice go with the binary, for these two
# alone: notify, which the watcher uses on macOS, takes them on Linux, where
# Ferry does not build it, so that no release holds them.
#
# BSD-2-Clause, BSD-3-Clause less its clause on names, for zstd-sys alone:
# from 2.1.3 it says so of the decoders of zstd's legacy formats, which it
# builds only with its `legacy` feature, and Ferry does not ask for it.
exceptions = [
    { allow = ["ISC"], crate = "inotify" },
    { allow = ["ISC"], crate = "inotify-sys" },
    { allow = ["BSD-2-Clause"], crate = "zstd-sys" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
